name: Spectra Anchor Node Estate Fabric Runtime 01

on:
  pull_request:
    paths:
      - "mating_surface/anchor_node/fabric_runtime.mjs"
      - "mating_surface/anchor_node/fixtures/mp01-invented-seat-registry.json"
      - "mating_surface/anchor_node/conformance/fabric_runtime.test.mjs"
      - ".github/workflows/spectra-anchor-node-fabric-runtime-01.yml"
  push:
    branches:
      - main
    paths:
      - "mating_surface/anchor_node/fabric_runtime.mjs"
      - "mating_surface/anchor_node/fixtures/mp01-invented-seat-registry.json"
      - "mating_surface/anchor_node/conformance/fabric_runtime.test.mjs"
      - ".github/workflows/spectra-anchor-node-fabric-runtime-01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spectra-anchor-node-fabric-runtime-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-fabric-runtime-01:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Refuse network, credential, and private-identifier surfaces
        run: |
          if grep -nE "node:(http|https|net|tls)|(^|[^A-Za-z])fetch[[:space:]]*\(" \
            mating_surface/anchor_node/fabric_runtime.mjs; then
            echo "::error::Fabric runtime contains a network surface"
            exit 1
          fi
          if grep -R -nE "AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer" \
            mating_surface/anchor_node/fabric_runtime.mjs \
            mating_surface/anchor_node/fixtures/mp01-invented-seat-registry.json \
            mating_surface/anchor_node/conformance/fabric_runtime.test.mjs; then
            echo "::error::Fabric runtime surface contains credential material"
            exit 1
          fi
          if grep -nE "OCTO-(W|L)[0-9]+|([A-Za-z]:\\\\)|/home/|ssh://|https?://" \
            mating_surface/anchor_node/fixtures/mp01-invented-seat-registry.json; then
            echo "::error::Public seat fixture contains private or endpoint-shaped material"
            exit 1
          fi

      - name: Check exact runtime syntax
        run: |
          node --check mating_surface/anchor_node/fabric_runtime.mjs
          node --check mating_surface/anchor_node/conformance/fabric_runtime.test.mjs

      - name: Run the closed fabric-routing adversarial suite
        run: |
          mkdir -p qualification/anchor-node-fabric-runtime-01
          node --test mating_surface/anchor_node/conformance/fabric_runtime.test.mjs \
            | tee qualification/anchor-node-fabric-runtime-01/test-output.txt

      - name: Build the admitted MP01 predecessor twice
        run: |
          node mating_surface/anchor_node/vertical_slice.mjs run \
            mating_surface/anchor_node/fixtures/mp01-observation-package.json \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-a.json
          node mating_surface/anchor_node/vertical_slice.mjs run \
            mating_surface/anchor_node/fixtures/mp01-observation-package.json \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-b.json
          cmp \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-a.json \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-b.json

      - name: Build the fabric routing slice twice and refuse drift
        run: |
          node mating_surface/anchor_node/fabric_runtime.mjs run \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-a.json \
            qualification/anchor-node-fabric-runtime-01/routing-slice-a.json
          node mating_surface/anchor_node/fabric_runtime.mjs run \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-b.json \
            qualification/anchor-node-fabric-runtime-01/routing-slice-b.json
          cmp \
            qualification/anchor-node-fabric-runtime-01/routing-slice-a.json \
            qualification/anchor-node-fabric-runtime-01/routing-slice-b.json

      - name: Verify detached routing replay twice
        run: |
          node mating_surface/anchor_node/fabric_runtime.mjs verify \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-a.json \
            qualification/anchor-node-fabric-runtime-01/routing-slice-a.json \
            qualification/anchor-node-fabric-runtime-01/verification-a.json
          node mating_surface/anchor_node/fabric_runtime.mjs verify \
            qualification/anchor-node-fabric-runtime-01/vertical-slice-b.json \
            qualification/anchor-node-fabric-runtime-01/routing-slice-b.json \
            qualification/anchor-node-fabric-runtime-01/verification-b.json
          cmp \
            qualification/anchor-node-fabric-runtime-01/verification-a.json \
            qualification/anchor-node-fabric-runtime-01/verification-b.json

      - name: Preserve fabric-routing qualification receipts
        uses: actions/upload-artifact@v4
        with:
          name: spectra-anchor-node-fabric-runtime-01-${{ github.sha }}
          path: qualification/anchor-node-fabric-runtime-01/
          if-no-files-found: error
          retention-days: 14
