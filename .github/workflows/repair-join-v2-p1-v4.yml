name: Repair JOIN v2 verifier custody P1s v4

on:
  push:
    branches:
      - review/axm-head-physical-long-haul-001-join-v2
    paths:
      - ".github/workflows/repair-join-v2-p1-v4.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: review/axm-head-physical-long-haul-001-join-v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply narrow repairs
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair_join_v2/01_patch_verifier.py
          python .github/repair_join_v2/02_patch_bootstrap.py
          python .github/repair_join_v2/03_patch_witnesses.py

      - name: Qualify repaired permanent product
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_001_join_v2.py' \
            -v 2>&1 | tee /tmp/join-v2-repair-tests.txt
          grep -F "Ran 46 tests" /tmp/join-v2-repair-tests.txt
          grep -Fx "OK" /tmp/join-v2-repair-tests.txt
          git diff --check

      - name: Commit repaired permanent product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add \
            .github/workflows/axm-head-physical-long-haul-001-join-v2.yml \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py
          git commit -m "Close JOIN v2 verifier custody findings"
          git push origin HEAD:review/axm-head-physical-long-haul-001-join-v2
