name: Repair PR61 authorization custody P1s

on:
  push:
    branches:
      - admission/axm-head-physical-long-haul-join-v2-postflight
    paths:
      - ".github/workflows/repair-pr61-authorization-custody.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr61-authorization-custody
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: admission/axm-head-physical-long-haul-join-v2-postflight

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify carrier custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e8b58959215abc338177aafbb050522d9a808fd9 HEAD
          observed="$(git diff --name-only e8b58959215abc338177aafbb050522d9a808fd9 HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/repair-pr61-authorization-custody.py \
            .github/workflows/repair-pr61-authorization-custody.yml | sort)"
          test "$observed" = "$expected"
          test "$(git status --porcelain)" = ""

      - name: Materialize corrective product
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair-pr61-authorization-custody.py | tee /tmp/repair-receipt.json
          python -m json.tool /tmp/repair-receipt.json >/dev/null

      - name: Preserve deterministic RSA hostile witnesses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py")
          text = path.read_text(encoding="utf-8")

          old_signature = (
              '        forged = copy.deepcopy(value)\n'
              '        provenance = forged["privateEvidenceProvenance"]\n'
              '        replacement = "A" if provenance["signatureBase64Url"][-1] != "A" else "B"\n'
              '        provenance["signatureBase64Url"] = provenance["signatureBase64Url"][:-1] + replacement\n'
              '        provenance["provenanceId"] = mod.content_id(\n'
              '            "axmheadprivateevidenceprovenance2",\n'
              '            mod.body_without(provenance, "provenanceId"),\n'
              '        )\n'
              '        forged_result = self.evaluate_with_test_trust_root(forged)\n'
          )
          new_signature = (
              '        forged = copy.deepcopy(value)\n'
              '        provenance = forged["privateEvidenceProvenance"]\n'
              '        signature_bytes = bytearray(\n'
              '            mod.base64url_decode(\n'
              '                provenance["signatureBase64Url"],\n'
              '                "privateEvidenceProvenance.signatureBase64Url",\n'
              '            )\n'
              '        )\n'
              '        signature_bytes[0] ^= 1\n'
              '        provenance["signatureBase64Url"] = mod.base64url_encode(bytes(signature_bytes))\n'
              '        provenance["provenanceId"] = mod.content_id(\n'
              '            "axmheadprivateevidenceprovenance2",\n'
              '            mod.body_without(provenance, "provenanceId"),\n'
              '        )\n'
              '        forged_result = self.evaluate_with_test_trust_root(forged)\n'
          )
          if text.count(old_signature) != 1:
              raise SystemExit(f"signature witness anchor count differs: {text.count(old_signature)}")
          text = text.replace(old_signature, new_signature, 1)

          old_modulus = (
              '        signature_integer = int.from_bytes(signature_bytes, "big")\n'
              '        modulus = int(TEST_PRIVATE_PROVENANCE_TRUST_ROOT["modulusHex"], 16)\n'
              '        congruent_integer = signature_integer + modulus\n'
              '        self.assertLess(congruent_integer, 1 << (8 * len(signature_bytes)))\n'
          )
          new_modulus = (
              '        modulus = int(TEST_PRIVATE_PROVENANCE_TRUST_ROOT["modulusHex"], 16)\n'
              '        congruent_integer = modulus\n'
              '        self.assertLess(congruent_integer, 1 << (8 * len(signature_bytes)))\n'
          )
          if text.count(old_modulus) != 1:
              raise SystemExit(f"modulus witness anchor count differs: {text.count(old_modulus)}")
          text = text.replace(old_modulus, new_modulus, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Qualify corrective product
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          python mating_surface/anchor_node/axm_head_physical_long_haul_join.py validate-profile \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json
          python mating_surface/anchor_node/axm_head_physical_long_haul_join.py validate-fixtures \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee /tmp/focused.txt
          grep -F "Ran 76 tests" /tmp/focused.txt
          grep -Fx "OK" /tmp/focused.txt
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_flight_preflight_review_card_01.py' \
            -v 2>&1 | tee /tmp/preflight.txt
          grep -F "Ran 49 tests" /tmp/preflight.txt
          grep -Fx "OK" /tmp/preflight.txt
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -v 2>&1 | tee /tmp/axm.txt
          grep -F "Ran 38 tests" /tmp/axm.txt
          grep -Fx "OK" /tmp/axm.txt
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' \
            -v 2>&1 | tee /tmp/conductor.txt
          grep -F "Ran 25 tests" /tmp/conductor.txt
          grep -Fx "OK" /tmp/conductor.txt
          git diff --check

      - name: Remove carrier and publish exact successor
        shell: bash
        env:
          BRANCH: admission/axm-head-physical-long-haul-join-v2-postflight
        run: |
          set -euo pipefail
          find mating_surface -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm \
            .github/repair-pr61-authorization-custody.py \
            .github/workflows/repair-pr61-authorization-custody.yml
          git add \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py
          observed="$(git diff --name-only e8b58959215abc338177aafbb050522d9a808fd9 | sort)"
          expected="$(printf '%s\n' \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py | sort)"
          test "$observed" = "$expected"
          product="$(git diff --name-only ec61bc3488cb5ae06ed9db2862a9f6910d310a79 | sort)"
          denominator="$(printf '%s\n' \
            .github/workflows/axm-head-physical-long-haul-join-01.yml \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
            mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1 \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py | sort)"
          test "$product" = "$denominator"
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git commit -m "Close JOIN-v2 authorization custody and cell identity P1s"
          git push origin "HEAD:${BRANCH}"
