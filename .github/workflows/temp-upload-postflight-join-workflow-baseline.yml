name: TEMP upload postflight JOIN workflow baseline commit

on:
  push:
    branches:
      - work/axm-head-postflight-join-final-conductor-01
    paths:
      - ".github/workflows/temp-upload-postflight-join-workflow-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-upload-postflight-join-workflow-baseline
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-postflight-join-final-conductor-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recreate and qualify permanent repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/temp-fix-postflight-join-workflow-baseline.py
          python .github/temp-fix-postflight-join-workflow-baseline.py
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          python mating_surface/anchor_node/axm_head_physical_long_haul_join.py validate-profile \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json
          python mating_surface/anchor_node/axm_head_physical_long_haul_join.py validate-fixtures \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/join-tests.txt"
          grep -F "Ran 81 tests" "$RUNNER_TEMP/join-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/join-tests.txt"
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/conductor-tests.txt"
          grep -F "Ran 32 tests" "$RUNNER_TEMP/conductor-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/conductor-tests.txt"
          git diff --check

      - name: Upload permanent Git objects for exact ref advancement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-fix-postflight-join-workflow-baseline.yml
          rm .github/workflows/temp-upload-postflight-join-workflow-baseline.yml
          rm .github/temp-fix-postflight-join-workflow-baseline.py
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/axm-head-physical-long-haul-join-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md",
              "mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json",
              "mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1",
              "mating_surface/anchor_node/axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "dd486472a8c610a20ee062dd6746c86fe8ede4b4"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"permanent product denominator differs: expected={sorted(expected)} observed={sorted(actual)}")
          PY
          git commit -m "Qualify postflight JOIN against the event base"
          printf 'UPLOADED_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'UPLOADED_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/work/axm-head-postflight-join-final-conductor-01
