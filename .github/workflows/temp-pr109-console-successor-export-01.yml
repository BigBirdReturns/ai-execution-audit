name: TEMP PR109 Console Successor Export 01

on:
  push:
    branches:
      - ops/pr109-console-successor-finalizer-01
    paths:
      - ".github/workflows/temp-pr109-console-successor-export-01.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-pr109-console-successor-export-01
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PACKET_COMMIT: 0df3795b47a58903adc86c68db2b1168de543ab7
  PACKET_TREE: d05b33f066ee1b9aea731a1027de4c87f61b074b
  SOURCE_BINDING: axmoperatorconsolesource_de6bb5383a5e9fdb74389732db8e02b5c9e03ce58c0fd8dcbe6a3d2122ae7cde
  EXTENSION_ID: axmoperatorconsoleextension_6eca06a8e593d026f78b8daaadbc1f8817a7e0e69744e9e4281b05e392541703

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/pr109-console-successor-finalizer-01
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconstruct and verify the exact carrier
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-00 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-01 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-02a \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-02b \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-03 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04a \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b0 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b1 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b2 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b3 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a0 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a1 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a2 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a3 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a4 \
            .agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a5 \
            | base64 --decode > "$RUNNER_TEMP/finalizer.zip"
          [[ "$(wc -c < "$RUNNER_TEMP/finalizer.zip")" -eq 34129 ]]
          [[ "$(sha256sum "$RUNNER_TEMP/finalizer.zip" | awk '{print $1}')" == d745848b817cc69f9c46b89812bdeb572a464401c044568f56769d020456955b ]]
          mkdir -p "$RUNNER_TEMP/finalizer"
          unzip -q "$RUNNER_TEMP/finalizer.zip" -d "$RUNNER_TEMP/finalizer"
          ROOT="$RUNNER_TEMP/finalizer/AXM-PR109-Console-Successor-Finalizer-01"
          python "$ROOT/verify_carrier.py" "$ROOT"

      - name: Reproduce the qualified local successor and export exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/finalizer/AXM-PR109-Console-Successor-Finalizer-01"
          python - "$ROOT/finalize_pr109_console_successor.py" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")
          old = '''    replace_exact(
                  workflow_path,
                  "          import subprocess\\n\\n          profile = json.loads(pathlib.Path(\\n",
                  "          import subprocess\\n          import sys\\n          import tempfile\\n\\n          profile = json.loads(pathlib.Path(\\n",
                  count=1,
              )
          '''
          new = old.replace("count=1", "count=2")
          if data.count(old) != 1 or data.count(new) != 0:
              raise SystemExit("import-preamble recipe repair denominator differs")
          path.write_text(data.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          python -m py_compile "$ROOT/finalize_pr109_console_successor.py"
          gh auth setup-git
          set +e
          python "$ROOT/finalize_pr109_console_successor.py" \
            --work-root "$RUNNER_TEMP/finalizer-work" \
            --receipt-root "$RUNNER_TEMP/finalizer-receipts" \
            --stop-after-console-pr \
            > "$RUNNER_TEMP/finalizer-terminal.json"
          code=$?
          set -e
          [[ "$code" -eq 2 ]] || { echo "unexpected finalizer exit: $code" >&2; exit 2; }

          python - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import subprocess
          import sys
          import zipfile

          temp = pathlib.Path(sys.argv[1])
          repo = temp / "finalizer-work" / "repo"
          receipts = temp / "finalizer-receipts"
          terminal = json.loads((temp / "finalizer-terminal.json").read_text(encoding="utf-8"))
          reason = str(terminal.get("reason", ""))
          if terminal.get("status") != "REFUSED" or "refusing to allow a GitHub App to create or update workflow" not in reason:
              raise SystemExit(f"unexpected finalizer terminal: {terminal}")
          qualification = json.loads((receipts / "qualification.json").read_text(encoding="utf-8"))
          if qualification.get("status") != "PASS" or qualification.get("witnessDenominator") != 83 or qualification.get("fixtureCaseDenominator") != 52:
              raise SystemExit(f"qualification denominator differs: {qualification}")
          if qualification.get("sourceBindingId") != "axmoperatorconsolesource_de6bb5383a5e9fdb74389732db8e02b5c9e03ce58c0fd8dcbe6a3d2122ae7cde":
              raise SystemExit(qualification)
          if qualification.get("extensionId") != "axmoperatorconsoleextension_6eca06a8e593d026f78b8daaadbc1f8817a7e0e69744e9e4281b05e392541703":
              raise SystemExit(qualification)

          expected = {
              ".github/workflows/axm-head-browser-physical-audition-operator-console-01.yml": "ebca395eb96e796544ba724305d85190a19f8d4f25154a00aca4bcfd359dd9c8",
              "mating_surface/anchor_node/AXM-HEAD-BROWSER-PHYSICAL-AUDITION-OPERATOR-CONSOLE-01.md": "bad954ffb3dd2db0c6d2c0e331fbb3f4c054a7528fddc0bdac069198fc64b82e",
              "mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json": "f9e3b76e66b683f54a2066ba8a301b9d50e367d783d8f88e4179bd46faf15d9a",
              "mating_surface/anchor_node/axm_head_browser_physical_audition_operator_console_01.py": "df4b5d8e6c0db86c144a86bd4edc10b2a32e401f79e7c1495a7262392d5cf267",
              "mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01.py": "ca1e30c46d07883b48968d1fc18ef3c31b3f4245175f6867ba18eb5d492300ea",
              "mating_surface/anchor_node/conformance/test_axm_head_browser_physical_audition_operator_console_01.py": "775825a62347f33ec070ac5f202459d052d957259b7155ec47cbb3607c7086b1",
          }
          changed = set(subprocess.check_output(["git", "-C", str(repo), "diff", "--name-only", "0df3795b47a58903adc86c68db2b1168de543ab7", "HEAD"], text=True).splitlines())
          if changed != set(expected):
              raise SystemExit(f"candidate path denominator differs: {sorted(changed)}")
          parent_row = subprocess.check_output(["git", "-C", str(repo), "rev-list", "--parents", "-n", "1", "HEAD"], text=True).split()
          if len(parent_row) != 2 or parent_row[1] != "0df3795b47a58903adc86c68db2b1168de543ab7":
              raise SystemExit(f"candidate parent differs: {parent_row}")
          candidate_head = parent_row[0]
          candidate_tree = subprocess.check_output(["git", "-C", str(repo), "rev-parse", "HEAD^{tree}"], text=True).strip()

          export = temp / "console-source-export"
          if export.exists():
              shutil.rmtree(export)
          members = []
          for relative, wanted in sorted(expected.items()):
              source = repo / relative
              data = source.read_bytes()
              observed = hashlib.sha256(data).hexdigest()
              if observed != wanted:
                  raise SystemExit(f"source digest differs: {relative}: {observed}")
              target = export / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              members.append({
                  "path": relative,
                  "bytes": len(data),
                  "sha256": "sha256:" + observed,
                  "gitBlobSha": subprocess.check_output(["git", "-C", str(repo), "hash-object", relative], text=True).strip(),
              })
          manifest = {
              "schema": "axm-private/pr109-console-successor-source-export@1",
              "status": "PASS",
              "packetAdmissionCommit": "0df3795b47a58903adc86c68db2b1168de543ab7",
              "packetAdmissionTree": "d05b33f066ee1b9aea731a1027de4c87f61b074b",
              "candidateHead": candidate_head,
              "candidateTree": candidate_tree,
              "memberCount": len(members),
              "members": members,
              "witnessDenominator": 83,
              "fixtureCaseDenominator": 52,
              "sourceBindingId": qualification["sourceBindingId"],
              "extensionId": qualification["extensionId"],
              "physicalExecutionObserved": False,
              "browserLaunched": False,
              "supplierEndpointContacted": False,
              "modelDownloaded": False,
              "peerConnectionFormed": False,
              "inferenceExecuted": False,
              "routeTerminalProduced": False,
              "actualSupplierQualified": False,
              "physicalEstateQualified": False,
              "missionAuthority": "none",
              "commandAuthority": "none",
          }
          (export / "SOURCE-EXPORT.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          archive = temp / "pr109-console-successor-source-export.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for path in sorted(export.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(export).as_posix()
                  info = zipfile.ZipInfo(relative, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  output.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (temp / "pr109-console-successor-source-export.zip.sha256").write_text(f"{digest}  {archive.name}\n", encoding="ascii")
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY

      - name: Upload exact qualified source export
        uses: actions/upload-artifact@v4
        with:
          name: pr109-console-successor-source-export-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr109-console-successor-source-export.zip
            ${{ runner.temp }}/pr109-console-successor-source-export.zip.sha256
            ${{ runner.temp }}/console-source-export/SOURCE-EXPORT.json
          if-no-files-found: error
          retention-days: 14
