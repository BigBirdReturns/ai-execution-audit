name: Materialize operator-flight single-action repair

on:
  push:
    branches:
      - work/operator-flight-single-action-01
    paths:
      - ".operator-flight-repair/**"
      - ".github/workflows/materialize-operator-flight-single-action-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-operator-flight-single-action-01
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/operator-flight-single-action-01
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct and authenticate repair program
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          root = Path('.operator-flight-repair')
          parts = [root / f'part-{index:02d}' for index in range(5)]
          if not all(path.is_file() for path in parts):
              raise SystemExit('repair fragment denominator differs')
          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          data = base64.b64decode(encoded, validate=True)
          if len(data) != 26168:
              raise SystemExit(f'repair program byte count differs: {len(data)}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != '47974ce051317a44b3571163cb9f9dc83c718aaecd5e7223d1b43bd1bfe90725':
              raise SystemExit(f'repair program digest differs: {digest}')
          (root / 'apply.py').write_bytes(data)
          PY

      - name: Apply bounded source repair
        shell: bash
        run: python .operator-flight-repair/apply.py

      - name: Qualify repaired source
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_conductor.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_conductor.py
          python mating_surface/anchor_node/stc_mary_flight_conductor.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-conductor-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' -v 2>&1 | tee /tmp/operator-tests.txt
          grep -F 'Ran 31 tests' /tmp/operator-tests.txt
          grep -Fx 'OK' /tmp/operator-tests.txt
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_local_toolchain.py' -v
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_offline_carrier.py' -v
          git diff --check

      - name: Stage product and authenticated workflow payload
        shell: bash
        run: |
          git rm .operator-flight-repair/part-00 \
                 .operator-flight-repair/part-01 \
                 .operator-flight-repair/part-02 \
                 .operator-flight-repair/part-03 \
                 .operator-flight-repair/part-04
          rm -f .operator-flight-repair/apply.py
          git add \
            mating_surface/anchor_node/stc_mary_flight_conductor.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_conductor.py \
            mating_surface/anchor_node/STC-MARY-FLIGHT-CONDUCTOR-RUNBOOK.md \
            .operator-flight-repair/final-workflow.yml
          git diff --cached --check

      - name: Commit qualified intermediate
        shell: bash
        run: |
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git commit -m "Make operator-flight single-action and fail-closed"
          git push origin HEAD:refs/heads/work/operator-flight-single-action-01
