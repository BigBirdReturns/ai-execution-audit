name: TEMP fix STC MARY cartridge ancestor-link custody

on:
  push:
    branches:
      - work/stc-mary-flight-01-cartridge-02
    paths:
      - ".github/workflows/temp-fix-stc-mary-cartridge-ancestor-links-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-stc-mary-cartridge-ancestor-links-01
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/stc-mary-flight-01-cartridge-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply ancestor-link custody repair
        shell: bash
        run: |
          python .github/temp-fix-stc-mary-cartridge-ancestor-links-01.py

      - name: Qualify repaired source locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python mating_surface/anchor_node/stc_mary_flight_01_cartridge.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "OK" "$RUNNER_TEMP/cartridge-tests.txt"
          git diff --check

      - name: Replace temporary sources with permanent product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/temp-fix-stc-mary-cartridge-ancestor-links-01.yml
          rm -f .github/temp-fix-stc-mary-cartridge-ancestor-links-01.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/stc-mary-flight-01-cartridge-01.yml",
              "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md",
              "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1",
              "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "dd486472a8c610a20ee062dd6746c86fe8ede4b4"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"branch product denominator differs: expected={sorted(expected)} observed={sorted(actual)}"
              )
          PY

          git commit -m "Refuse linked ancestor components in cartridge coordinates"
          git push origin HEAD:refs/heads/work/stc-mary-flight-01-cartridge-02
