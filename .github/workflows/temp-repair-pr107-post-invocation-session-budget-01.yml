name: TEMP Repair PR107 Post-Invocation Session Budget 01

on:
  push:
    branches:
      - work/axm-head-browser-audition-operation-plan-01
    paths:
      - ".github/workflows/temp-repair-pr107-post-invocation-session-budget-01.yml"

permissions:
  contents: write

concurrency:
  group: temp-repair-pr107-post-invocation-session-budget-01
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  BASE_COMMIT: ce93cf8856b7fcc9b172b9251b9665df50fdeda4
  BASE_TREE: 664784d10309665eb3b993ce8f6df4eb5b10baf7
  PRODUCT_BRANCH: work/axm-head-browser-audition-operation-plan-product-01
  PRODUCT_HEAD: 3b200c0eddf1f8688763c4e81f0f9cca63355441
  PRODUCT_TREE: 8ebe69f182997d473569abf59b8aea61176c6b0e
  REPAIR_BRANCH: repair/pr107-post-invocation-session-budget-01

jobs:
  qualify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/axm-head-browser-audition-operation-plan-01
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Require exact floor, candidate, and repair ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$PRODUCT_BRANCH" "$REPAIR_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_COMMIT" ]] || {
            echo "main moved" >&2
            exit 2
          }
          [[ "$(git rev-parse 'origin/main^{tree}')" == "$BASE_TREE" ]] || {
            echo "main tree differs" >&2
            exit 2
          }
          [[ "$(git rev-parse "origin/$PRODUCT_BRANCH")" == "$PRODUCT_HEAD" ]] || {
            echo "product branch moved" >&2
            exit 2
          }
          [[ "$(git rev-parse "$PRODUCT_HEAD^{tree}")" == "$PRODUCT_TREE" ]] || {
            echo "product tree differs" >&2
            exit 2
          }
          [[ "$(git rev-parse "origin/$REPAIR_BRANCH")" == "$PRODUCT_HEAD" ]] || {
            echo "repair branch is not at the exact product predecessor" >&2
            exit 2
          }

      - name: Apply the exact request-accounting repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_HEAD"
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement denominator differs for {path}: {count}")
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          python_path = "mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py"
          replace_exact(
              python_path,
              "MAX_RECEIPT_COUNT = 9\nMAX_SESSION_REQUESTS = 512\n",
              "MAX_RECEIPT_COUNT = 9\nMAX_SESSION_REQUESTS = 512\nSESSION_REQUESTS_PER_PROBE_INVOCATION = 2\nSESSION_REQUEST_RESERVE = 4\n",
          )
          replace_exact(
              python_path,
              "        \"maximumReceiptCount\": MAX_RECEIPT_COUNT,\n        \"operatorMaximumSessionRequests\": MAX_SESSION_REQUESTS,\n",
              "        \"maximumReceiptCount\": MAX_RECEIPT_COUNT,\n        \"operatorMaximumSessionRequests\": MAX_SESSION_REQUESTS,\n        \"sessionRequestReserve\": SESSION_REQUEST_RESERVE,\n        \"sessionRequestsPerProbeInvocation\": SESSION_REQUESTS_PER_PROBE_INVOCATION,\n",
          )
          replace_exact(
              python_path,
              '''def normalized_plan_body(plan: dict[str, Any]) -> dict[str, Any]:
