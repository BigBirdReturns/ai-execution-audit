name: Export current-conductor postflight join source

on:
  push:
    branches:
      - work/axm-head-postflight-join-current-conductor-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-postflight-join-current-conductor-01
          fetch-depth: 0

      - name: Verify exact clean source coordinate
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Export exact Git object bytes
        shell: bash
        run: |
          git archive --format=tar HEAD | gzip -n > source.tar.gz
          git rev-parse HEAD > SOURCE-HEAD.txt
          git rev-parse 'HEAD^{tree}' > SOURCE-TREE.txt
          sha256sum source.tar.gz > source.tar.gz.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-postflight-current-conductor-source
          path: |
            source.tar.gz
            source.tar.gz.sha256
            SOURCE-HEAD.txt
            SOURCE-TREE.txt
          if-no-files-found: error
          retention-days: 3
