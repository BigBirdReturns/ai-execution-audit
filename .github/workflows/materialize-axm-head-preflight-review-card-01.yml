name: Materialize AXM HEAD Preflight Review Card 01

on:
  push:
    branches:
      - work/axm-head-physical-flight-preflight-review-card-01
    paths:
      - ".github/reclassify_axm_head_preflight_review_card_01.py"
      - ".github/bind_preflight_claim_boundary_01.py"
      - ".github/run_preflight_reclassification_01.py"
      - ".github/workflows/materialize-axm-head-preflight-review-card-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-axm-head-preflight-review-card-01
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact work branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/axm-head-physical-flight-preflight-review-card-01

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the held predecessor and bounded branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "work/axm-head-physical-flight-preflight-review-card-01"
          git merge-base --is-ancestor 6dd91e8b48a24907655e11cc624279f93bd81801 HEAD
          test -f .github/reclassify_axm_head_preflight_review_card_01.py
          test -f .github/bind_preflight_claim_boundary_01.py
          test -f .github/run_preflight_reclassification_01.py
          test -f .github/workflows/materialize-axm-head-preflight-review-card-01.yml
          test -f mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py
          test ! -e mating_surface/anchor_node/axm_head_physical_flight_preflight_review_card_01.py
          git diff --check

      - name: Reclassify the exact eight-file product
        shell: bash
        run: |
          set -euo pipefail
          python .github/run_preflight_reclassification_01.py | tee "$RUNNER_TEMP/reclassification.json"
          python .github/bind_preflight_claim_boundary_01.py | tee "$RUNNER_TEMP/claim-binding.txt"
          git diff --check

      - name: Qualify the reclassified product before commit
        shell: bash
        run: |
          set -euo pipefail
          TOOL="mating_surface/anchor_node/axm_head_physical_flight_preflight_review_card_01.py"
          PROFILE="mating_surface/anchor_node/axm-head-physical-flight-preflight-review-card-01-profile.json"
          VERIFIER="mating_surface/anchor_node/verify_axm_head_physical_flight_preflight_review_card_01.py"
          BOOTSTRAP="mating_surface/anchor_node/verify_axm_head_physical_flight_preflight_review_card_01_bootstrap.py"
          TESTS="mating_surface/anchor_node/conformance/test_axm_head_physical_flight_preflight_review_card_01.py"
          WORKFLOW=".github/workflows/axm-head-physical-flight-preflight-review-card-01.yml"
          CONTRACT="mating_surface/anchor_node/AXM-HEAD-PHYSICAL-FLIGHT-PREFLIGHT-REVIEW-CARD-01.md"
          WRAPPER="mating_surface/anchor_node/axm-head-physical-flight-preflight-review-card-01.ps1"

          for path in "$TOOL" "$PROFILE" "$VERIFIER" "$BOOTSTRAP" "$TESTS" "$WORKFLOW" "$CONTRACT" "$WRAPPER"
          do
            test -f "$path"
            if grep -q $'\r' "$path"; then
              echo "CR byte refused: $path" >&2
              exit 1
            fi
          done

          python -m py_compile "$TOOL" "$VERIFIER" "$BOOTSTRAP" "$TESTS"
          python "$TOOL" validate-profile "$PROFILE" | tee "$RUNNER_TEMP/profile-validation.json"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_flight_preflight_review_card_01.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/preflight-tests.txt"
          grep -F "Ran 49 tests" "$RUNNER_TEMP/preflight-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/preflight-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/inherited-axm-head-tests.txt"
          grep -F "Ran 38 tests" "$RUNNER_TEMP/inherited-axm-head-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/inherited-axm-head-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/inherited-conductor-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/inherited-conductor-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/inherited-conductor-tests.txt"

          CARRIER="$RUNNER_TEMP/axm-head-preflight-review-card-01-carrier"
          VERDICT="$RUNNER_TEMP/axm-head-preflight-review-card-01-verdict.json"
          rm -rf "$CARRIER" "$VERDICT"
          python "$TOOL" build-carrier "$PROFILE" --out "$CARRIER" | tee "$RUNNER_TEMP/build.json"
          python "$TOOL" verify-carrier "$CARRIER" --out "$VERDICT" > "$RUNNER_TEMP/verdict-stdout.json"
          cmp "$VERDICT" "$RUNNER_TEMP/verdict-stdout.json"

          python - "$PROFILE" "$TOOL" "$VERIFIER" "$BOOTSTRAP" "$CARRIER" "$VERDICT" <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import ast
          import hashlib
          import json
          import re
          import sys

          profile_path, tool_path, verifier_path, bootstrap_path, carrier_path, verdict_path = map(Path, sys.argv[1:])
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          verdict = json.loads(verdict_path.read_text(encoding="utf-8"))
          manifest = json.loads((carrier_path / "MANIFEST.json").read_text(encoding="utf-8"))

          expected_claim = (
              "Public physical-flight preflight review-card contract binding the admitted AXM HEAD mission-volume contract to "
              "the admitted STC MARY conductor, frozen physical-flight floor, and sole issue #37 execution coordinate. It may "
              "validate body-free private coordinate headers and compile an exact unauthorized operator card for separate "
              "named-human review, but it performs no physical action, materializes no mission volume, launches no worker, "
              "creates no listener, grants no authorization, consumes no private evidence body, and establishes no physical "
              "Estate, representative operator, field network, operational C2, production Lattice, mission, command, targeting, "
              "engagement, effector, or weapons qualification or authority."
          )
          if profile["schema"] != "axm-head/physical-flight-preflight-review-card-profile/1":
              raise SystemExit("profile schema differs")
          if profile["profileId"] != "axm-head/physical-flight-preflight-review-card@1":
              raise SystemExit("profileId differs")
          if profile["claimBoundary"] != expected_claim:
              raise SystemExit("profile claim boundary differs")

          def assignment(path: Path, name: str):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == name for target in node.targets):
                      return ast.literal_eval(node.value)
              raise SystemExit(f"assignment absent: {path}:{name}")

          if assignment(tool_path, "CLAIM_BOUNDARY") != expected_claim:
              raise SystemExit("builder claim boundary differs")
          if assignment(verifier_path, "CLAIM_BOUNDARY") != expected_claim:
              raise SystemExit("verifier claim boundary differs")

          verifier_digest = hashlib.sha256(verifier_path.read_bytes()).hexdigest()
          if assignment(tool_path, "STANDALONE_VERIFIER_SHA256") != verifier_digest:
              raise SystemExit("builder verifier digest differs")
          if assignment(bootstrap_path, "EXPECTED_VERIFIER_SHA256") != verifier_digest:
              raise SystemExit("bootstrap verifier digest differs")

          expected_members = [
              "PREFLIGHT/preparation-state.json",
              "PREFLIGHT/decision.json",
              "PUBLIC/status.json",
              "RECOVERY/profile.json",
              "RECOVERY/verify_preflight.py",
          ]
          if [row["path"] for row in manifest["files"]] != expected_members:
              raise SystemExit("carrier member denominator differs")
          if verdict["status"] != "PASS" or verdict["terminal"] != "PREPARED_NOT_ARMED":
              raise SystemExit("authenticated verdict differs")
          if verdict["bootstrapAuthenticated"] is not True:
              raise SystemExit("verifier authentication differs")
          if verdict["physicalAuthorizationProduced"] is not False:
              raise SystemExit("authorization claim promoted")
          if verdict["physicalExecutionStarted"] is not False:
              raise SystemExit("execution claim promoted")
          if verdict["workersLaunched"] != 0 or verdict["listenersCreated"] != 0:
              raise SystemExit("runtime activity promoted")
          if verdict["authority"] != "none":
              raise SystemExit("authority promoted")

          old_tokens = (
              "physical-long-haul",
              "JOIN-v2",
              "join-v2",
              "join_v2",
              "JoinV2",
              "joinContractId",
              "join_contract_id",
              "axmheadjoin",
              "axmheadphysjoin",
              "AXM_HEAD_JOIN_V2",
              "verify_join.py",
              '"JOIN"',
          )
          product_text = "\n".join(path.read_text(encoding="utf-8") for path in (
              tool_path,
              verifier_path,
              bootstrap_path,
              profile_path,
          ))
          for token in old_tokens:
              if token in product_text:
                  raise SystemExit(f"predecessor identity survived: {token}")
          PY

      - name: Collapse to the exact eight-file successor tree and push
        shell: bash
        run: |
          set -euo pipefail
          BASE="b452bb32e26249deab90db124f157bc62ad0850d"
          BRANCH="work/axm-head-physical-flight-preflight-review-card-01"

          rm -f \
            .github/reclassify_axm_head_preflight_review_card_01.py \
            .github/bind_preflight_claim_boundary_01.py \
            .github/run_preflight_reclassification_01.py \
            .github/workflows/materialize-axm-head-preflight-review-card-01.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          python - "$BASE" <<'PY'
          from __future__ import annotations
          import subprocess
          import sys

          base = sys.argv[1]
          expected = {
              ("A", ".github/workflows/axm-head-physical-flight-preflight-review-card-01.yml"),
              ("A", "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-FLIGHT-PREFLIGHT-REVIEW-CARD-01.md"),
              ("A", "mating_surface/anchor_node/axm-head-physical-flight-preflight-review-card-01-profile.json"),
              ("A", "mating_surface/anchor_node/axm-head-physical-flight-preflight-review-card-01.ps1"),
              ("A", "mating_surface/anchor_node/axm_head_physical_flight_preflight_review_card_01.py"),
              ("A", "mating_surface/anchor_node/conformance/test_axm_head_physical_flight_preflight_review_card_01.py"),
              ("A", "mating_surface/anchor_node/verify_axm_head_physical_flight_preflight_review_card_01.py"),
              ("A", "mating_surface/anchor_node/verify_axm_head_physical_flight_preflight_review_card_01_bootstrap.py"),
          }
          output = subprocess.run(
              ["git", "diff", "--cached", "--name-status", base],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
          ).stdout
          observed = set()
          for line in output.splitlines():
              if not line:
                  continue
              fields = line.split("\t")
              if len(fields) != 2:
                  raise SystemExit(f"unexpected diff row: {line}")
              observed.add((fields[0], fields[1]))
          if observed != expected:
              raise SystemExit(f"final path denominator differs: observed={sorted(observed)} expected={sorted(expected)}")
          PY

          git commit -m "Reclassify the AXM HEAD physical-flight preflight review card"
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'final_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'final_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
