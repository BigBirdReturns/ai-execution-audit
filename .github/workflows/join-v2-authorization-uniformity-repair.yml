name: JOIN-v2 Authorization Uniformity Repair Carrier

on:
  push:
    branches:
      - admission/axm-head-physical-long-haul-join-v2-postflight
    paths:
      - ".github/workflows/join-v2-authorization-uniformity-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact admission branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build intermediate and final repair bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path("mating_surface/anchor_node")
          verifier_path = root / "verify_axm_head_physical_long_haul_join.py"
          bootstrap_path = root / "axm_head_physical_long_haul_join.py"
          test_path = root / "conformance" / "test_axm_head_physical_long_haul_join.py"
          staging = Path(".join-v2-authorization-uniformity-repair")
          staging.mkdir(exist_ok=False)

          verifier_original = verifier_path.read_text(encoding="utf-8")
          bootstrap_original = bootstrap_path.read_text(encoding="utf-8")
          test_original = test_path.read_text(encoding="utf-8")

          old_campaigns = '    campaigns = [route["campaignId"], continuity["campaignId"], two_cell["campaignId"], successor["campaignId"], disposition["campaignId"]]\n'
          final_campaigns = '    campaigns = [route["campaignId"], continuity["campaignId"], two_cell["campaignId"], successor["campaignId"], disposition["campaignId"], authorization["campaignId"]]\n'
          old_auth_refs = '    auth_refs = [route["authorizationReceiptId"], continuity["authorizationReceiptId"], two_cell["authorizationReceiptId"], successor["authorizationReceiptId"]]\n'
          final_auth_refs = '    auth_refs = [route["authorizationReceiptId"], continuity["authorizationReceiptId"], two_cell["authorizationReceiptId"], successor["authorizationReceiptId"], disposition["authorizationReceiptId"]]\n'

          if verifier_original.count(old_campaigns) != 1:
              raise SystemExit("campaign uniformity anchor differs")
          if verifier_original.count(old_auth_refs) != 1:
              raise SystemExit("authorization-reference uniformity anchor differs")

          verifier_final = verifier_original.replace(old_campaigns, final_campaigns, 1).replace(old_auth_refs, final_auth_refs, 1)
          verifier_intermediate = verifier_final.replace(
              final_campaigns,
              final_campaigns + "    # Temporary authorization-uniformity repair-carrier marker; absent from the final tree.\n",
              1,
          )
          if verifier_intermediate == verifier_final:
              raise SystemExit("intermediate verifier marker was not inserted")

          old_campaign_test = '''    def test_campaign_identity_mismatch_is_held(self) -> None:
              value = self.complete()
              value["continuityAttestation"]["campaignId"] = "OTHER-CAMPAIGN"
              self.refresh_top(value, "continuityAttestation", "continuityAttestationId", "axmheadcontinuityattestation2")
              self.assertIn("CAMPAIGN_IDENTITY_MISMATCH", self.evaluate(value)["join"]["reasonCodes"])
          '''
          new_campaign_test = '''    def test_campaign_identity_mismatch_is_held(self) -> None:
              value = self.complete()
              value["continuityAttestation"]["campaignId"] = "OTHER-CAMPAIGN"
              self.refresh_top(value, "continuityAttestation", "continuityAttestationId", "axmheadcontinuityattestation2")
              self.assertIn("CAMPAIGN_IDENTITY_MISMATCH", self.evaluate(value)["join"]["reasonCodes"])

              signed = self.complete()
              self.retier_private(signed, "private_local_attested")
              self.replace_authorization(signed, lambda auth: auth.update({"campaignId": "OTHER-CAMPAIGN"}))
              self.sign_private_with_test_root(signed)
              result = self.evaluate_with_test_trust_root(signed)
              self.assertEqual(result["join"]["terminal"], "HOLD")
              self.assertIn("CAMPAIGN_IDENTITY_MISMATCH", result["join"]["reasonCodes"])
          '''
          if test_original.count(old_campaign_test) != 1:
              raise SystemExit("campaign hostile-witness anchor differs")
          test_final = test_original.replace(old_campaign_test, new_campaign_test, 1)

          old_auth_test = '''    def test_stage_authorization_mismatch_is_held(self) -> None:
              value = self.complete()
              rows = value["privateFlightDispositionBinding"]["packet"]["stageReceipts"]
              rows[8]["authorizationReceiptId"] = "otherauthorization1_" + "a" * 64
              self.rechain_stage_receipts(value["privateFlightDispositionBinding"])
              self.refresh_top(value, "privateFlightDispositionBinding", "dispositionBindingId", "axmheadprivateflightdispositionbinding2")
              self.assertIn("STAGE_AUTHORIZATION_MISMATCH", self.evaluate(value)["join"]["reasonCodes"])
          '''
          new_auth_test = '''    def test_stage_authorization_mismatch_is_held(self) -> None:
              value = self.complete()
              rows = value["privateFlightDispositionBinding"]["packet"]["stageReceipts"]
              rows[8]["authorizationReceiptId"] = "otherauthorization1_" + "a" * 64
              self.rechain_stage_receipts(value["privateFlightDispositionBinding"])
              self.refresh_top(value, "privateFlightDispositionBinding", "dispositionBindingId", "axmheadprivateflightdispositionbinding2")
              self.assertIn("STAGE_AUTHORIZATION_MISMATCH", self.evaluate(value)["join"]["reasonCodes"])

              signed = self.complete()
              self.retier_private(signed, "private_local_attested")
              disposition = signed["privateFlightDispositionBinding"]
              disposition["authorizationReceiptId"] = "otherauthorization1_" + "b" * 64
              self.refresh_top(signed, "privateFlightDispositionBinding", "dispositionBindingId", "axmheadprivateflightdispositionbinding2")
              self.sign_private_with_test_root(signed)
              result = self.evaluate_with_test_trust_root(signed)
              self.assertEqual(result["join"]["terminal"], "HOLD")
              self.assertIn("AUTHORIZATION_REFERENCE_MISMATCH", result["join"]["reasonCodes"])
          '''
          if test_final.count(old_auth_test) != 1:
              raise SystemExit("authorization hostile-witness anchor differs")
          test_final = test_final.replace(old_auth_test, new_auth_test, 1)

          def sha256_text(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          digest_pattern = re.compile(r'STANDALONE_VERIFIER_SHA256 = "[0-9a-f]{64}"')

          def bind_bootstrap(text: str, verifier_text: str) -> str:
              replacement = f'STANDALONE_VERIFIER_SHA256 = "{sha256_text(verifier_text)}"'
              updated, count = digest_pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("bootstrap verifier-digest binding denominator differs")
              return updated

          bootstrap_intermediate = bind_bootstrap(bootstrap_original, verifier_intermediate)
          bootstrap_final = bind_bootstrap(bootstrap_original, verifier_final)

          verifier_path.write_text(verifier_intermediate, encoding="utf-8", newline="\n")
          bootstrap_path.write_text(bootstrap_intermediate, encoding="utf-8", newline="\n")
          test_path.write_text(test_final, encoding="utf-8", newline="\n")

          (staging / "final-verifier.py").write_text(verifier_final, encoding="utf-8", newline="\n")
          (staging / "final-bootstrap.py").write_text(bootstrap_final, encoding="utf-8", newline="\n")
          manifest = {
              "schema": "axm-head/join-v2-authorization-uniformity-repair-carrier@1",
              "parent": "03a0645dea3561ffba211a614e537d3fcce0f348",
              "intermediateVerifierSha256": sha256_text(verifier_intermediate),
              "finalVerifierSha256": sha256_text(verifier_final),
              "focusedMethodDenominator": 76,
              "physicalExecutionOccurred": False,
              "issue37Advanced": False,
              "workersLaunched": 0,
              "listenersCreated": 0,
              "authority": "none",
          }
          if manifest["intermediateVerifierSha256"] == manifest["finalVerifierSha256"]:
              raise SystemExit("intermediate and final verifier digests must differ")
          (staging / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY

      - name: Qualify intermediate carrier bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee /tmp/join-v2-authorization-uniformity-tests.txt
          grep -F "Ran 76 tests" /tmp/join-v2-authorization-uniformity-tests.txt
          grep -Fx "OK" /tmp/join-v2-authorization-uniformity-tests.txt

      - name: Commit and push repair carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            .join-v2-authorization-uniformity-repair
          git diff --cached --check
          git commit -m "Stage JOIN-v2 authorization uniformity repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
