name: AXM HEAD Distributed Inference Commodity 01

on:
  pull_request:
    paths:
      - ".github/workflows/axm-head-distributed-inference-commodity-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-DISTRIBUTED-INFERENCE-COMMODITY-01.md"
      - "mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json"
      - "mating_surface/anchor_node/axm_head_distributed_inference_commodity.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py"
      - "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json"
      - "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/axm-head-distributed-inference-commodity-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-DISTRIBUTED-INFERENCE-COMMODITY-01.md"
      - "mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json"
      - "mating_surface/anchor_node/axm_head_distributed_inference_commodity.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py"
      - "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json"
      - "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-head-distributed-inference-commodity-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        coordinate: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["source"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Resolve exact Git coordinate
        id: coordinate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.coordinate }}" == "head" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact coordinate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coordinate.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize all authoritative product members from exact Git blobs
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          source_ref = os.environ["SOURCE_REF"]
          product_paths = (
              ".github/workflows/axm-head-distributed-inference-commodity-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-DISTRIBUTED-INFERENCE-COMMODITY-01.md",
              "mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json",
              "mating_surface/anchor_node/axm_head_distributed_inference_commodity.py",
              "mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py",
              "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json",
              "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json",
          )
          for relative in product_paths:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{source_ref}:{relative}"])
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              if path.read_bytes() != data:
                  raise SystemExit(f"exact Git blob materialization failed: {relative}")
          print(f"materialized {len(product_paths)} exact product members")
          PY

      - name: Record source identity and exact product bytes
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
          COORDINATE: ${{ matrix.coordinate }}
          PLATFORM: ${{ matrix.os }}
          DEST: ${{ runner.temp }}/axm-head-distributed-inference/${{ matrix.coordinate }}/${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          source_ref = os.environ["SOURCE_REF"]
          coordinate = os.environ["COORDINATE"]
          platform = os.environ["PLATFORM"]
          dest = Path(os.environ["DEST"])
          observed = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if observed != source_ref:
              raise SystemExit(f"checkout identity differs: expected={source_ref} observed={observed}")

          product_paths = (
              ".github/workflows/axm-head-distributed-inference-commodity-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-DISTRIBUTED-INFERENCE-COMMODITY-01.md",
              "mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json",
              "mating_surface/anchor_node/axm_head_distributed_inference_commodity.py",
              "mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py",
              "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json",
              "mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json",
          )
          products = {}
          for relative in product_paths:
              data = Path(relative).read_bytes()
              expected = subprocess.check_output(["git", "cat-file", "blob", f"{source_ref}:{relative}"])
              if data != expected:
                  raise SystemExit(f"working bytes differ from exact Git blob: {relative}")
              products[relative] = {
                  "bytes": len(data),
                  "gitBlob": subprocess.check_output(["git", "hash-object", relative], text=True).strip(),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          source = {
              "schema": "axm-head/source-coordinate-verdict@1",
              "status": "PASS",
              "coordinate": coordinate,
              "platform": platform,
              "expectedSha": source_ref,
              "observedSha": observed,
              "tree": tree,
              "productMemberCount": len(products),
              "qualificationExecuted": False,
          }
          (dest / "source-identity.json").write_bytes(
              (json.dumps(source, sort_keys=True, indent=2) + "\n").encode("utf-8")
          )
          (dest / "product-hashes.json").write_bytes(
              (json.dumps({"schema": "axm-head/product-byte-set@1", "products": products}, sort_keys=True, indent=2) + "\n").encode("utf-8")
          )
          PY

      - name: Enforce public source hygiene without self-matching detectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          product_paths = (
              Path(".github/workflows/axm-head-distributed-inference-commodity-01.yml"),
              Path("mating_surface/anchor_node/AXM-HEAD-DISTRIBUTED-INFERENCE-COMMODITY-01.md"),
              Path("mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json"),
              Path("mating_surface/anchor_node/axm_head_distributed_inference_commodity.py"),
              Path("mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py"),
              Path("mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json"),
              Path("mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json"),
          )
          joined = "\n".join(path.read_text(encoding="utf-8") for path in product_paths)
          network_modules = ("requ" + "ests", "urllib" + "3", "aio" + "http", "http" + "x")
          import_pattern = re.compile(
              r"(?m)^\s*(?:from|import)\s+(?:" + "|".join(map(re.escape, network_modules)) + r")\b"
          )
          network_calls = (
              "socket" + ".connect",
              "socket" + ".create_connection",
              "urllib" + ".request.urlopen",
          )
          secret_patterns = (
              re.compile("AK" + "IA" + r"[0-9A-Z]{16}"),
              re.compile("BEGIN " + r"(?:RSA |EC |OPENSSH )?" + "PRIVATE " + "KEY"),
              re.compile("Authorization" + r":\s*" + "Bearer", re.I),
              re.compile(r"\b" + "OCTO" + r"-(?:W|L|N)[0-9]+\b", re.I),
          )
          if import_pattern.search(joined) or any(fragment in joined for fragment in network_calls):
              raise SystemExit("network runtime detected in permanent commodity product")
          for pattern in secret_patterns:
              if pattern.search(joined):
                  raise SystemExit("credential or private-host material detected in permanent commodity product")

          workflow = product_paths[0].read_text(encoding="utf-8")
          if "permissions:\n  contents: read\n" not in workflow:
              raise SystemExit("workflow does not retain read-only contents permission")
          write_fragments = (
              "contents" + ": write",
              "git " + "push origin",
              "pull_request" + "_target",
          )
          if any(fragment in workflow for fragment in write_fragments):
              raise SystemExit("write-capable carrier fragment detected")
          print("public source hygiene PASS")
          PY

      - name: Compile and run the closed witness denominator
        shell: bash
        env:
          DEST: ${{ runner.temp }}/axm-head-distributed-inference/${{ matrix.coordinate }}/${{ matrix.os }}
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_distributed_inference_commodity.py \
            mating_surface/anchor_node/conformance/test_axm_head_distributed_inference_commodity.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_distributed_inference_commodity.py' \
            -v 2>&1 | tee "$DEST/test-output.txt"
          grep -F "Ran 15 tests" "$DEST/test-output.txt"
          grep -Fx "OK" "$DEST/test-output.txt"

      - name: Reconstruct profile, supplier, fixture, campaign, and floor semantics
        shell: bash
        env:
          DEST: ${{ runner.temp }}/axm-head-distributed-inference/${{ matrix.coordinate }}/${{ matrix.os }}
        run: |
          set -euo pipefail
          PROFILE="mating_surface/anchor_node/axm-head-distributed-inference-commodity-profile-01.json"
          SUPPLIERS="mating_surface/anchor_node/fixtures/axm-head-distributed-inference-suppliers-01.json"
          FIXTURES="mating_surface/anchor_node/fixtures/axm-head-distributed-inference-commodity-cases-01.json"
          TOOL="mating_surface/anchor_node/axm_head_distributed_inference_commodity.py"

          python "$TOOL" validate-profile "$PROFILE" > "$DEST/profile-verdict.json"
          python "$TOOL" validate-suppliers "$PROFILE" "$SUPPLIERS" > "$DEST/supplier-verdict.json"
          python "$TOOL" validate-fixtures "$PROFILE" "$SUPPLIERS" "$FIXTURES" > "$DEST/fixture-verdict.json"
          python "$TOOL" campaign "$PROFILE" "$SUPPLIERS" "$FIXTURES" > "$DEST/campaign.json"
          python "$TOOL" floor "$PROFILE" "$SUPPLIERS" "$FIXTURES" > "$DEST/floor.json"

      - name: Close the coordinate verdict
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
          COORDINATE: ${{ matrix.coordinate }}
          PLATFORM: ${{ matrix.os }}
          DEST: ${{ runner.temp }}/axm-head-distributed-inference/${{ matrix.coordinate }}/${{ matrix.os }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          dest = Path(os.environ["DEST"])
          source = json.loads((dest / "source-identity.json").read_text(encoding="utf-8"))
          products = json.loads((dest / "product-hashes.json").read_text(encoding="utf-8"))["products"]
          profile = json.loads((dest / "profile-verdict.json").read_text(encoding="utf-8"))
          suppliers = json.loads((dest / "supplier-verdict.json").read_text(encoding="utf-8"))
          fixtures = json.loads((dest / "fixture-verdict.json").read_text(encoding="utf-8"))
          campaign = json.loads((dest / "campaign.json").read_text(encoding="utf-8"))
          floor = json.loads((dest / "floor.json").read_text(encoding="utf-8"))
          tests = (dest / "test-output.txt").read_text(encoding="utf-8")
          match = re.search(r"Ran (\d+) tests?", tests)
          if match is None or int(match.group(1)) != 15:
              raise SystemExit("closed unit witness denominator did not execute")
          if profile.get("status") != "PASS" or suppliers != {"status": "PASS", "supplierCount": 1}:
              raise SystemExit("profile or supplier reconstruction failed")
          if fixtures != {"status": "PASS", "caseCount": 12}:
              raise SystemExit("fixture reconstruction failed")
          if campaign.get("status") != "PASS" or campaign.get("caseCount") != 12:
              raise SystemExit("campaign did not execute the exact twelve-case denominator")
          if campaign.get("terminalCounts") != {
              "HOLD": 4,
              "QUALIFICATION_PLAN": 3,
              "QUALIFIED_ASSEMBLY": 5,
          }:
              raise SystemExit("campaign terminal counts drifted")
          if campaign.get("publicSwarmLLMQualified") or campaign.get("executionOccurred"):
              raise SystemExit("campaign promoted public SwarmLLM or claimed execution")
          if floor.get("supplierCount") != 1:
              raise SystemExit("floor supplier denominator drifted")
          row = floor["suppliers"][0]
          if (row.get("actor"), row.get("product"), row.get("status")) != (
              "Nehanth Narendrula",
              "SwarmLLM",
              "QUALIFICATION_PLAN",
          ):
              raise SystemExit("public supplier floor row drifted")
          if row.get("actualSupplierQualified") or row.get("executionOccurred"):
              raise SystemExit("public supplier row promoted a non-receipt")

          verdict = {
              "schema": "axm-head/distributed-inference-coordinate-qualification@1",
              "status": "PASS",
              "coordinate": os.environ["COORDINATE"],
              "platform": os.environ["PLATFORM"],
              "sourceRef": os.environ["SOURCE_REF"],
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "qualificationExecuted": True,
              "productMemberCount": len(products),
              "productSha256": {path: row["sha256"] for path, row in sorted(products.items())},
              "unitWitnesses": 15,
              "campaignCases": 12,
              "terminalCounts": campaign["terminalCounts"],
              "supplierCount": floor["supplierCount"],
              "publicSwarmLLMQualified": False,
              "actualSupplierQualified": False,
              "executionOccurred": False,
              "missionAuthority": "none",
          }
          (dest / "coordinate-verdict.json").write_bytes(
              (json.dumps(verdict, sort_keys=True, indent=2) + "\n").encode("utf-8")
          )
          source["qualificationExecuted"] = True
          (dest / "source-identity.json").write_bytes(
              (json.dumps(source, sort_keys=True, indent=2) + "\n").encode("utf-8")
          )
          PY

      - name: Preserve exact-coordinate qualification receipts
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-distributed-inference-commodity-01-${{ matrix.os }}-${{ matrix.coordinate }}-${{ github.sha }}
          path: ${{ runner.temp }}/axm-head-distributed-inference/${{ matrix.coordinate }}/${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download every platform and coordinate receipt set
        uses: actions/download-artifact@v4
        with:
          pattern: axm-head-distributed-inference-commodity-01-*-${{ github.sha }}
          path: qualification-download

      - name: Require execution and byte identity across all instantiated jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("qualification-download")
          verdict_paths = sorted(root.glob("**/coordinate-verdict.json"))
          expected_coordinates = ("head", "merge") if os.environ["EVENT_NAME"] == "pull_request" else ("source",)
          expected_jobs = 2 * len(expected_coordinates)
          if len(verdict_paths) != expected_jobs:
              raise SystemExit(f"expected {expected_jobs} coordinate verdicts, found {len(verdict_paths)}")

          receipts = [json.loads(path.read_text(encoding="utf-8")) for path in verdict_paths]
          observed = {(row["platform"], row["coordinate"]) for row in receipts}
          expected = {
              (platform, coordinate)
              for platform in ("ubuntu-latest", "windows-latest")
              for coordinate in expected_coordinates
          }
          if observed != expected:
              raise SystemExit(f"job denominator drifted: expected={sorted(expected)} observed={sorted(observed)}")
          for row in receipts:
              if row.get("status") != "PASS" or row.get("qualificationExecuted") is not True:
                  raise SystemExit("a coordinate reported PASS without executed qualification")
              if (row.get("unitWitnesses"), row.get("campaignCases"), row.get("supplierCount")) != (15, 12, 1):
                  raise SystemExit("a coordinate denominator drifted")
              if row.get("publicSwarmLLMQualified") or row.get("actualSupplierQualified") or row.get("executionOccurred"):
                  raise SystemExit("a coordinate promoted a held claim")

          canonical_products = receipts[0]["productSha256"]
          if any(row["productSha256"] != canonical_products for row in receipts[1:]):
              raise SystemExit("product bytes differ across platform or coordinate")

          semantic_names = (
              "profile-verdict.json",
              "supplier-verdict.json",
              "fixture-verdict.json",
              "campaign.json",
              "floor.json",
          )
          semantic_sha256 = {}
          import hashlib
          for name in semantic_names:
              candidates = sorted(root.glob(f"**/{name}"))
              if len(candidates) != expected_jobs:
                  raise SystemExit(f"{name}: expected {expected_jobs} files, found {len(candidates)}")
              digests = [hashlib.sha256(path.read_bytes()).hexdigest() for path in candidates]
              if len(set(digests)) != 1:
                  raise SystemExit(f"{name}: semantic bytes differ across platform or coordinate")
              semantic_sha256[name] = digests[0]

          receipt = {
              "schema": "axm-head/distributed-inference-cross-coordinate-qualification@1",
              "status": "PASS",
              "eventName": os.environ["EVENT_NAME"],
              "coordinates": list(expected_coordinates),
              "platforms": ["ubuntu-latest", "windows-latest"],
              "jobCount": expected_jobs,
              "qualificationExecutedEverywhere": True,
              "productMemberCount": len(canonical_products),
              "platformByteIdentity": True,
              "headMergeByteIdentity": len(expected_coordinates) == 2,
              "semanticByteIdentity": True,
              "semanticSha256": semantic_sha256,
              "unitWitnessesPerJob": 15,
              "campaignCasesPerJob": 12,
              "publicSwarmLLMQualified": False,
              "actualSupplierQualified": False,
              "executionOccurred": False,
              "missionAuthority": "none",
          }
          Path("cross-coordinate-verdict.json").write_bytes(
              (json.dumps(receipt, sort_keys=True, indent=2) + "\n").encode("utf-8")
          )
          PY

      - name: Preserve the cross-coordinate verdict
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-distributed-inference-commodity-01-cross-coordinate-${{ github.sha }}
          path: cross-coordinate-verdict.json
          if-no-files-found: error
          retention-days: 14
