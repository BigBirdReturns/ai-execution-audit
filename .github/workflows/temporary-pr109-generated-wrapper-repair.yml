name: TEMP PR109 generated-wrapper repair

on:
  push:
    branches:
      - work/axm-head-browser-physical-audition-kit-layout-01
    paths:
      - .github/workflows/temporary-pr109-generated-wrapper-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/axm-head-browser-physical-audition-kit-layout-01
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair the dual repository and generated-kit wrapper coordinate
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import subprocess
          from pathlib import Path, PurePosixPath

          anchor = Path("mating_surface/anchor_node")
          wrapper_path = anchor / "axm-head-browser-physical-audition-packet-01.ps1"
          profile_path = anchor / "axm-head-browser-physical-audition-packet-profile-01.json"

          wrapper = r'''[CmdletBinding()]
          param(
              [Parameter(Mandatory = $true, Position = 0)]
              [ValidateSet('validate-profile', 'validate-fixtures', 'campaign', 'build-kit', 'assemble', 'verify', 'public-projection', 'source-set')]
              [string]$Command,

              [Parameter(ValueFromRemainingArguments = $true)]
              [string[]]$RemainingArguments
          )

          $ErrorActionPreference = 'Stop'
          $ScriptRoot = Split-Path -Parent $MyInvocation.MyCommand.Path
          $ToolCandidates = @(
              (Join-Path $ScriptRoot 'axm_head_browser_physical_audition_packet_01.py'),
              (Join-Path (Join-Path $ScriptRoot 'source') 'axm_head_browser_physical_audition_packet_01.py')
          )
          $Tool = $null
          foreach ($CandidateTool in $ToolCandidates) {
              if (Test-Path -LiteralPath $CandidateTool -PathType Leaf) {
                  $Tool = $CandidateTool
                  break
              }
          }
          if ($null -eq $Tool) {
              Write-Error "Packet compiler unavailable at repository or generated-kit coordinate: $($ToolCandidates -join ', ')"
              exit 2
          }

          $Candidates = @(
              @{ File = 'python'; Prefix = @() },
              @{ File = 'python3'; Prefix = @() },
              @{ File = 'py'; Prefix = @('-3') }
          )

          foreach ($Candidate in $Candidates) {
              $CommandInfo = Get-Command $Candidate.File -ErrorAction SilentlyContinue
              if ($null -eq $CommandInfo) { continue }
              & $Candidate.File @($Candidate.Prefix) -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 2)" 2>$null
              if ($LASTEXITCODE -ne 0) { continue }
              & $Candidate.File @($Candidate.Prefix) $Tool $Command @RemainingArguments
              exit $LASTEXITCODE
          }

          Write-Error 'Python 3.11 or later is required.'
          exit 2
          '''
          wrapper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in wrapper.splitlines()
          ) + "\n"
          wrapper_bytes = wrapper.encode("utf-8")
          wrapper_path.write_bytes(wrapper_bytes)

          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          rows = [
              row for row in profile["packetSourceBindings"]
              if row["path"] == wrapper_path.name
          ]
          if len(rows) != 1:
              raise SystemExit(f"wrapper binding denominator invalid: {len(rows)}")
          rows[0]["bytes"] = len(wrapper_bytes)
          rows[0]["sha256"] = "sha256:" + hashlib.sha256(wrapper_bytes).hexdigest()
          profile_path.write_bytes(
              (json.dumps(profile, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          )

          admitted_ref = profile["admittedAudition"]["admissionCommit"]
          for row in profile["kitSourceBindings"]:
              relative = PurePosixPath("mating_surface/anchor_node") / row["path"]
              data = subprocess.check_output(
                  ["git", "cat-file", "blob", f"{admitted_ref}:{relative.as_posix()}"]
              )
              if len(data) != row["bytes"]:
                  raise SystemExit(f"admitted dependency length differs: {relative}")
              observed = "sha256:" + hashlib.sha256(data).hexdigest()
              if observed != row["sha256"]:
                  raise SystemExit(f"admitted dependency digest differs: {relative}")
              target = Path(relative.as_posix())
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          print(json.dumps(rows[0], sort_keys=True))
          '@ | python -

          git diff --check
          python -m compileall -q mating_surface/anchor_node

      - name: Run focused source and generated-kit qualification
        shell: pwsh
        run: |
          $Root = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node'
          $Wrapper = Join-Path $Root 'axm-head-browser-physical-audition-packet-01.ps1'
          $Profile = Join-Path $Root 'axm-head-browser-physical-audition-packet-profile-01.json'
          $Fixtures = Join-Path $Root 'fixtures\axm-head-browser-physical-audition-packet-cases-01.json'
          $Kit = Join-Path $env:RUNNER_TEMP 'pr109-wrapper-repair-kit'
          $KitPacket = Join-Path $env:RUNNER_TEMP 'pr109-wrapper-repair-packet'
          Remove-Item -LiteralPath $Kit -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $KitPacket -Recurse -Force -ErrorAction SilentlyContinue

          & $Wrapper 'validate-profile' $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Wrapper 'validate-fixtures' $Profile $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Wrapper 'campaign' $Profile $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m unittest discover `
            -s mating_surface/anchor_node/conformance `
            -p 'test_axm_head_browser_physical_audition_packet_01.py' `
            -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $Wrapper 'build-kit' $Profile $env:GITHUB_WORKSPACE $Kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $KitWrapper = Join-Path $Kit 'Invoke-AXMBrowserPhysicalAudition.ps1'
          $KitProfile = Join-Path $Kit 'source\axm-head-browser-physical-audition-packet-profile-01.json'
          & $KitWrapper 'assemble' $KitProfile $KitPacket '--now-ms' '2000000000000'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PrivateDecision = Join-Path $KitPacket 'private\packet-decision.json'
          $PublicStatus = Join-Path $KitPacket 'public\status.json'
          if (-not (Test-Path -LiteralPath $PrivateDecision -PathType Leaf)) {
              throw 'generated-kit wrapper did not create the private packet decision'
          }
          if (-not (Test-Path -LiteralPath $PublicStatus -PathType Leaf)) {
              throw 'generated-kit wrapper did not create the public packet status'
          }
          $Decision = Get-Content -LiteralPath $PrivateDecision -Raw | ConvertFrom-Json
          if ($Decision.terminal -ne 'PREPARED_NOT_EXECUTED') {
              throw "unexpected generated-kit terminal: $($Decision.terminal)"
          }
          if ($Decision.physicalExecutionObserved -ne $false -or $Decision.actualSupplierQualified -ne $false) {
              throw 'generated-kit wrapper promoted a physical or supplier claim'
          }

      - name: Publish the qualified repair and remove temporary controllers
        shell: pwsh
        run: |
          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git rm `
            '.github/workflows/temporary-pr109-generated-wrapper-repair.yml' `
            '.github/workflows/temporary-pr109-fixture-diagnostic.yml'
          git add `
            'mating_surface/anchor_node/axm-head-browser-physical-audition-packet-01.ps1' `
            'mating_surface/anchor_node/axm-head-browser-physical-audition-packet-profile-01.json'
          git diff --cached --check
          git commit -m 'fix: resolve the generated packet compiler from its source tree'
          git push origin 'HEAD:work/axm-head-browser-physical-audition-kit-layout-01'
