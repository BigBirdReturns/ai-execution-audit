name: AXM HEAD Physical Long-Haul Source Census

on:
  push:
    branches:
      - work/axm-head-physical-long-haul-join-01
    paths:
      - ".github/workflows/axm-head-physical-long-haul-source-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Emit exact source identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          ROOT = Path('mating_surface/anchor_node')

          def canonical_json_bytes(value):
              return (json.dumps(
                  value,
                  sort_keys=True,
                  separators=(',', ':'),
                  ensure_ascii=False,
                  allow_nan=False,
              ) + '\n').encode('utf-8')

          def canonical_json_sha(path):
              value = json.loads(path.read_text(encoding='utf-8'))
              return hashlib.sha256(canonical_json_bytes(value)).hexdigest()

          def file_sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          result = {
              'schema': 'axm-head-physical-long-haul-source-census/1',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'axmProfileCanonicalSha256': canonical_json_sha(ROOT / 'axm-head-edge-demo-profile-01.json'),
              'axmFixtureCatalogCanonicalSha256': canonical_json_sha(ROOT / 'fixtures' / 'axm-head-edge-demo-cases-01.json'),
              'axmStandaloneVerifierSha256': file_sha(ROOT / 'verify_axm_head_volume.py'),
              'axmExternalBootstrapSha256': file_sha(ROOT / 'verify_axm_head_bootstrap.py'),
              'physicalFlightProfileCanonicalSha256': canonical_json_sha(ROOT / 'stc-mary-physical-flight-profile-01.json'),
              'privatePacketProfileCanonicalSha256': canonical_json_sha(ROOT / 'stc-mary-private-flight-packet-profile-01.json'),
          }
          print(json.dumps(result, sort_keys=True, indent=2))
          PY
