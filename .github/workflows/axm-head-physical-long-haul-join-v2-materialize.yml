name: AXM HEAD Postflight JOIN-v2 Workflow Finalizer

on:
  push:
    branches:
      - work/axm-head-physical-long-haul-join-v2-postflight
    paths:
      - ".joinv2-workflow/**"
      - ".github/workflows/axm-head-physical-long-haul-join-v2-materialize.yml"

permissions:
  contents: write

concurrency:
  group: axm-head-postflight-join-v2-workflow-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize the permanent read-only workflow and remove transport
        shell: bash
        env:
          EXPECTED_BASE: ec61bc3488cb5ae06ed9db2862a9f6910d310a79
          EXPECTED_BRANCH: work/axm-head-physical-long-haul-join-v2-postflight
          EXPECTED_WORKFLOW_SHA256: 8c4141b25d50765599a80cb61c31e51f8ae9597edc25d5521c5ddb1c5b0a7cc2
        run: |
          set -euo pipefail

          if [ ! -d .joinv2-workflow ]; then
            echo "Permanent JOIN-v2 workflow already finalized; no write required."
            exit 0
          fi

          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git merge-base --is-ancestor "${EXPECTED_BASE}" HEAD

          TARGET=.github/workflows/axm-head-physical-long-haul-join-01.yml
          TEMP=.github/workflows/axm-head-physical-long-haul-join-v2-materialize.yml
          cat .joinv2-workflow/plain-00.ymlpart \
              .joinv2-workflow/plain-01.ymlpart \
              .joinv2-workflow/plain-02.ymlpart \
              .joinv2-workflow/plain-03.ymlpart > "$TARGET"
          echo "${EXPECTED_WORKFLOW_SHA256}  $TARGET" | sha256sum --check

          python - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_bytes()
          if b"\r\n" in data:
              raise SystemExit("permanent workflow is not LF-only")
          text = data.decode("utf-8")
          if "permissions:\n  contents: read\n" not in text:
              raise SystemExit("permanent workflow is not read-only")
          for fragment in ("contents: write", "git push", "pull_request_target"):
              if fragment in text:
                  raise SystemExit(f"writable fragment remains: {fragment}")
          PY

          rm -rf .joinv2-workflow
          rm -f "$TEMP"
          git add --all -- .joinv2-workflow "$TEMP" "$TARGET"

          python - <<'PY'
          import subprocess

          observed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          allowed = {
              ".github/workflows/axm-head-physical-long-haul-join-01.yml",
              ".github/workflows/axm-head-physical-long-haul-join-v2-materialize.yml",
          }
          if not observed or any(path not in allowed and not path.startswith(".joinv2-workflow/") for path in observed):
              raise SystemExit(f"workflow-finalization denominator differs: {observed!r}")
          PY

          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git commit -m "Finalize read-only AXM HEAD postflight JOIN-v2 workflow"
          git push origin "HEAD:${EXPECTED_BRANCH}"

      - name: Preserve the non-execution boundary
        shell: bash
        run: |
          echo "physicalExecutionStarted=false"
          echo "missionVolumeMaterialized=false"
          echo "workersLaunched=0"
          echo "listenersCreated=0"
          echo "authority=none"
