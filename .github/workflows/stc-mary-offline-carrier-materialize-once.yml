name: One-use STC MARY offline carrier materialization

on:
  push:
    branches:
      - feature/stc-mary-offline-carrier-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stc-mary-offline-carrier-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: feature/stc-mary-offline-carrier-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reconstruct and verify the exact product archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil
          import stat
          import zipfile

          payload_root = Path('.offline-carrier-payload')
          parts = sorted(payload_root.glob('part*.b64'))
          expected_parts = [payload_root / f'part{index:02d}.b64' for index in range(1, 8)]
          if parts != expected_parts:
              raise SystemExit(f'payload denominator differs: {[str(path) for path in parts]}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          expected_sha256 = '1daf6f01576034ecdd3a57c50c58998dcf3f45cb49eed8dd56c494a220541489'
          actual_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'archive sha256 differs: {actual_sha256}')
          if len(archive_bytes) != 29829:
              raise SystemExit(f'archive byte count differs: {len(archive_bytes)}')

          archive = Path('/tmp/stc-mary-offline-carrier-product.zip')
          archive.write_bytes(archive_bytes)
          expected = {
              '.github/workflows/stc-mary-offline-carrier-01.yml',
              'mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py',
              'mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json',
              'mating_surface/anchor_node/stc-mary-offline-carrier.ps1',
              'mating_surface/anchor_node/stc_mary_local/cli.py',
              'mating_surface/anchor_node/stc_mary_local/plan.py',
              'mating_surface/anchor_node/stc_mary_offline_carrier.py',
          }
          extract_root = Path('/tmp/stc-mary-offline-carrier-extract')
          if extract_root.exists():
              shutil.rmtree(extract_root)
          extract_root.mkdir()

          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f'archive member denominator differs: {names}')
              for info in bundle.infolist():
                  path = Path(info.filename)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename:
                      raise SystemExit(f'unsafe archive member: {info.filename}')
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink archive member refused: {info.filename}')
                  target = (extract_root / path).resolve()
                  if extract_root.resolve() not in target.parents:
                      raise SystemExit(f'archive member escapes root: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(info))

          for relative in sorted(expected):
              source = extract_root / relative
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source.read_bytes())
          PY

      - name: Run the closed carrier and inherited local-toolchain suites
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py
          python mating_surface/anchor_node/stc_mary_offline_carrier.py validate-profile \
            mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_offline_carrier.py' \
            -v
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_local_toolchain.py' \
            -v

      - name: Remove the transport and publish only the qualified product
        run: |
          rm -rf .offline-carrier-payload
          rm .github/workflows/stc-mary-offline-carrier-materialize-once.yml
          git diff --check
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add -A \
            .offline-carrier-payload \
            .github/workflows/stc-mary-offline-carrier-materialize-once.yml \
            .github/workflows/stc-mary-offline-carrier-01.yml \
            mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json \
            mating_surface/anchor_node/stc-mary-offline-carrier.ps1 \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_offline_carrier.py
          git commit -m "Build the STC MARY offline cell and successor carrier"
          git push origin HEAD:feature/stc-mary-offline-carrier-01
