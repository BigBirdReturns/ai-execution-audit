name: One-use STC MARY offline carrier forensic pass

on:
  push:
    branches:
      - feature/stc-mary-offline-carrier-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-mary-offline-carrier-forensic-once
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: feature/stc-mary-offline-carrier-01
          fetch-depth: 0

      - name: Inspect the damaged source-pinned archive transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import difflib
          import hashlib
          import struct
          import zipfile

          root = Path('.offline-carrier-payload')
          paths = [root / f'part{index:02d}.b64' for index in range(1, 8)]
          texts = [path.read_text(encoding='utf-8').strip() for path in paths]
          bodies = [base64.b64decode(text, validate=True) for text in texts]
          data = base64.b64decode(''.join(texts), validate=True)

          print('BASE64_LENGTHS', [len(text) for text in texts])
          print('DECODED_LENGTHS', [len(body) for body in bodies])
          print('TOTAL_BYTES', len(data))
          print('TOTAL_SHA256', hashlib.sha256(data).hexdigest())
          print('TEXT_ENDINGS', [repr(text[-24:]) for text in texts])
          print('TEXT_BEGinnings', [repr(text[:24]) for text in texts])

          boundaries = []
          total = 0
          for body in bodies:
              total += len(body)
              boundaries.append(total)
          print('DECODED_BOUNDARIES', boundaries)

          def all_positions(payload, signature):
              out = []
              start = 0
              while True:
                  at = payload.find(signature, start)
                  if at < 0:
                      return out
                  out.append(at)
                  start = at + 1

          local_positions = all_positions(data, b'PK\x03\x04')
          central_positions = all_positions(data, b'PK\x01\x02')
          eocd_positions = all_positions(data, b'PK\x05\x06')
          print('LOCAL_SIGNATURES', local_positions)
          print('CENTRAL_SIGNATURES', central_positions)
          print('EOCD_SIGNATURES', eocd_positions)

          for at in local_positions:
              try:
                  values = struct.unpack_from('<IHHHHHIIIHH', data, at)
                  _, needed, flags, method, mtime, mdate, crc, csize, usize, nlen, xlen = values
                  name = data[at + 30:at + 30 + nlen].decode('utf-8', 'replace')
                  print('LOCAL', at, name, 'flags', flags, 'method', method, 'crc', hex(crc), 'csize', csize, 'usize', usize, 'xlen', xlen)
              except Exception as error:
                  print('LOCAL_PARSE_ERROR', at, repr(error))

          for at in central_positions:
              try:
                  values = struct.unpack_from('<IHHHHHHIIIHHHHHII', data, at)
                  (_, made, needed, flags, method, mtime, mdate, crc, csize, usize,
                   nlen, xlen, clen, disk, internal, external, offset) = values
                  name = data[at + 46:at + 46 + nlen].decode('utf-8', 'replace')
                  print('CENTRAL', at, name, 'offset', offset, 'flags', flags, 'method', method, 'crc', hex(crc), 'csize', csize, 'usize', usize)
              except Exception as error:
                  print('CENTRAL_PARSE_ERROR', at, repr(error))

          try:
              archive = Path('/tmp/current.zip')
              archive.write_bytes(data)
              with zipfile.ZipFile(archive) as bundle:
                  for info in bundle.infolist():
                      print('ZIPINFO', info.filename, 'header_offset', info.header_offset, 'csize', info.compress_size, 'usize', info.file_size, 'crc', hex(info.CRC))
          except Exception as error:
              print('ZIPINFO_ERROR', repr(error))

          part6 = bodies[5]
          other = b''.join(bodies[:5] + bodies[6:])
          match = difflib.SequenceMatcher(None, part6, other, autojunk=False).find_longest_match(0, len(part6), 0, len(other))
          print('PART6_LONGEST_MATCH_OTHER', match.a, match.b, match.size, hashlib.sha256(part6[match.a:match.a + match.size]).hexdigest())

          left = part6[:4563]
          right = part6[4500:]
          self_match = difflib.SequenceMatcher(None, left, right, autojunk=False).find_longest_match(0, len(left), 0, len(right))
          print('PART6_OVERLAP_MATCH', self_match.a, self_match.b, self_match.size, hashlib.sha256(left[self_match.a:self_match.a + self_match.size]).hexdigest())

          for index, body in enumerate(bodies, start=1):
              prefix = body[:32]
              suffix = body[-32:]
              print('PART6_FIND_PART', index, 'prefix', part6.find(prefix), 'suffix', part6.find(suffix))

          raise SystemExit('FORENSIC_PASS_COMPLETE')
          PY
