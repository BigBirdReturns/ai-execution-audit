name: One-use STC MARY offline carrier source recovery

on:
  push:
    branches:
      - feature/stc-mary-offline-carrier-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-mary-offline-carrier-source-recovery-once
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: feature/stc-mary-offline-carrier-01
          fetch-depth: 0

      - name: Recover inserted source and the valid deflate prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import struct
          import zlib

          root = Path('.offline-carrier-payload')
          texts = [(root / f'part{index:02d}.b64').read_text(encoding='utf-8').strip() for index in range(1, 8)]
          bodies = [base64.b64decode(text, validate=True) for text in texts]
          inserted = bodies[5][:4563]
          print('INSERTED_SHA256', hashlib.sha256(inserted).hexdigest())
          print('INSERTED_LENGTH', len(inserted))
          print('INSERTED_SOURCE_BEGIN')
          print(inserted.decode('utf-8', 'replace'))
          print('INSERTED_SOURCE_END')

          data = b''.join(bodies[:5]) + bodies[5][4563:] + bodies[6]
          print('AFTER_INSERT_REMOVAL_LENGTH', len(data))
          print('AFTER_INSERT_REMOVAL_SHA256', hashlib.sha256(data).hexdigest())
          local = 5112
          _, needed, flags, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<IHHHHHIIIHH', data, local)
          name = data[local + 30:local + 30 + nlen].decode('utf-8')
          compressed_start = local + 30 + nlen + xlen
          next_header = data.find(b'PK\x03\x04', compressed_start)
          compressed_prefix = data[compressed_start:8997]
          compressed_suffix = data[8997:next_header]
          print('TARGET_NAME', name)
          print('TARGET_CRC', hex(crc))
          print('TARGET_COMPRESSED_SIZE', csize)
          print('TARGET_UNCOMPRESSED_SIZE', usize)
          print('COMPRESSED_START', compressed_start)
          print('NEXT_HEADER', next_header)
          print('PREFIX_LENGTH', len(compressed_prefix))
          print('SUFFIX_LENGTH', len(compressed_suffix))
          print('PREFIX_SHA256', hashlib.sha256(compressed_prefix).hexdigest())
          print('SUFFIX_SHA256', hashlib.sha256(compressed_suffix).hexdigest())

          decoder = zlib.decompressobj(-15)
          out = decoder.decompress(compressed_prefix)
          print('PREFIX_OUTPUT_LENGTH', len(out))
          print('PREFIX_OUTPUT_CRC', hex(zlib.crc32(out) & 0xffffffff))
          print('PREFIX_OUTPUT_TAIL_BEGIN')
          print(out[-5000:].decode('utf-8', 'replace'))
          print('PREFIX_OUTPUT_TAIL_END')
          print('DECODER_EOF', decoder.eof)
          print('DECODER_UNUSED', len(decoder.unused_data))
          print('DECODER_UNCONSUMED', len(decoder.unconsumed_tail))

          for candidate in (b'\x00\x00\x00', b'\xff\xff\xff', b'\x00\xff\x00'):
              probe = decoder.copy()
              try:
                  tail = probe.decompress(candidate + compressed_suffix) + probe.flush()
                  print('PROBE', candidate.hex(), 'OK', len(tail), probe.eof, hex(zlib.crc32(tail, zlib.crc32(out)) & 0xffffffff))
              except Exception as error:
                  print('PROBE', candidate.hex(), 'ERROR', repr(error))

          raise SystemExit('SOURCE_RECOVERY_PASS_COMPLETE')
          PY
