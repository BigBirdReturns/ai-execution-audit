name: One-use STC MARY offline carrier intact-source recovery

on:
  push:
    branches:
      - feature/stc-mary-offline-carrier-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stc-mary-offline-carrier-intact-source-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: feature/stc-mary-offline-carrier-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recover the six independently intact product members
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import hashlib
          import json
          import struct
          import zlib

          payload_root = Path('.offline-carrier-payload')
          part_paths = [payload_root / f'part{index:02d}.b64' for index in range(1, 8)]
          if not all(path.is_file() for path in part_paths):
              raise SystemExit('payload denominator differs')
          bodies = [base64.b64decode(path.read_text(encoding='utf-8').strip(), validate=True) for path in part_paths]
          data = b''.join(bodies[:5]) + bodies[6]

          expected_names = [
              '.github/workflows/stc-mary-offline-carrier-01.yml',
              'mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py',
              'mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json',
              'mating_surface/anchor_node/stc-mary-offline-carrier.ps1',
              'mating_surface/anchor_node/stc_mary_local/cli.py',
              'mating_surface/anchor_node/stc_mary_local/plan.py',
              'mating_surface/anchor_node/stc_mary_offline_carrier.py',
          ]
          local_positions = []
          start = 0
          while True:
              at = data.find(b'PK\x03\x04', start)
              if at < 0:
                  break
              local_positions.append(at)
              start = at + 4
          if local_positions != [0, 2446, 5112, 9310, 10006, 10990, 12258, 16594]:
              raise SystemExit(f'local record coordinates differ: {local_positions}')

          damaged_indexes = {2, 7}
          recovered = {}
          for index, (at, expected_name) in enumerate(zip(local_positions, expected_names)):
              values = struct.unpack_from('<IHHHHHIIIHH', data, at)
              (_, needed, flags, method, mtime, mdate, crc, compressed_size,
               uncompressed_size, name_length, extra_length) = values
              name_start = at + 30
              name = data[name_start:name_start + name_length].decode('utf-8')
              if name != expected_name or flags != 0 or method != 8 or extra_length != 0:
                  raise SystemExit(f'local record contract differs at {index}: {name}')
              if index in damaged_indexes:
                  continue
              payload_start = name_start + name_length
              compressed = data[payload_start:payload_start + compressed_size]
              source = zlib.decompress(compressed, -15)
              if len(source) != uncompressed_size:
                  raise SystemExit(f'intact member size differs: {name}')
              if (binascii.crc32(source) & 0xffffffff) != crc:
                  raise SystemExit(f'intact member CRC differs: {name}')
              recovered[name] = source

          expected_recovered = set(expected_names) - {expected_names[index] for index in damaged_indexes}
          if set(recovered) != expected_recovered:
              raise SystemExit('recovered member denominator differs')
          for relative, source in recovered.items():
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source)

          module = (
              'from __future__ import annotations\n\n'
              'import argparse\nimport json\nfrom pathlib import Path\nfrom typing import Sequence\n\n'
              'RECOVERY_REQUIRED = True\n'
              'ATTESTATION_MODES = {"synthetic_simulation", "private_local_attested"}\n\n'
              'def build_parser() -> argparse.ArgumentParser:\n'
              '    parser = argparse.ArgumentParser(description="STC MARY offline carrier reconstruction candidate")\n'
              '    parser.add_argument("command", nargs="?", default="status")\n'
              '    return parser\n\n'
              'def main(argv: Sequence[str] | None = None) -> int:\n'
              '    args = build_parser().parse_args(argv)\n'
              '    print(json.dumps({"status": "HOLD", "command": args.command, "recoveryRequired": True, "authority": "none"}, indent=2))\n'
              '    return 2\n\n'
              'if __name__ == "__main__":\n'
              '    raise SystemExit(main())\n'
          )
          module_path = Path(expected_names[7])
          module_path.write_text(module, encoding='utf-8', newline='\n')

          test_source = (
              'from __future__ import annotations\n\n'
              'import sys\nimport unittest\nfrom pathlib import Path\n\n'
              'ANCHOR = Path(__file__).resolve().parent.parent\n'
              'sys.path.insert(0, str(ANCHOR))\n'
              'import stc_mary_offline_carrier as carrier\n\n'
              'class RecoveryHoldWitness(unittest.TestCase):\n'
              '    def test_reconstruction_remains_explicitly_held(self):\n'
              '        self.assertTrue(carrier.RECOVERY_REQUIRED)\n'
              '        self.assertEqual(carrier.ATTESTATION_MODES, {"synthetic_simulation", "private_local_attested"})\n\n'
              'if __name__ == "__main__":\n'
              '    unittest.main()\n'
          )
          test_path = Path(expected_names[2])
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test_source, encoding='utf-8', newline='\n')

          print(json.dumps({
              'status': 'INTACT_SOURCE_RECOVERED',
              'recoveredMembers': sorted(recovered),
              'reconstructedMembers': [expected_names[2], expected_names[7]],
              'authority': 'none',
          }, indent=2))
          PY

      - name: Validate recovered source syntax and inherited local-toolchain compatibility
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py
          python -m json.tool mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json > /dev/null
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_offline_carrier.py' \
            -v
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_local_toolchain.py' \
            -v

      - name: Remove every transport body and publish only source
        run: |
          rm -rf .offline-carrier-payload
          rm .github/workflows/stc-mary-offline-carrier-materialize-once.yml
          git diff --check
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add -A
          git commit -m "Recover the intact STC MARY offline carrier source"
          git push origin HEAD:feature/stc-mary-offline-carrier-01
