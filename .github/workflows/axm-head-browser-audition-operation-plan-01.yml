name: AXM HEAD Browser Audition Operation Plan 01

on:
  pull_request:
    paths:
      - ".github/workflows/axm-head-browser-audition-operation-plan-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md"
      - "mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json"
      - "mating_surface/anchor_node/axm-head-browser-audition-operation-plan-01.ps1"
      - "mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/browser_audition_operation_plan_contract.js"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.html"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.js"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.css"
      - "mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json"
      - "mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json"
      - "mating_surface/anchor_node/axm_head_browser_physical_audition_operator_console_01.py"
      - "mating_surface/anchor_node/browser_distributed_inference_probe.js"
      - "mating_surface/anchor_node/browser_physical_audition_operator_contract.js"
      - "mating_surface/anchor_node/browser_physical_audition_operator_service_worker.js"
      - "mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/axm-head-browser-audition-operation-plan-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md"
      - "mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json"
      - "mating_surface/anchor_node/axm-head-browser-audition-operation-plan-01.ps1"
      - "mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/browser_audition_operation_plan_contract.js"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.html"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.js"
      - "mating_surface/anchor_node/browser_audition_operation_plan_panel.css"
      - "mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py"
      - "mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-head-browser-audition-operation-plan-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  WITNESS_DENOMINATOR: "72"
  ADMITTED_CONSOLE_COMMIT: ce93cf8856b7fcc9b172b9251b9665df50fdeda4
  ADMITTED_CONSOLE_TREE: 664784d10309665eb3b993ce8f6df4eb5b10baf7

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        coordinate: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Resolve exact Git coordinate
        id: coordinate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.coordinate }}" == "head" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact coordinate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coordinate.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Rematerialize candidate and frozen dependency bytes
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          ref = os.environ["SOURCE_REF"]
          profile_path = "mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json"
          profile_bytes = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{profile_path}"])
          profile = json.loads(profile_bytes)
          for relative in profile["sourceMembers"]:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{relative}"])
              if b"\r" in data:
                  raise SystemExit(f"candidate source contains CR bytes: {relative}")
              path = pathlib.Path(relative); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(data)
          admitted = os.environ["ADMITTED_CONSOLE_COMMIT"]
          for row in profile["dependencies"]:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{admitted}:{row['path']}"])
              if b"\r" in data:
                  raise SystemExit(f"dependency contains CR bytes: {row['path']}")
              path = pathlib.Path(row["path"]); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(data)
          PY

      - name: Verify admitted console coordinate and dependencies
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          tree = subprocess.check_output(["git", "rev-parse", f"{os.environ['ADMITTED_CONSOLE_COMMIT']}^{{tree}}"], text=True).strip()
          if tree != os.environ["ADMITTED_CONSOLE_TREE"]:
              raise SystemExit(f"admitted console tree differs: {tree}")
          profile = json.loads(pathlib.Path("mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json").read_text())
          for row in profile["dependencies"]:
              blob = subprocess.check_output(["git", "rev-parse", f"{os.environ['ADMITTED_CONSOLE_COMMIT']}:{row['path']}"], text=True).strip()
              data = pathlib.Path(row["path"]).read_bytes()
              observed = "sha256:" + hashlib.sha256(data).hexdigest()
              if blob != row["gitBlobSha"] or len(data) != row["bytes"] or observed != row["sha256"]:
                  raise SystemExit(f"dependency differs: {row['path']}")
          PY

      - name: Require exact additive source denominator
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          profile = json.loads(pathlib.Path("mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json").read_text())
          expected = set(profile["sourceMembers"])
          changed = set(subprocess.check_output(["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["SOURCE_REF"]], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"source denominator differs: missing={sorted(expected-changed)} extra={sorted(changed-expected)}")
          for relative in expected:
              status = subprocess.check_output(["git", "diff", "--name-status", os.environ["BASE_SHA"], os.environ["SOURCE_REF"], "--", relative], text=True).strip()
              if not status.startswith("A\t"):
                  raise SystemExit(f"source path is not additive: {relative}: {status}")
          PY

      - name: Compile and inspect source
        shell: bash
        run: |
          ROOT=mating_surface/anchor_node
          python -m py_compile \
            "$ROOT/axm_head_browser_audition_operation_plan_01.py" \
            "$ROOT/verify_axm_head_browser_audition_operation_plan_01.py" \
            "$ROOT/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py" \
            "$ROOT/conformance/test_axm_head_browser_audition_operation_plan_01.py"
          node --check "$ROOT/browser_audition_operation_plan_contract.js"
          node --check "$ROOT/browser_audition_operation_plan_panel.js"

      - name: Qualify profile, bindings campaign, plan, extension, and verifier
        shell: bash
        env:
          RECEIPT_ROOT: ${{ runner.temp }}/axm-operation-plan-receipts
          EXTENSION_ROOT: ${{ runner.temp }}/axm-operation-plan-extension
        run: |
          set -euo pipefail
          ROOT=mating_surface/anchor_node
          PROFILE="$ROOT/axm-head-browser-audition-operation-plan-profile-01.json"
          FIXTURES="$ROOT/fixtures/axm-head-browser-audition-operation-plan-cases-01.json"
          TOOL="$ROOT/axm_head_browser_audition_operation_plan_01.py"
          VERIFY="$ROOT/verify_axm_head_browser_audition_operation_plan_01.py"
          BOOT="$ROOT/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py"
          mkdir -p "$RECEIPT_ROOT"
          python "$TOOL" validate-profile "$PROFILE" > "$RECEIPT_ROOT/profile.json"
          python "$TOOL" validate-fixtures "$PROFILE" "$FIXTURES" > "$RECEIPT_ROOT/fixtures.json"
          python "$TOOL" campaign "$PROFILE" "$GITHUB_WORKSPACE" "$FIXTURES" > "$RECEIPT_ROOT/campaign.json"
          python "$TOOL" source-set "$PROFILE" "$GITHUB_WORKSPACE" > "$RECEIPT_ROOT/source-set.json"
          python -m unittest discover -s "$ROOT/conformance" -p 'test_axm_head_browser_audition_operation_plan_01.py' -v 2>&1 | tee "$RECEIPT_ROOT/tests.txt"
          grep -F "Ran $WITNESS_DENOMINATOR tests" "$RECEIPT_ROOT/tests.txt"
          grep -Fx "OK" "$RECEIPT_ROOT/tests.txt"
          python "$TOOL" build-extension "$PROFILE" "$GITHUB_WORKSPACE" "$EXTENSION_ROOT" > "$RECEIPT_ROOT/build.json"
          python "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$EXTENSION_ROOT" > "$RECEIPT_ROOT/direct.json"
          python "$BOOT" "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$EXTENSION_ROOT" > "$RECEIPT_ROOT/bootstrap.json"
          python - "$RECEIPT_ROOT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          campaign = json.loads((root / "campaign.json").read_text())
          direct = json.loads((root / "direct.json").read_text())
          bootstrap = json.loads((root / "bootstrap.json").read_text())
          if campaign.get("status") != "PASS" or campaign.get("caseCount") != 24:
              raise SystemExit(campaign)
          if direct.get("status") != "PASS" or direct.get("operationPlanExecuted") is not False:
              raise SystemExit(direct)
          if bootstrap.get("status") != "PASS" or bootstrap.get("bootstrapAuthenticated") is not True:
              raise SystemExit(bootstrap)
          PY

      - name: Exercise PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Root = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node'
          $Entry = Join-Path $Root 'axm-head-browser-audition-operation-plan-01.ps1'
          $Profile = Join-Path $Root 'axm-head-browser-audition-operation-plan-profile-01.json'
          $Fixtures = Join-Path $Root 'fixtures\axm-head-browser-audition-operation-plan-cases-01.json'
          $Output = Join-Path $env:RUNNER_TEMP 'axm-operation-plan-extension-powershell'
          & $Entry validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Entry validate-fixtures $Profile $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Entry campaign $Profile $env:GITHUB_WORKSPACE $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Entry build-extension $Profile $env:GITHUB_WORKSPACE $Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Entry verify-extension $Profile $env:GITHUB_WORKSPACE $Output
          exit $LASTEXITCODE

      - name: Emit exact-coordinate receipt
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
          PLATFORM: ${{ matrix.os }}
          COORDINATE: ${{ matrix.coordinate }}
          RECEIPT_ROOT: ${{ runner.temp }}/axm-operation-plan-receipts
        run: |
          python - "$RECEIPT_ROOT" <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          source = json.loads((root / "source-set.json").read_text())
          build = json.loads((root / "build.json").read_text())
          direct = json.loads((root / "direct.json").read_text())
          receipt = {
              "schema": "axm-head/browser-audition-operation-plan-coordinate-receipt@1",
              "status": "PASS",
              "gitCommit": subprocess.check_output(["git", "rev-parse", os.environ["SOURCE_REF"]], text=True).strip(),
              "gitTree": subprocess.check_output(["git", "rev-parse", f"{os.environ['SOURCE_REF']}^{{tree}}"], text=True).strip(),
              "platform": os.environ["PLATFORM"],
              "coordinate": os.environ["COORDINATE"],
              "sourceBindingId": source["sourceBindingId"],
              "extensionId": build["extensionId"],
              "sourceMemberCount": source["sourceMemberCount"],
              "extensionMemberCount": direct["extensionMemberCount"],
              "operationPlanExecuted": False,
              "browserLaunched": False,
              "actualSupplierQualified": False,
              "physicalEstateQualified": False,
              "missionAuthority": "none",
              "commandAuthority": "none",
          }
          (root / "coordinate.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: axm-operation-plan-${{ matrix.os }}-${{ matrix.coordinate }}-${{ github.sha }}
          path: ${{ runner.temp }}/axm-operation-plan-receipts
          if-no-files-found: error
          retention-days: 14

  compare:
    if: github.event_name == 'pull_request'
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: axm-operation-plan-*-${{ github.sha }}
          path: receipts
      - name: Require cross-platform and cross-coordinate identity
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          paths = sorted(pathlib.Path("receipts").glob("*/coordinate.json"))
          if len(paths) != 4:
              raise SystemExit(f"expected four coordinate receipts, observed {len(paths)}")
          rows = [json.loads(path.read_text()) for path in paths]
          keys = ("sourceBindingId", "extensionId", "sourceMemberCount", "extensionMemberCount", "operationPlanExecuted", "browserLaunched", "actualSupplierQualified", "physicalEstateQualified", "missionAuthority", "commandAuthority")
          first = {key: rows[0][key] for key in keys}
          for row in rows[1:]:
              if {key: row[key] for key in keys} != first:
                  raise SystemExit("cross-coordinate semantic identity differs")
          if {(row["platform"], row["coordinate"]) for row in rows} != {("ubuntu-latest", "head"), ("ubuntu-latest", "merge"), ("windows-latest", "head"), ("windows-latest", "merge")}:
              raise SystemExit("coordinate denominator differs")
          pathlib.Path("cross-coordinate.json").write_text(json.dumps({"schema":"axm-head/browser-audition-operation-plan-cross-coordinate@1","status":"PASS","coordinates":4,**first},sort_keys=True,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: axm-operation-plan-cross-coordinate-${{ github.sha }}
          path: cross-coordinate.json
          if-no-files-found: error
          retention-days: 14
