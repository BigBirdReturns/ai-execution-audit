name: TEMP fix PR73 Windows junction witness

on:
  push:
    branches:
      - work/stc-mary-flight-01-cartridge-02
    paths:
      - ".github/workflows/temp-fix-pr73-windows-junction-witness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-pr73-windows-junction-witness
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/stc-mary-flight-01-cartridge-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Repair junction creation argument vector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py')
          text = path.read_text(encoding='utf-8')
          old = '["cmd.exe", "/d", "/c", f\'mklink /J "{link}" "{target}"\'],'
          new = '["cmd.exe", "/d", "/c", "mklink", "/J", str(link), str(target)],'
          if text.count(old) != 1:
              raise SystemExit(f'junction helper anchor differs: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Qualify the permanent source locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'Ran 25 tests' "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'OK' "$RUNNER_TEMP/cartridge-tests.txt"
          git diff --check

      - name: Commit only the permanent eight-path product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-fix-pr73-windows-junction-witness.yml
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/stc-mary-flight-01-cartridge-01.yml',
              'mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py',
              'mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json',
              'mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1',
              'mating_surface/anchor_node/stc_mary_flight_01_cartridge.py',
              'mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py',
              'mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', 'dd486472a8c610a20ee062dd6746c86fe8ede4b4'],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'final path denominator differs: expected={sorted(expected)} observed={sorted(actual)}'
              )
          PY
          git commit -m 'Repair Windows junction witness creation'
          git push origin HEAD:refs/heads/work/stc-mary-flight-01-cartridge-02
