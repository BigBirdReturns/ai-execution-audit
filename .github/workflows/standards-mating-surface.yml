name: Standards-first mating surface qualification

on:
  pull_request:
    paths:
      - "mating_surface/**"
      - "adapters/polybolos/README.md"
      - ".github/workflows/standards-mating-surface.yml"
  push:
    branches:
      - main
    paths:
      - "mating_surface/**"
      - "adapters/polybolos/README.md"
      - ".github/workflows/standards-mating-surface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-mating-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-standards-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the audit estate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run registry, venue, binding, and provider-boundary tests
        run: node --test mating_surface/conformance/registry.test.mjs

      - name: Compile the reference venue profile
        run: |
          mkdir -p qualification/standards-mating-surface
          node mating_surface/core/registry.mjs \
            mating_surface/standards/registry.json \
            mating_surface/venues/joint-edge-command-authority.json \
            | tee qualification/standards-mating-surface/profile-receipt.json

      - name: Retain standards-surface qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: standards-first-mating-surface-qualification
          path: qualification/standards-mating-surface
          if-no-files-found: error
