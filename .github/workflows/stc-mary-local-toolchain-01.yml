name: STC MARY Local Toolchain 01

on:
  pull_request:
    paths:
      - "mating_surface/anchor_node/stc-mary-local-toolchain-profile-01.json"
      - "mating_surface/anchor_node/stc_mary_local_toolchain.py"
      - "mating_surface/anchor_node/stc_mary_local/**"
      - "mating_surface/anchor_node/stc-mary-local-toolchain.ps1"
      - "mating_surface/anchor_node/STC-MARY-LOCAL-TOOLCHAIN-RUNBOOK.md"
      - "mating_surface/anchor_node/conformance/test_stc_mary_local_toolchain.py"
      - ".github/workflows/stc-mary-local-toolchain-01.yml"
  push:
    branches:
      - main
    paths:
      - "mating_surface/anchor_node/stc-mary-local-toolchain-profile-01.json"
      - "mating_surface/anchor_node/stc_mary_local_toolchain.py"
      - "mating_surface/anchor_node/stc_mary_local/**"
      - "mating_surface/anchor_node/stc-mary-local-toolchain.ps1"
      - "mating_surface/anchor_node/STC-MARY-LOCAL-TOOLCHAIN-RUNBOOK.md"
      - "mating_surface/anchor_node/conformance/test_stc_mary_local_toolchain.py"
      - ".github/workflows/stc-mary-local-toolchain-01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-mary-local-toolchain-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-provider-free-toolchain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse network, credential, and private-identifier surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('mating_surface/anchor_node/stc-mary-local-toolchain-profile-01.json'),
              Path('mating_surface/anchor_node/stc_mary_local_toolchain.py'),
              *sorted(Path('mating_surface/anchor_node/stc_mary_local').glob('*.py')),
              Path('mating_surface/anchor_node/stc-mary-local-toolchain.ps1'),
              Path('mating_surface/anchor_node/STC-MARY-LOCAL-TOOLCHAIN-RUNBOOK.md'),
              Path('mating_surface/anchor_node/conformance/test_stc_mary_local_toolchain.py'),
          ]
          joined = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = {
              'network runtime': r'\b(?:requests|urllib3|aiohttp|httpx)\b|socket\.(?:connect|create_connection)',
              'credential material': r'AKIA[0-9A-Z]{16}|BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:\s*Bearer',
              'private host': r'OCTO-(?:W|L)[0-9]+',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, joined, re.I):
                  raise SystemExit(f'{label} detected in public toolchain surface')
          PY

      - name: Check exact syntax and profile
        shell: bash
        run: |
          python -m py_compile mating_surface/anchor_node/stc_mary_local_toolchain.py
          python -m py_compile mating_surface/anchor_node/stc_mary_local/*.py
          python -m py_compile mating_surface/anchor_node/conformance/test_stc_mary_local_toolchain.py
          python mating_surface/anchor_node/stc_mary_local_toolchain.py validate-profile \
            mating_surface/anchor_node/stc-mary-local-toolchain-profile-01.json

      - name: Run closed adversarial suite
        shell: bash
        run: |
          mkdir -p qualification/stc-mary-local-toolchain-01
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_local_toolchain.py' \
            -v 2>&1 | tee qualification/stc-mary-local-toolchain-01/test-output-${{ matrix.os }}.txt

      - name: Generate and verify deterministic feed and resident-floor workload
        shell: bash
        run: |
          FEED_A="$RUNNER_TEMP/stc-mary-local-feed-ci-a"
          FEED_B="$RUNNER_TEMP/stc-mary-local-feed-ci-b"
          RESULT="$RUNNER_TEMP/personal-floor-result.json"
          VERIFY="$RUNNER_TEMP/personal-floor-verification.json"
          python mating_surface/anchor_node/stc_mary_local_toolchain.py generate-feed \
            --out "$FEED_A" --records 4096 --features 16 --classes 4 --seed 20260827
          python mating_surface/anchor_node/stc_mary_local_toolchain.py generate-feed \
            --out "$FEED_B" --records 4096 --features 16 --classes 4 --seed 20260827
          cmp "$FEED_A/features.bin" "$FEED_B/features.bin"
          cmp "$FEED_A/feed-manifest.json" "$FEED_B/feed-manifest.json"
          python mating_surface/anchor_node/stc_mary_local_toolchain.py run-workload \
            --feed "$FEED_A" --backend python --out "$RESULT"
          python mating_surface/anchor_node/stc_mary_local_toolchain.py verify-workload \
            --feed "$FEED_A" --result "$RESULT" --out "$VERIFY"
          cp "$FEED_A/feed-manifest.json" qualification/stc-mary-local-toolchain-01/
          cp "$RESULT" qualification/stc-mary-local-toolchain-01/personal-floor-result-${{ matrix.os }}.json
          cp "$VERIFY" qualification/stc-mary-local-toolchain-01/personal-floor-verification-${{ matrix.os }}.json

      - name: Capture a private readiness record and retain only its body-free projection
        shell: bash
        run: |
          PREP="$RUNNER_TEMP/stc-mary-local-prep-ci"
          python mating_surface/anchor_node/stc_mary_local_toolchain.py doctor \
            --repository "$GITHUB_WORKSPACE" \
            --out "$PREP" \
            --artifact "toolchain=mating_surface/anchor_node/stc_mary_local_toolchain.py"
          python - <<'PY'
          import json, os, pathlib, re
          prep = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stc-mary-local-prep-ci'
          projection = json.loads((prep / 'readiness-public-projection.json').read_text(encoding='utf-8'))
          encoded = json.dumps(projection, sort_keys=True)
          forbidden = [r'[A-Za-z]:\\\\', r'/home/', r'"privatePath"\s*:', r'Authorization:\s*Bearer', r'OCTO-(?:W|L)[0-9]+']
          for pattern in forbidden:
              if re.search(pattern, encoded, re.I):
                  raise SystemExit(f'body-free projection contains forbidden material: {pattern}')
          destination = pathlib.Path('qualification/stc-mary-local-toolchain-01/readiness-public-projection-${{ matrix.os }}.json')
          destination.write_text(json.dumps(projection, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Preserve provider-free qualification receipts
        uses: actions/upload-artifact@v4
        with:
          name: stc-mary-local-toolchain-01-${{ matrix.os }}-${{ github.sha }}
          path: qualification/stc-mary-local-toolchain-01/
          if-no-files-found: error
          retention-days: 14

  qualify-powershell-entrypoint:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate PowerShell wrapper and run one foreign-root campaign
        shell: pwsh
        run: |
          $Tool = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-local-toolchain.ps1'
          $Profile = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-local-toolchain-profile-01.json'
          & $Tool validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Feed = Join-Path $env:RUNNER_TEMP 'stc-mary-local-feed-wrapper'
          $Result = Join-Path $env:RUNNER_TEMP 'wrapper-result.json'
          $Verification = Join-Path $env:RUNNER_TEMP 'wrapper-verification.json'
          & $Tool generate-feed --out $Feed --records 2048 --features 16 --classes 4 --seed 20260827
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool run-workload --feed $Feed --backend python --out $Result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool verify-workload --feed $Feed --result $Result --out $Verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $receipt = Get-Content -Raw $Verification | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'PowerShell wrapper verification did not pass' }
