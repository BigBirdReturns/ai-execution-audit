name: JOIN v2 source materializer

on:
  push:
    branches:
      - work/axm-head-physical-long-haul-001-join-v2

permissions:
  contents: write

concurrency:
  group: join-v2-source-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/work/axm-head-physical-long-haul-001-join-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact construction branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-physical-long-haul-001-join-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate and materialize the complete eight-file candidate
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          chunk_paths = [root / f".join-v2-source.b64.{index:02d}" for index in range(4)]
          for path in chunk_paths:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"missing or unsafe source chunk: {path.name}")

          encoded = "".join(path.read_text(encoding="ascii") for path in chunk_paths)
          try:
              archive = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"source archive base64 is invalid: {exc}") from exc

          expected_archive_sha256 = "d45551b8f4d6f4079258794f5d52b415f7be2470e6b55fe2af9fc8a6995b3ad9"
          observed_archive_sha256 = hashlib.sha256(archive).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  f"source archive digest mismatch: expected={expected_archive_sha256} observed={observed_archive_sha256}"
              )

          expected = {
              ".github/workflows/axm-head-physical-long-haul-001-join-v2.yml": "4dec8af1cb882d168ff82a30a0b637c7b5105c87ded2547bb52f3547c80b6027",
              "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md": "1c21c74ecd4e3b554b2451ea45f077c2782bcedf20e1658372684963526ed532",
              "mating_surface/anchor_node/axm-head-physical-long-haul-001-join-v2-profile.json": "87f92e2a1ee7ad8c9ce5ed7617ab581b3ed8d61f46434e711aeb61efc16df228",
              "mating_surface/anchor_node/axm-head-physical-long-haul-001-join-v2.ps1": "918b0fcb91f3bae90a557bbb39008df5a056f0b222c6c2808f3fcc535ed017e7",
              "mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py": "e55e13f05af116ac47895cb136111f7bae8c0cc20fb40bf397e3a506ae109b4b",
              "mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py": "2c0adedf14e65775f7d1977131c9d5a3272af89f4fe72b037eda6ad511d9aba9",
              "mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py": "986dc33080352d978992102b8bf2e3b2a1f795a956529983b90eee055cb758f7",
              "mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py": "6ee5c656863e9b68b4bc9aeabb513e1fe952fba7f4331f999558ebf2f26b98c3",
          }
          workflow_member = ".github/workflows/axm-head-physical-long-haul-001-join-v2.yml"
          workflow_staging = root / ".join-v2-permanent-workflow.yml"

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f"source member denominator mismatch: {names!r}")
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts or not member.isfile():
                      raise SystemExit(f"unsafe source member: {member.name}")
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"source member cannot be read: {member.name}")
                  data = source.read()
                  observed = hashlib.sha256(data).hexdigest()
                  if observed != expected[member.name]:
                      raise SystemExit(
                          f"source member digest mismatch: {member.name} expected={expected[member.name]} observed={observed}"
                      )
                  destination = workflow_staging if member.name == workflow_member else root.joinpath(*pure.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)

          if hashlib.sha256(workflow_staging.read_bytes()).hexdigest() != expected[workflow_member]:
              raise SystemExit("staged permanent workflow digest mismatch")
          for relative, required_digest in expected.items():
              if relative == workflow_member:
                  continue
              observed = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if observed != required_digest:
                  raise SystemExit(f"materialized source drift: {relative}")

          for path in chunk_paths:
              path.unlink()
          print("materialized seven permanent members and one authenticated workflow staging blob")
          PY

      - name: Commit only non-workflow source and authenticated workflow staging bytes
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "work/axm-head-physical-long-haul-001-join-v2"
          git diff --check
          git status --short
          git add -A -- \
            .join-v2-source.b64.00 \
            .join-v2-source.b64.01 \
            .join-v2-source.b64.02 \
            .join-v2-source.b64.03 \
            .join-v2-permanent-workflow.yml \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md \
            mating_surface/anchor_node/axm-head-physical-long-haul-001-join-v2-profile.json \
            mating_surface/anchor_node/axm-head-physical-long-haul-001-join-v2.ps1 \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize authenticated AXM HEAD JOIN v2 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
