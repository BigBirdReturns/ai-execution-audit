name: TEMP Materialize Browser Physical-Audition Operator Console Repair 01

on:
  push:
    branches:
      - work/axm-head-browser-physical-audition-operator-console-01
    paths:
      - ".github/workflows/temp-materialize-axm-browser-physical-audition-operator-console-repair-01.yml"

permissions:
  contents: write

concurrency:
  group: temp-materialize-browser-physical-audition-operator-console-repair-01
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_COMMIT: 77e4ac6be8dacefff270d73be35c459901cfb1b3
      BASE_TREE: 4c1b477a1ef68342e9e61daeb724fd6b25dc93fb
      CARRIER_SHA256: 02ceeab0df788bb50b56f5babe0db86dd810b5d5036428ccb8fb174a8dd3c405
      BRANCH: work/axm-head-browser-physical-audition-operator-console-01

    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/axm-head-browser-physical-audition-operator-console-01
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Decode, qualify, and freeze the repaired candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$BASE_COMMIT" ]] || { echo "main moved" >&2; exit 2; }
          [[ "$(git rev-parse 'origin/main^{tree}')" == "$BASE_TREE" ]] || { echo "main tree differs" >&2; exit 2; }

          python - "$RUNNER_TEMP/source.b64" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.request

          shas = (
              "ab2d4085f01d0f64442a55dd1f2198b485828052",
              "1fcbb88f0b65c1cc4375dabb4996bf8935f0e0e6",
              "6719f4b0d6d0eea7e335321620eef372087d22de",
              "f66347d6f48b05e66ac72cdf8cbecb5722f7f868",
              "be997be1d701a0dccfe7f9809de764042058a418",
              "4e212e17e25def07513d36d63ba0ef5f9064e231",
              "345e7cc9762af6b6ed3bd089776000d467d921dd",
              "e5f7e8ea8970ad347506484339b8f1241c359c14",
              "10904e3d6b161cbec1e07ac4b9adad4f72385d54",
              "ba5c8de3405028cb6f90c4582ef445960993b3c0",
          )
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          output = Path(sys.argv[1])
          with output.open("wb") as handle:
              for sha in shas:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
                  if body.get("sha") != sha or body.get("encoding") != "base64":
                      raise SystemExit(f"Git blob response differs: {sha}: {body.get('sha')} {body.get('encoding')}")
                  handle.write(base64.b64decode(body["content"], validate=False))
          PY
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.zip"
          observed="$(sha256sum "$RUNNER_TEMP/source.zip" | awk '{print $1}')"
          [[ "$observed" == "$CARRIER_SHA256" ]] || { echo "carrier digest differs: $observed" >&2; exit 2; }

          python - "$RUNNER_TEMP/source.zip" <<'PY'
          from pathlib import PurePosixPath
          import stat
          import sys
          import zipfile

          expected = {
              ".github/workflows/axm-head-browser-physical-audition-operator-console-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-BROWSER-PHYSICAL-AUDITION-OPERATOR-CONSOLE-01.md",
              "mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json",
              "mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-01.ps1",
              "mating_surface/anchor_node/axm_head_browser_physical_audition_operator_console_01.py",
              "mating_surface/anchor_node/browser_physical_audition_operator_contract.js",
              "mating_surface/anchor_node/browser_physical_audition_operator_service_worker.js",
              "mating_surface/anchor_node/browser_physical_audition_operator_panel.html",
              "mating_surface/anchor_node/browser_physical_audition_operator_panel.js",
              "mating_surface/anchor_node/browser_physical_audition_operator_panel.css",
              "mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01.py",
              "mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01_bootstrap.py",
              "mating_surface/anchor_node/conformance/test_axm_head_browser_physical_audition_operator_console_01.py",
              "mating_surface/anchor_node/fixtures/axm-head-browser-physical-audition-operator-console-cases-01.json",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              rows = archive.infolist()
              names = [row.filename for row in rows]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit("archive denominator differs")
              for row in rows:
                  path = PurePosixPath(row.filename)
                  if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
                      raise SystemExit(f"unsafe archive member: {row.filename}")
                  if row.is_dir() or stat.S_ISLNK(row.external_attr >> 16):
                      raise SystemExit(f"non-regular archive member: {row.filename}")
                  data = archive.read(row)
                  if not data or b"\r" in data:
                      raise SystemExit(f"empty or CR-bearing member: {row.filename}")
          PY

          temporary_head="$(git rev-parse HEAD)"
          git reset --hard origin/main
          python - "$RUNNER_TEMP/source.zip" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for row in archive.infolist():
                  target = Path(*PurePosixPath(row.filename).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(row))
          PY

          ROOT=mating_surface/anchor_node
          PROFILE="$ROOT/axm-head-browser-physical-audition-operator-console-profile-01.json"
          FIXTURES="$ROOT/fixtures/axm-head-browser-physical-audition-operator-console-cases-01.json"
          TOOL="$ROOT/axm_head_browser_physical_audition_operator_console_01.py"
          VERIFY="$ROOT/verify_axm_head_browser_physical_audition_operator_console_01.py"
          BOOT="$ROOT/verify_axm_head_browser_physical_audition_operator_console_01_bootstrap.py"
          TESTS="$ROOT/conformance/test_axm_head_browser_physical_audition_operator_console_01.py"
          OUTPUT="$RUNNER_TEMP/extension"

          python -m py_compile "$TOOL" "$VERIFY" "$BOOT" "$TESTS"
          node --check "$ROOT/browser_physical_audition_operator_contract.js"
          node --check "$ROOT/browser_physical_audition_operator_service_worker.js"
          node --check "$ROOT/browser_physical_audition_operator_panel.js"
          python "$TOOL" validate-profile "$PROFILE" > "$RUNNER_TEMP/profile.json"
          python "$TOOL" validate-fixtures "$PROFILE" "$FIXTURES" > "$RUNNER_TEMP/fixtures.json"
          python "$TOOL" campaign "$PROFILE" "$FIXTURES" > "$RUNNER_TEMP/campaign.json"
          python "$TOOL" source-set "$PROFILE" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/source-set.json"
          python -m unittest discover -s "$ROOT/conformance" -p 'test_axm_head_browser_physical_audition_operator_console_01.py' -v 2>&1 | tee "$RUNNER_TEMP/tests.txt"
          grep -F 'Ran 81 tests' "$RUNNER_TEMP/tests.txt"
          grep -Fx 'OK' "$RUNNER_TEMP/tests.txt"
          python "$TOOL" build-extension "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RUNNER_TEMP/build.json"
          python "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RUNNER_TEMP/direct.json"
          python "$BOOT" "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RUNNER_TEMP/bootstrap.json"

          python - "$RUNNER_TEMP/campaign.json" "$RUNNER_TEMP/direct.json" "$RUNNER_TEMP/bootstrap.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          campaign, direct, bootstrap = [json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:]]
          if campaign.get("status") != "PASS" or campaign.get("caseCount") != 52:
              raise SystemExit(campaign)
          if direct.get("status") != "PASS" or direct.get("bootstrapAuthenticated") is not False:
              raise SystemExit(direct)
          if bootstrap.get("status") != "PASS" or bootstrap.get("bootstrapAuthenticated") is not True:
              raise SystemExit(bootstrap)
          required = {"canonical-profile-byte-binding", "payload-source-byte-binding", "stored-verifier-byte-binding"}
          if not required.issubset(set(direct.get("checks", []))):
              raise SystemExit("direct verifier omitted repaired custody checks")
          if not required.issubset(set(bootstrap.get("checks", []))):
              raise SystemExit("bootstrap omitted repaired custody checks")
          PY

          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          expected=(
            '.github/workflows/axm-head-browser-physical-audition-operator-console-01.yml'
            'mating_surface/anchor_node/AXM-HEAD-BROWSER-PHYSICAL-AUDITION-OPERATOR-CONSOLE-01.md'
            'mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json'
            'mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-01.ps1'
            'mating_surface/anchor_node/axm_head_browser_physical_audition_operator_console_01.py'
            'mating_surface/anchor_node/browser_physical_audition_operator_contract.js'
            'mating_surface/anchor_node/browser_physical_audition_operator_service_worker.js'
            'mating_surface/anchor_node/browser_physical_audition_operator_panel.html'
            'mating_surface/anchor_node/browser_physical_audition_operator_panel.js'
            'mating_surface/anchor_node/browser_physical_audition_operator_panel.css'
            'mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01.py'
            'mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01_bootstrap.py'
            'mating_surface/anchor_node/conformance/test_axm_head_browser_physical_audition_operator_console_01.py'
            'mating_surface/anchor_node/fixtures/axm-head-browser-physical-audition-operator-console-cases-01.json'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t observed_paths < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | LC_ALL=C sort)
          [[ "${observed_paths[*]}" == "${wanted[*]}" ]] || { echo "working denominator differs" >&2; printf '%s\n' "${observed_paths[@]}" >&2; exit 2; }
          for path in "${expected[@]}"; do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              echo "product path already exists on floor: $path" >&2
              exit 2
            fi
          done
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          [[ "${staged[*]}" == "${wanted[*]}" ]] || { echo "staged denominator differs" >&2; exit 2; }
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair the browser physical-audition operator console'
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push --force-with-lease="refs/heads/$BRANCH:$temporary_head" origin "HEAD:refs/heads/$BRANCH"
