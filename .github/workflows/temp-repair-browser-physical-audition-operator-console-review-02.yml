          python - "$RUNNER_TEMP/campaign.json" "$RUNNER_TEMP/direct.json" "$RUNNER_TEMP/bootstrap.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          campaign, direct, bootstrap = [json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:]]
          if campaign.get("status") != "PASS" or campaign.get("caseCount") != 52:
              raise SystemExit(campaign)
          required = {"canonical-profile-byte-binding", "payload-source-byte-binding", "stored-verifier-byte-binding"}
          for body in (direct, bootstrap):
              if body.get("status") != "PASS" or not required.issubset(set(body.get("checks", []))):
