name: TEMP fix STC MARY cartridge root symlink custody

on:
  push:
    branches:
      - work/stc-mary-flight-01-cartridge-02
    paths:
      - ".github/workflows/temp-fix-stc-mary-cartridge-root-symlink-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-stc-mary-cartridge-root-symlink-01
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/stc-mary-flight-01-cartridge-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse symlinked cartridge roots before resolution
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          anchor = Path("mating_surface/anchor_node")
          bootstrap_path = anchor / "verify_stc_mary_flight_01_cartridge_bootstrap.py"
          verifier_path = anchor / "verify_stc_mary_flight_01_cartridge.py"
          builder_path = anchor / "stc_mary_flight_01_cartridge.py"
          tests_path = anchor / "conformance/test_stc_mary_flight_01_cartridge.py"
          runbook_path = anchor / "STC-MARY-FLIGHT-01-CARTRIDGE-01.md"

          old_verifier_sha = "41fbcad8073c3c5e203e100d8f1841272c507519e83e2a5eef473c2a1782d9fb"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              bootstrap_path,
              '''        root = args.cartridge.resolve(strict=True)\n        if not root.is_dir() or root.is_symlink():\n            fail("CARTRIDGE_ROOT_INVALID", "cartridge root must be a regular directory")\n''',
              '''        supplied_root = args.cartridge\n        if supplied_root.is_symlink():\n            fail("CARTRIDGE_ROOT_SYMLINK_REFUSED", "cartridge root may not be a symlink")\n        root = supplied_root.resolve(strict=True)\n        if not root.is_dir():\n            fail("CARTRIDGE_ROOT_INVALID", "cartridge root must be a regular directory")\n''',
              "bootstrap pre-resolution root custody",
          )

          replace_once(
              verifier_path,
              '''def validate_profile(profile: dict[str, Any]) -> dict[str, Any]:\n''',
              '''def resolve_cartridge_root(path: Path) -> Path:\n    if path.is_symlink():\n        fail("CARTRIDGE_ROOT_SYMLINK_REFUSED", "cartridge root may not be a symlink")\n    return path.resolve(strict=True)\n\n\ndef validate_profile(profile: dict[str, Any]) -> dict[str, Any]:\n''',
              "verifier root resolver insertion",
          )
          replace_once(
              verifier_path,
              '''def verify_cartridge(root: Path) -> dict[str, Any]:\n    root = root.resolve(strict=True)\n    validate_tree(root)\n''',
              '''def verify_cartridge(root: Path) -> dict[str, Any]:\n    root = resolve_cartridge_root(root)\n    validate_tree(root)\n''',
              "verifier library root custody",
          )
          replace_once(
              verifier_path,
              '''        root = args.cartridge.resolve(strict=True)\n        validate_output_path(root, args.out)\n        verdict = verify_cartridge(root)\n''',
              '''        root = resolve_cartridge_root(args.cartridge)\n        validate_output_path(root, args.out)\n        verdict = verify_cartridge(root)\n''',
              "verifier CLI root custody",
          )

          replace_once(
              builder_path,
              '''def run_bootstrap(root: Path, out: Path | None = None) -> dict[str, Any]:\n    bootstrap = source_file(BOOTSTRAP_FILENAME)\n''',
              '''def run_bootstrap(root: Path, out: Path | None = None) -> dict[str, Any]:\n    if root.is_symlink():\n        fail("CARTRIDGE_ROOT_SYMLINK_REFUSED", "cartridge root may not be a symlink")\n    bootstrap = source_file(BOOTSTRAP_FILENAME)\n''',
              "builder bootstrap root custody",
          )
          replace_once(
              builder_path,
              '''        elif args.command == "public-projection":\n            root = args.cartridge.resolve(strict=True)\n            validate_projection_output(root, args.out)\n            emit(public_projection(root), args.out)\n''',
              '''        elif args.command == "public-projection":\n            validate_projection_output(args.cartridge, args.out)\n            emit(public_projection(args.cartridge), args.out)\n''',
              "public projection supplied-coordinate custody",
          )

          replace_once(
              tests_path,
              '''    def test_23_foreign_working_directory_bootstrap(self) -> None:\n        foreign = self.parent / "foreign"\n        foreign.mkdir()\n        code, verdict = run_bootstrap(self.root, cwd=foreign)\n        self.assertEqual(code, 0)\n        self.assertTrue(verdict["bootstrapAuthenticated"])\n''',
              '''    def test_23_foreign_working_directory_bootstrap(self) -> None:\n        foreign = self.parent / "foreign"\n        foreign.mkdir()\n        code, verdict = run_bootstrap(self.root, cwd=foreign)\n        self.assertEqual(code, 0)\n        self.assertTrue(verdict["bootstrapAuthenticated"])\n\n        linked_root = self.parent / "cartridge-root-link"\n        linked_root.symlink_to(self.root, target_is_directory=True)\n\n        bootstrap_output = self.parent / "linked-bootstrap-verdict.json"\n        code, refusal = run_bootstrap(linked_root, bootstrap_output, cwd=foreign)\n        self.assertNotEqual(code, 0)\n        self.assertEqual(refusal["code"], "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n        self.assertFalse(bootstrap_output.exists())\n\n        with self.assertRaises(verifier.CartridgeError) as direct_library:\n            verifier.verify_cartridge(linked_root)\n        self.assertEqual(direct_library.exception.code, "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n\n        direct_output = self.parent / "linked-direct-verdict.json"\n        completed = subprocess.run(\n            [sys.executable, str(EMBEDDED_VERIFIER_SOURCE), str(linked_root), "--out", str(direct_output)],\n            check=False,\n            capture_output=True,\n        )\n        direct_refusal = json.loads(completed.stdout.decode("utf-8"))\n        self.assertNotEqual(completed.returncode, 0)\n        self.assertEqual(direct_refusal["code"], "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n        self.assertFalse(direct_output.exists())\n\n        verify_output = self.parent / "linked-tool-verdict.json"\n        completed = subprocess.run(\n            [sys.executable, str(MAIN_TOOL), "verify", str(linked_root), "--out", str(verify_output)],\n            check=False,\n            capture_output=True,\n        )\n        verify_refusal = json.loads(completed.stdout.decode("utf-8"))\n        self.assertNotEqual(completed.returncode, 0)\n        self.assertEqual(verify_refusal["code"], "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n        self.assertFalse(verify_output.exists())\n\n        with self.assertRaises(tool.BuildError) as projection_library:\n            tool.public_projection(linked_root)\n        self.assertEqual(projection_library.exception.code, "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n\n        projection_output = self.parent / "linked-public-projection.json"\n        completed = subprocess.run(\n            [sys.executable, str(MAIN_TOOL), "public-projection", str(linked_root), "--out", str(projection_output)],\n            check=False,\n            capture_output=True,\n        )\n        projection_refusal = json.loads(completed.stdout.decode("utf-8"))\n        self.assertNotEqual(completed.returncode, 0)\n        self.assertEqual(projection_refusal["code"], "CARTRIDGE_ROOT_SYMLINK_REFUSED")\n        self.assertFalse(projection_output.exists())\n''',
              "symlinked root hostile witness",
          )

          replace_once(
              runbook_path,
              '''A copied bundle remains verifiable from a foreign working directory with standard-library Python. Repository history, MARY source, the builder, the original checkout, a network service, provider credential, and private evidence are not required.\n''',
              '''A copied bundle remains verifiable from a foreign working directory with standard-library Python. Repository history, MARY source, the builder, the original checkout, a network service, provider credential, and private evidence are not required. Every verification and public-projection entrypoint inspects the supplied cartridge root before path resolution and refuses a directory symlink, so the bound cartridge coordinate cannot be retargeted through symlink dereference.\n''',
              "runbook symlink custody law",
          )

          verifier_sha = hashlib.sha256(verifier_path.read_bytes()).hexdigest()
          replace_once(
              builder_path,
              f'EXPECTED_VERIFIER_SHA256 = "{old_verifier_sha}"',
              f'EXPECTED_VERIFIER_SHA256 = "{verifier_sha}"',
              "builder frozen verifier digest",
          )
          replace_once(
              bootstrap_path,
              f'EXPECTED_EMBEDDED_VERIFIER_SHA256 = "{old_verifier_sha}"',
              f'EXPECTED_EMBEDDED_VERIFIER_SHA256 = "{verifier_sha}"',
              "bootstrap frozen verifier digest",
          )

          print(f"embedded verifier sha256: {verifier_sha}")
          PY

      - name: Qualify the repaired source locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python mating_surface/anchor_node/stc_mary_flight_01_cartridge.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "OK" "$RUNNER_TEMP/cartridge-tests.txt"
          git diff --check

      - name: Replace the temporary workflow with the permanent product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/temp-fix-stc-mary-cartridge-root-symlink-01.yml
          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/stc-mary-flight-01-cartridge-01.yml",
              "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md",
              "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1",
              "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "dd486472a8c610a20ee062dd6746c86fe8ede4b4"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"branch product denominator differs: expected={sorted(expected)} observed={sorted(actual)}"
              )
          PY

          git commit -m "Refuse symlinked cartridge roots before resolution"
          git push origin HEAD:refs/heads/work/stc-mary-flight-01-cartridge-02
