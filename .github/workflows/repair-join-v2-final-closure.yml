name: Repair JOIN v2 final semantic closure

on:
  push:
    branches:
      - review/axm-head-physical-long-haul-001-join-v2
    paths:
      - ".github/workflows/repair-join-v2-final-closure.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact review branch
        uses: actions/checkout@v6
        with:
          ref: review/axm-head-physical-long-haul-001-join-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply, test, and commit final closure
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor 68b09111a38c68d66782cebd651404232d06a383 HEAD
          python .github/repair_join_v2_final_closure.py

          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_001_join_v2.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/join-v2-final-repair-tests.txt"
          grep -F "Ran 46 tests" "$RUNNER_TEMP/join-v2-final-repair-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/join-v2-final-repair-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -q
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' \
            -q

          git diff --check
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"

          git rm \
            .github/workflows/repair-join-v2-final-closure.yml \
            .github/repair_join_v2_final_closure.py
          git add \
            .github/workflows/axm-head-physical-long-haul-001-join-v2.yml \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py
          git commit -m "Close JOIN v2 pre-admission semantic gaps"
          git push origin HEAD:review/axm-head-physical-long-haul-001-join-v2
