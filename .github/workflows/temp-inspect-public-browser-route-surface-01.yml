name: TEMP Inspect Public Browser Route Surface 01

on:
  push:
    branches:
      - work/axm-head-browser-audition-operation-plan-01
    paths:
      - .github/workflows/temp-inspect-public-browser-route-surface-01.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect the public unauthenticated static surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surface"
          python - "$RUNNER_TEMP/surface/report.json" <<'PY'
          import hashlib, json, re, sys, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          ORIGIN = "https://swarmllm.ai"
          URLS = [ORIGIN + "/", ORIGIN + "/room"]
          NEEDLES = ["qwen", "model", "layer", "shard", "token", "webrtc", "rtcpeerconnection", "datachannel", "webgpu", "room", "device", "memory", "download", "cache", "worker", "inference", "generate"]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "AXM-Public-Surface-Inspection/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read(12 * 1024 * 1024 + 1)
                  if len(body) > 12 * 1024 * 1024:
                      raise SystemExit("byte ceiling exceeded: " + url)
                  return body, {"requestedUrl": url, "finalUrl": r.geturl(), "status": r.status, "contentType": r.headers.get_content_type(), "bytes": len(body), "sha256": "sha256:" + hashlib.sha256(body).hexdigest(), "etag": r.headers.get("ETag"), "lastModified": r.headers.get("Last-Modified")}

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.assets=[]; self.elements=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  row={k:a.get(k) for k in ("id","class","name","type","role")}
                  if any(v is not None for v in row.values()): self.elements.append({"tag":tag, **row})
                  if tag == "script" and a.get("src"): self.assets.append(a["src"])
                  if tag == "link" and a.get("href") and set((a.get("rel") or "").lower().split()) & {"stylesheet","modulepreload","preload"}: self.assets.append(a["href"])

          def contexts(text):
              lower=text.lower(); out={}
              for needle in NEEDLES:
                  rows=[]; start=0
                  while len(rows)<16:
                      i=lower.find(needle,start)
                      if i<0: break
                      s=re.sub(r"\s+"," ",text[max(0,i-120):min(len(text),i+len(needle)+180)]).strip()
                      if s not in rows: rows.append(s)
                      start=i+len(needle)
                  if rows: out[needle]=rows
              return out

          pages=[]; queue=[]
          for url in URLS:
              body, meta=fetch(url); text=body.decode("utf-8")
              p=Parser(); p.feed(text); assets=[]
              for raw in p.assets:
                  u=urllib.parse.urljoin(meta["finalUrl"],raw); parsed=urllib.parse.urlparse(u)
                  if parsed.scheme=="https" and parsed.netloc=="swarmllm.ai":
                      u=urllib.parse.urlunparse(parsed._replace(fragment=""))
                      if u not in assets: assets.append(u)
                      if u not in queue: queue.append(u)
              pages.append({**meta,"assets":assets,"elements":p.elements,"semanticContexts":contexts(text)})

          assets=[]
          for url in queue[:64]:
              body,meta=fetch(url); row=dict(meta)
              if meta["contentType"].startswith("text/") or "javascript" in meta["contentType"] or url.endswith((".js",".mjs",".css")):
                  text=body.decode("utf-8")
                  row["semanticContexts"]=contexts(text)
                  row["sourceMapReference"]=re.findall(r"sourceMappingURL=([^\s*]+)",text)[-1:]
                  row["absoluteUrls"]=sorted(set(re.findall(r"https://[^\"'`\\s)]+",text)))[:100]
              assets.append(row)

          report={"schema":"axm-head/public-browser-route-surface-inspection@1","status":"PASS","scope":"public-unauthenticated-static-surface-only","origin":ORIGIN,"pages":pages,"assets":assets,"pageCount":len(pages),"assetCount":len(assets),"claimBoundary":"Static public HTTP bytes and element inventory only. No room created, device joined, model selected or downloaded, peer connection formed, inference run, privacy claim verified, or supplier qualified."}
          Path(sys.argv[1]).write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-public-browser-route-surface
          path: ${{ runner.temp }}/surface/report.json
          if-no-files-found: error
          retention-days: 1
