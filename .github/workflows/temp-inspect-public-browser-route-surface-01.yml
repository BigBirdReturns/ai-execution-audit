name: TEMP Inspect Public Browser Route Surface 01

on:
  push:
    branches:
      - work/axm-head-browser-audition-operation-plan-01
    paths:
      - .github/workflows/temp-inspect-public-browser-route-surface-01.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Capture the bounded public runtime surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surface"
          python - "$RUNNER_TEMP/surface" <<'PY'
          import hashlib, json, re, sys, urllib.parse, urllib.request
          from pathlib import Path

          root = Path(sys.argv[1])
          origin = "https://swarmllm.ai"
          urls = {
              "landing.html": origin + "/",
              "room.html": origin + "/room",
              "engine.js": origin + "/engine/engine.js",
              "gguf.js": origin + "/engine/gguf.js",
              "qwen35.js": origin + "/engine/qwen35.js",
          }
          rows = []
          for name, url in urls.items():
              request = urllib.request.Request(url, headers={"User-Agent": "AXM-Public-Runtime-Inspection/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(16 * 1024 * 1024 + 1)
                  if len(body) > 16 * 1024 * 1024:
                      raise SystemExit(f"byte ceiling exceeded: {name}")
                  if response.status != 200:
                      raise SystemExit(f"unexpected status: {name}: {response.status}")
                  body.decode("utf-8", errors="strict")
                  (root / name).write_bytes(body)
                  rows.append({
                      "name": name,
                      "requestedUrl": url,
                      "finalUrl": response.geturl(),
                      "bytes": len(body),
                      "sha256": "sha256:" + hashlib.sha256(body).hexdigest(),
                      "contentType": response.headers.get_content_type(),
                      "etag": response.headers.get("ETag"),
                      "lastModified": response.headers.get("Last-Modified"),
                  })
          room = (root / "room.html").read_text(encoding="utf-8")
          needles = [
              "const MODELS", "let ai =", "async function aiStart", "async function aiGenerate",
              "async function aiOnData", "function updateCluster", "function loadCardRender",
              "function addPeerCard", "function enterRoom", "function sendTo", "function broadcastAll",
              "function aiStatus", "case \"ai-layers\"", "case \"ai-hidden\"", "case \"ai-token\"",
              "case \"ai-done\"", "case \"ai-error\"", "dataConnection", "peer.on(\"connection\"",
          ]
          contexts = {}
          for needle in needles:
              offset = room.find(needle)
              if offset >= 0:
                  contexts[needle] = room[max(0, offset - 500):min(len(room), offset + 5000)]
          (root / "contexts.json").write_text(json.dumps(contexts, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          manifest = {
              "schema": "axm-head/public-browser-route-runtime-inspection@1",
              "status": "PASS",
              "scope": "public-unauthenticated-static-runtime-bytes-only",
              "members": rows,
              "contextKeys": sorted(contexts),
              "claimBoundary": "Public static bytes only. No room created, device joined, model selected or downloaded, peer connection formed, inference run, privacy claim verified, or supplier qualified.",
          }
          (root / "manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, sort_keys=True, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-public-browser-route-runtime
          path: ${{ runner.temp }}/surface
          if-no-files-found: error
          retention-days: 1
