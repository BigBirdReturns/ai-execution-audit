name: TEMP Inspect Public Browser Route Surface 01

on:
  push:
    branches:
      - work/axm-head-browser-audition-operation-plan-01
    paths:
      - .github/workflows/temp-inspect-public-browser-route-surface-01.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ce93cf8856b7fcc9b172b9251b9665df50fdeda4
          fetch-depth: 1
      - name: Stage exact admitted operation dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/admitted-console"
          mkdir -p "$root/mating_surface/anchor_node"
          for path in \
            mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json \
            mating_surface/anchor_node/axm_head_browser_physical_audition_operator_console_01.py \
            mating_surface/anchor_node/browser_distributed_inference_probe.js \
            mating_surface/anchor_node/browser_physical_audition_operator_contract.js \
            mating_surface/anchor_node/browser_physical_audition_operator_service_worker.js \
            mating_surface/anchor_node/verify_axm_head_browser_physical_audition_operator_console_01.py; do
            install -D -m 0644 "$path" "$root/$path"
          done
          python - "$root" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              data=path.read_bytes()
              rows.append({'path':path.relative_to(root).as_posix(),'bytes':len(data),'sha256':'sha256:'+hashlib.sha256(data).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'schema':'axm-head/admitted-console-dependency-transfer@1','commit':'ce93cf8856b7fcc9b172b9251b9665df50fdeda4','tree':'664784d10309665eb3b993ce8f6df4eb5b10baf7','members':rows},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-admitted-console-dependencies
          path: ${{ runner.temp }}/admitted-console
          if-no-files-found: error
          retention-days: 1
