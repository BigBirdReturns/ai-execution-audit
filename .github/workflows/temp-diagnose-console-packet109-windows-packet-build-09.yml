name: TEMP Diagnose Console Packet109 Windows Packet Build 09

on:
  push:
    branches:
      - staging/console-packet109-successor-publish-01
    paths:
      - ".github/workflows/temp-diagnose-console-packet109-windows-packet-build-09.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PREDECESSOR_HEAD: a44f42ed999fab93daa6e30c889f5b5501189f14
  PACKET_ADMISSION_COMMIT: 0df3795b47a58903adc86c68db2b1168de543ab7

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a44f42ed999fab93daa6e30c889f5b5501189f14
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reproduce the packet build and expose its bounded refusal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          ref = os.environ["PREDECESSOR_HEAD"]
          console_profile_path = Path("mating_surface/anchor_node/axm-head-browser-physical-audition-operator-console-profile-01.json")
          console_profile = json.loads(subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{console_profile_path.as_posix()}"]))
          for relative in sorted(set(console_profile["sourceMembers"]) | {row["path"] for row in console_profile["dependencies"]}):
              data = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{relative}"])
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          packet_profile = Path("mating_surface/anchor_node/axm-head-browser-physical-audition-packet-profile-01.json")
          packet_tool = Path("mating_surface/anchor_node/axm_head_browser_physical_audition_packet_01.py")
          with tempfile.TemporaryDirectory(prefix="axm-console-packet-kit-diag-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              kit = Path(temporary) / "kit"
              result = subprocess.run(
                  [sys.executable, str(packet_tool), "build-kit", str(packet_profile), str(Path.cwd()), str(kit)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
          print("PACKET_BUILD_EXIT=" + str(result.returncode))
          print("PACKET_BUILD_STDOUT_BEGIN")
          print(result.stdout)
          print("PACKET_BUILD_STDOUT_END")
          print("PACKET_BUILD_STDERR_BEGIN")
          print(result.stderr)
          print("PACKET_BUILD_STDERR_END")
          if result.returncode == 0:
              raise SystemExit("diagnostic unexpectedly passed")
          PY
