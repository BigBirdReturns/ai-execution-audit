name: STC MARY Flight 01 Cartridge 01

on:
  pull_request:
    paths:
      - ".github/workflows/stc-mary-flight-01-cartridge-01.yml"
      - "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1"
      - "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stc-mary-flight-01-cartridge-01.yml"
      - "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1"
      - "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        coordinate: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Resolve exact Git coordinate
        id: coordinate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.coordinate }}" == "head" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact coordinate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coordinate.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize authoritative source from exact Git blobs
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          paths = (
              ".github/workflows/stc-mary-flight-01-cartridge-01.yml",
              "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1",
              "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py",
              "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py",
          )
          ref = os.environ["SOURCE_REF"]
          for relative in paths:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{relative}"])
              path = pathlib.Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              if b"\r" in data:
                  raise SystemExit(f"authoritative source contains CR bytes: {relative}")
          PY

      - name: Compile source
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py

      - name: Validate frozen profile
        shell: bash
        run: |
          python mating_surface/anchor_node/stc_mary_flight_01_cartridge.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json

      - name: Run closed hostile witness denominator
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"
          grep -F "OK" "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"

      - name: Build twice and verify from a foreign directory
        shell: bash
        run: |
          set -o pipefail
          PROFILE="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
          TOOL="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
          BOOTSTRAP="$GITHUB_WORKSPACE/mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
          OUT="$RUNNER_TEMP/stc-mary-flight-01-cartridge"
          SECOND="$RUNNER_TEMP/stc-mary-flight-01-cartridge-second"
          FOREIGN="$RUNNER_TEMP/stc-mary-flight-01-foreign"
          VERDICT="$RUNNER_TEMP/stc-mary-flight-01-cartridge-verdict.json"
          PUBLIC="$RUNNER_TEMP/stc-mary-flight-01-cartridge-public.json"

          python "$TOOL" build "$PROFILE" --out "$OUT"
          python "$TOOL" build "$PROFILE" --out "$SECOND"
          mkdir -p "$FOREIGN"
          (
            cd "$FOREIGN"
            python "$BOOTSTRAP" "$OUT" --out "$VERDICT"
          )
          python "$TOOL" public-projection "$OUT" --out "$PUBLIC"

          python - "$OUT" "$SECOND" "$VERDICT" "$PUBLIC" "$RUNNER_TEMP/qualification.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          one = Path(sys.argv[1])
          two = Path(sys.argv[2])
          verdict_path = Path(sys.argv[3])
          public_path = Path(sys.argv[4])
          receipt_path = Path(sys.argv[5])
          members = (
              "MANIFEST.json",
              "CARTRIDGE/mission.json",
              "CARTRIDGE/work-unit.json",
              "PUBLIC/status.json",
              "RECOVERY/profile.json",
              "RECOVERY/source-binding.json",
              "RECOVERY/verify_cartridge.py",
          )
          rows = []
          for relative in members:
              left = (one / relative).read_bytes()
              right = (two / relative).read_bytes()
              if left != right:
                  raise SystemExit(f"deterministic byte mismatch: {relative}")
              rows.append({"path": relative, "bytes": len(left), "sha256": hashlib.sha256(left).hexdigest()})
          verdict = json.loads(verdict_path.read_text(encoding="utf-8"))
          public = json.loads(public_path.read_text(encoding="utf-8"))
          profile = json.loads((one / "RECOVERY/profile.json").read_text(encoding="utf-8"))
          source = json.loads((one / "RECOVERY/source-binding.json").read_text(encoding="utf-8"))
          if verdict.get("status") != "PASS" or verdict.get("bootstrapAuthenticated") is not True:
              raise SystemExit("external bootstrap failed")
          if public.get("terminal") != "PREPARED_NOT_ARMED" or public.get("authority") != "none":
              raise SystemExit("public status widened")
          if "flightConductor" in profile.get("sourceCoordinates", {}) or "flightConductor" in source.get("sourceCoordinates", {}):
              raise SystemExit("conductor entered cartridge semantics")
          manifest = json.loads((one / "MANIFEST.json").read_text(encoding="utf-8"))
          receipt = {
              "schema": "stc-mary/flight-01-cartridge-qualification/1",
              "status": "PASS",
              "coordinate": "${{ matrix.coordinate }}",
              "sha": "${{ steps.coordinate.outputs.ref }}",
              "runner": "${{ matrix.os }}",
              "bundleId": manifest["bundleId"],
              "cartridgeId": verdict["cartridgeId"],
              "missionId": verdict["missionId"],
              "workUnitId": verdict["workUnitId"],
              "sourceBindingId": verdict["sourceBindingId"],
              "files": rows,
              "verdictSha256": hashlib.sha256(verdict_path.read_bytes()).hexdigest(),
              "publicSha256": hashlib.sha256(public_path.read_bytes()).hexdigest(),
              "conductorSemanticCoupling": False,
              "physicalExecution": False,
              "authority": "none",
          }
          receipt_path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

          mkdir -p qualification
          cp -R "$OUT" qualification/cartridge
          cp "$VERDICT" qualification/verdict.json
          cp "$PUBLIC" qualification/public.json
          cp "$RUNNER_TEMP/qualification.json" qualification/qualification.json

      - name: Exercise PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tool = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-flight-01-cartridge.ps1'
          $Profile = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-flight-01-cartridge-profile-01.json'
          $Root = Join-Path $env:RUNNER_TEMP ('stc-mary-flight-01-cartridge-powershell-' + '${{ matrix.coordinate }}')
          $Verdict = Join-Path $env:RUNNER_TEMP ('stc-mary-flight-01-cartridge-powershell-' + '${{ matrix.coordinate }}' + '-verdict.json')

          & $Tool validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell profile validation failed.' }
          & $Tool build $Profile --out $Root
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell build failed.' }
          & $Tool verify $Root --out $Verdict
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell verify failed.' }
          $Body = Get-Content -LiteralPath $Verdict -Raw | ConvertFrom-Json
          if ($Body.status -ne 'PASS' -or -not $Body.bootstrapAuthenticated) {
            throw 'PowerShell authenticated verdict failed.'
          }

      - name: Upload exact-coordinate cartridge and receipts
        uses: actions/upload-artifact@v7
        with:
          name: stc-mary-flight-01-cartridge-${{ matrix.coordinate }}-${{ matrix.os }}
          path: qualification
          if-no-files-found: error
          retention-days: 14

  compare:
    if: github.event_name == 'pull_request'
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all exact-coordinate artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: stc-mary-flight-01-cartridge-*
          path: artifacts

      - name: Require cross-platform and head-to-merge byte identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipts = sorted(Path("artifacts").glob("*/qualification.json"))
          if len(receipts) != 4:
              raise SystemExit(f"expected four qualification receipts, found {len(receipts)}")
          bodies = [json.loads(path.read_text(encoding="utf-8")) for path in receipts]
          keys = (
              "bundleId",
              "cartridgeId",
              "missionId",
              "workUnitId",
              "sourceBindingId",
              "files",
              "verdictSha256",
              "publicSha256",
          )
          baseline = {key: bodies[0][key] for key in keys}
          for path, body in zip(receipts, bodies):
              if body.get("status") != "PASS" or body.get("authority") != "none" or body.get("conductorSemanticCoupling") is not False:
                  raise SystemExit(f"qualification widened: {path}")
              for key in keys:
                  if body[key] != baseline[key]:
                      raise SystemExit(f"coordinate identity mismatch for {key}: {path}")
          Path("cross-coordinate.json").write_text(
              json.dumps({"status": "PASS", "receiptCount": 4, **baseline, "authority": "none"}, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload cross-coordinate comparison
        uses: actions/upload-artifact@v7
        with:
          name: stc-mary-flight-01-cartridge-cross-coordinate
          path: cross-coordinate.json
          if-no-files-found: error
          retention-days: 14
