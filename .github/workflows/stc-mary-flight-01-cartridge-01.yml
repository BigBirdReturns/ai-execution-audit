name: STC MARY Flight 01 Cartridge 01

on:
  pull_request:
    paths:
      - ".github/workflows/stc-mary-flight-01-cartridge-01.yml"
      - "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1"
      - "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stc-mary-flight-01-cartridge-01.yml"
      - "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
      - "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1"
      - "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py"
      - "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name == 'pull_request' || matrix.coordinate == 'head'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        coordinate:
          - head
          - merge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Resolve exact Git coordinate
        id: coordinate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.coordinate }}" == "head" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact coordinate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coordinate.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize authoritative source from exact Git blobs
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          paths = (
              ".github/workflows/stc-mary-flight-01-cartridge-01.yml",
              "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1",
              "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py",
              "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py",
          )
          ref = os.environ["SOURCE_REF"]
          for relative in paths:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{relative}"])
              path = pathlib.Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              if b"\r" in data:
                  raise SystemExit(f"authoritative source contains CR bytes: {relative}")
          PY

      - name: Compile source
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py

      - name: Validate frozen profile
        shell: bash
        run: |
          python mating_surface/anchor_node/stc_mary_flight_01_cartridge.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json

      - name: Run closed hostile witness denominator
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"
          grep -F "OK" "$RUNNER_TEMP/stc-mary-flight-01-cartridge-tests.txt"

      - name: Build and externally verify two deterministic cartridges
        shell: bash
        run: |
          PROFILE="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
          TOOL="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
          BOOTSTRAP="$GITHUB_WORKSPACE/mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
          ONE="$RUNNER_TEMP/stc-mary-flight-01-cartridge-one"
          TWO="$RUNNER_TEMP/stc-mary-flight-01-cartridge-two"
          FOREIGN="$RUNNER_TEMP/stc-mary-flight-01-foreign"
          VERDICT="$RUNNER_TEMP/stc-mary-flight-01-cartridge-verdict.json"
          RECEIPT="$RUNNER_TEMP/stc-mary-flight-01-cartridge-receipt"

          python "$TOOL" build "$PROFILE" --out "$ONE"
          python "$TOOL" build "$PROFILE" --out "$TWO"
          mkdir -p "$FOREIGN"
          (
            cd "$FOREIGN"
            python "$BOOTSTRAP" "$ONE" --out "$VERDICT"
          )
          python - "$ONE" "$TWO" "$VERDICT" "$RECEIPT" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          one = Path(sys.argv[1])
          two = Path(sys.argv[2])
          verdict_path = Path(sys.argv[3])
          receipt = Path(sys.argv[4])
          verdict = json.loads(verdict_path.read_text(encoding="utf-8"))
          members = (
              "MANIFEST.json",
              "CARTRIDGE/mission.json",
              "CARTRIDGE/work-unit.json",
              "PUBLIC/status.json",
              "RECOVERY/profile.json",
              "RECOVERY/source-binding.json",
              "RECOVERY/verify_cartridge.py",
          )
          for relative in members:
              if (one / relative).read_bytes() != (two / relative).read_bytes():
                  raise SystemExit(f"deterministic byte mismatch: {relative}")
          if verdict.get("status") != "PASS":
              raise SystemExit("external bootstrap did not return PASS")
          if verdict.get("bootstrapAuthenticated") is not True:
              raise SystemExit("embedded verifier was not externally authenticated")
          if verdict.get("terminal") != "PREPARED_NOT_ARMED":
              raise SystemExit("cartridge terminal differs")
          if verdict.get("authority") != "none":
              raise SystemExit("cartridge authority differs")
          if verdict.get("workstationInitialized") is not False:
              raise SystemExit("cartridge claimed workstation initialization")
          if verdict.get("packetStagesRecorded") != 0:
              raise SystemExit("cartridge claimed packet progress")
          receipt.mkdir()
          shutil.copytree(one, receipt / "cartridge")
          shutil.copyfile(verdict_path, receipt / "verdict.json")
          print(json.dumps(verdict, sort_keys=True, separators=(",", ":")))
          PY

      - name: Exercise PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Wrapper = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-flight-01-cartridge.ps1'
          $Profile = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-flight-01-cartridge-profile-01.json'
          & $Wrapper validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain exact-coordinate authoritative bytes
        uses: actions/upload-artifact@v4
        with:
          name: stc-cartridge-${{ matrix.os }}-${{ matrix.coordinate }}
          path: ${{ runner.temp }}/stc-mary-flight-01-cartridge-receipt
          if-no-files-found: error

  compare:
    if: github.event_name == 'pull_request'
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all exact-coordinate receipts
        uses: actions/download-artifact@v4
        with:
          pattern: stc-cartridge-*
          path: receipts

      - name: Require platform and head-to-merge byte identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("receipts")
          coordinates = (
              "stc-cartridge-ubuntu-latest-head",
              "stc-cartridge-ubuntu-latest-merge",
              "stc-cartridge-windows-latest-head",
              "stc-cartridge-windows-latest-merge",
          )
          for coordinate in coordinates:
              if not (root / coordinate).is_dir():
                  raise SystemExit(f"missing coordinate receipt: {coordinate}")
          baseline = root / coordinates[0]
          baseline_files = {
              p.relative_to(baseline).as_posix(): p.read_bytes()
              for p in baseline.rglob("*")
              if p.is_file()
          }
          for coordinate in coordinates[1:]:
              candidate = root / coordinate
              files = {
                  p.relative_to(candidate).as_posix(): p.read_bytes()
                  for p in candidate.rglob("*")
                  if p.is_file()
              }
              if files != baseline_files:
                  differing = sorted(set(files) ^ set(baseline_files) | {k for k in set(files) & set(baseline_files) if files[k] != baseline_files[k]})
                  raise SystemExit(f"authoritative byte identity differs at {coordinate}: {differing}")
          print("platform byte identity: true")
          print("head-to-merge byte identity: true")
          print(f"authoritative files: {len(baseline_files)}")
          PY
