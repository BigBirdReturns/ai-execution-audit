name: AXM HEAD JOIN v2 Chain Repair

on:
  push:
    branches:
      - work/axm-head-physical-long-haul-join-02
    paths:
      - ".join-v2-chain-repair/trigger"

permissions:
  contents: write

concurrency:
  group: axm-head-join-v2-chain-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-physical-long-haul-join-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply authenticated-chain repair
        shell: bash
        run: |
          set -euo pipefail
          python .join-v2-chain-repair/repair.py

      - name: Prove repaired source before transport
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          count="$(tr -d '\r\n' < .join-v2-chain-repair/focused-test-count)"
          stdout_log="$RUNNER_TEMP/join-v2-chain.stdout"
          stderr_log="$RUNNER_TEMP/join-v2-chain.stderr"
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v > "$stdout_log" 2> "$stderr_log"
          test ! -s "$stdout_log"
          cat "$stderr_log"
          grep -F "Ran $count tests" "$stderr_log"
          grep -E '^OK( \(skipped=[0-9]+\))?$' "$stderr_log"

      - name: Publish repaired product bytes and permanent workflow payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
            .join-v2-chain-repair/axm-head-physical-long-haul-join-01.yml.payload
          git diff --cached --check
          git diff --cached --quiet && { echo "repair produced no product change" >&2; exit 1; }
          git commit -m "Authenticate JOIN v2 private proof and campaign chain"
          git push origin "HEAD:refs/heads/work/axm-head-physical-long-haul-join-02"
