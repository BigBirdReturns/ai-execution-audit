name: TEMP fix PR75 junction coverage

on:
  push:
    branches:
      - fix/stc-mary-cartridge-post-merge-cleanup-01
    paths:
      - ".github/workflows/temp-fix-pr75-junction-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-pr75-junction-coverage
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/stc-mary-cartridge-post-merge-cleanup-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Use the native directory-link helper for root and ancestor witnesses
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/temp-fix-pr75-junction-coverage.py
          python .github/temp-fix-pr75-junction-coverage.py

      - name: Qualify repaired witness locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'Ran 25 tests' "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'OK' "$RUNNER_TEMP/cartridge-tests.txt"
          git diff --check

      - name: Commit the permanent witness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-fix-pr75-junction-coverage.yml
          rm .github/temp-fix-pr75-junction-coverage.py
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/temp-fix-pr73-windows-junction-witness.yml',
              'mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', '8b72a20fdab38c1a5dbc0c9e2d28adbd66076b40'],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'final cleanup denominator differs: expected={sorted(expected)} observed={sorted(actual)}'
              )
          PY
          git commit -m 'Exercise root and ancestor junction custody on Windows'
          git push origin HEAD:refs/heads/fix/stc-mary-cartridge-post-merge-cleanup-01
