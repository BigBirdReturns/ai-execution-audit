name: TEMP rescue2 STC MARY Flight 01 cartridge 02

on:
  push:
    branches:
      - work/stc-mary-flight-01-cartridge-02
    paths:
      - ".github/workflows/temp-rescue2-stc-mary-flight-01-cartridge-02.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-rescue2-stc-mary-flight-01-cartridge-02
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/stc-mary-flight-01-cartridge-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Execute exact repair program
        shell: bash
        run: |
          python -m py_compile .stc-mary-cartridge-repair/repair.py
          python .stc-mary-cartridge-repair/repair.py

      - name: Qualify repaired cartridge law
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python mating_surface/anchor_node/stc_mary_flight_01_cartridge.py validate-profile \
            mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "Ran 25 tests" "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F "OK" "$RUNNER_TEMP/cartridge-tests.txt"

          PROFILE="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json"
          TOOL="$GITHUB_WORKSPACE/mating_surface/anchor_node/stc_mary_flight_01_cartridge.py"
          BOOTSTRAP="$GITHUB_WORKSPACE/mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py"
          ONE="$RUNNER_TEMP/cartridge-one"
          TWO="$RUNNER_TEMP/cartridge-two"
          FOREIGN="$RUNNER_TEMP/foreign"
          VERDICT="$RUNNER_TEMP/verdict.json"

          python "$TOOL" build "$PROFILE" --out "$ONE"
          python "$TOOL" build "$PROFILE" --out "$TWO"
          mkdir -p "$FOREIGN"
          (
            cd "$FOREIGN"
            python "$BOOTSTRAP" "$ONE" --out "$VERDICT"
          )
          python - "$ONE" "$TWO" "$VERDICT" <<'PY'
          import json
          import sys
          from pathlib import Path

          one = Path(sys.argv[1])
          two = Path(sys.argv[2])
          verdict = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          members = (
              "MANIFEST.json",
              "CARTRIDGE/mission.json",
              "CARTRIDGE/work-unit.json",
              "PUBLIC/status.json",
              "RECOVERY/profile.json",
              "RECOVERY/source-binding.json",
              "RECOVERY/verify_cartridge.py",
          )
          for relative in members:
              if (one / relative).read_bytes() != (two / relative).read_bytes():
                  raise SystemExit(f"deterministic byte mismatch: {relative}")
          if verdict.get("status") != "PASS" or verdict.get("bootstrapAuthenticated") is not True:
              raise SystemExit("external bootstrap failed")
          profile = json.loads((one / "RECOVERY/profile.json").read_text(encoding="utf-8"))
          source = json.loads((one / "RECOVERY/source-binding.json").read_text(encoding="utf-8"))
          if "flightConductor" in profile.get("sourceCoordinates", {}):
              raise SystemExit("conductor leaked into profile")
          if "flightConductor" in source.get("sourceCoordinates", {}):
              raise SystemExit("conductor leaked into source binding")
          print(json.dumps(verdict, sort_keys=True))
          PY

      - name: Commit only the permanent cartridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf \
            .stc-mary-cartridge-repair \
            .github/workflows/temp-materialize-stc-mary-flight-01-cartridge-02.yml \
            .github/workflows/temp-rescue-stc-mary-flight-01-cartridge-02.yml \
            .github/workflows/temp-rescue2-stc-mary-flight-01-cartridge-02.yml
          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/stc-mary-flight-01-cartridge-01.yml",
              "mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge-profile-01.json",
              "mating_surface/anchor_node/stc-mary-flight-01-cartridge.ps1",
              "mating_surface/anchor_node/stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py",
              "mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py",
              "mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "dd486472a8c610a20ee062dd6746c86fe8ede4b4"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"branch product denominator differs: expected={sorted(expected)} observed={sorted(actual)}"
              )
          PY

          git commit -m "Separate STC Mission Cartridge law from conductor provenance"
          git push origin HEAD:refs/heads/work/stc-mary-flight-01-cartridge-02
