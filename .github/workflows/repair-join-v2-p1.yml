name: Repair JOIN v2 verifier custody P1s

on:
  push:
    branches:
      - review/axm-head-physical-long-haul-001-join-v2
    paths:
      - ".github/workflows/repair-join-v2-p1.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: review/axm-head-physical-long-haul-001-join-v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Close type-confusion and bootstrap-authentication findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import hashlib

          ROOT = Path.cwd()
          ANCHOR = ROOT / "mating_surface" / "anchor_node"
          VERIFIER = ANCHOR / "verify_axm_head_physical_long_haul_001_join_v2.py"
          BOOTSTRAP = ANCHOR / "verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py"
          TOOL = ANCHOR / "axm_head_physical_long_haul_001_join_v2.py"
          TESTS = ANCHOR / "conformance" / "test_axm_head_physical_long_haul_001_join_v2.py"
          CONTRACT = ANCHOR / "AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md"
          OLD_DIGEST = "986dc33080352d978992102b8bf2e3b2a1f795a956529983b90eee055cb758f7"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement target, found {count}")
              return text.replace(old, new, 1)

          verifier = VERIFIER.read_text(encoding="utf-8")
          verifier = replace_once(verifier, "import os\n", "", "remove verifier os import")
          verifier = replace_once(
              verifier,
              '''def canonical_json_bytes(value: Any) -> bytes:
              try:
                  text = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
              except (TypeError, ValueError) as exc:
                  fail("NON_CANONICAL_JSON", str(exc))
              return (text + "\\n").encode("utf-8")


              def sha256_bytes(data: bytes) -> str:
              ''',
              '''def canonical_json_bytes(value: Any) -> bytes:
              try:
                  text = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
              except (TypeError, ValueError) as exc:
                  fail("NON_CANONICAL_JSON", str(exc))
              return (text + "\\n").encode("utf-8")


              def type_strict_equal(actual: Any, expected: Any) -> bool:
                  return canonical_json_bytes(actual) == canonical_json_bytes(expected)


              def sha256_bytes(data: bytes) -> str:
              ''',
              "add type-strict equality",
          )
          verifier = replace_once(
              verifier,
              '''    expected_state = prepared_state(profile)
                  expected_decision = prepared_decision(profile, expected_state)
                  expected_public = public_status(profile, expected_decision)
                  if read_object(state_path) != expected_state:
                      fail("PREPARATION_STATE_MISMATCH", "prepared state is not reconstructed from the admitted profile")
                  if read_object(decision_path) != expected_decision:
                      fail("DECISION_MISMATCH", "decision is not reconstructed from the prepared state")
                  if read_object(public_path) != expected_public:
                      fail("PUBLIC_STATUS_MISMATCH", "public status is not reconstructed from the decision")
              ''',
              '''    expected_state = prepared_state(profile)
                  expected_decision = prepared_decision(profile, expected_state)
                  expected_public = public_status(profile, expected_decision)
                  actual_state = read_object(state_path)
                  actual_decision = read_object(decision_path)
                  actual_public = read_object(public_path)
                  if not type_strict_equal(actual_state, expected_state):
                      fail("PREPARATION_STATE_MISMATCH", "prepared state is not reconstructed from the admitted profile")
                  if not type_strict_equal(actual_decision, expected_decision):
                      fail("DECISION_MISMATCH", "decision is not reconstructed from the prepared state")
                  if not type_strict_equal(actual_public, expected_public):
                      fail("PUBLIC_STATUS_MISMATCH", "public status is not reconstructed from the decision")
              ''',
              "type-strict carrier members",
          )
          verifier = replace_once(
              verifier,
              '''    if manifest["sourceCoordinates"] != profile["sourceCoordinates"] or manifest["physicalFlightIssue"] != profile["physicalFlightIssue"]:
                      fail("MANIFEST_SOURCE_BINDING_INVALID", "manifest source or issue binding differs")
              ''',
              '''    if not type_strict_equal(manifest["sourceCoordinates"], profile["sourceCoordinates"]) or not type_strict_equal(
                      manifest["physicalFlightIssue"], profile["physicalFlightIssue"]
                  ):
                      fail("MANIFEST_SOURCE_BINDING_INVALID", "manifest source or issue binding differs")
              ''',
              "type-strict manifest source binding",
          )
          verifier = replace_once(
              verifier,
              '''    if manifest["fileCount"] != len(EXPECTED_RELATIVE_FILES):
                      fail("MANIFEST_FILE_COUNT_INVALID", "manifest fileCount differs")
              ''',
              '''    if type(manifest["fileCount"]) is not int or manifest["fileCount"] != len(EXPECTED_RELATIVE_FILES):
                      fail("MANIFEST_FILE_COUNT_INVALID", "manifest fileCount differs")
              ''',
              "type-strict file count",
          )
          verifier = replace_once(
              verifier,
              '''    if rows != expected_rows:
                      fail("MANIFEST_FILE_ROWS_INVALID", "manifest file rows differ from measured bytes")
              ''',
              '''    if not type_strict_equal(rows, expected_rows):
                      fail("MANIFEST_FILE_ROWS_INVALID", "manifest file rows differ from measured bytes")
              ''',
              "type-strict manifest rows",
          )
          verifier = replace_once(
              verifier,
              '''        if manifest[key] != expected:
                          fail("MANIFEST_NONCLAIM_INVALID", f"manifest {key} differs")
              ''',
              '''        if not type_strict_equal(manifest[key], expected):
                          fail("MANIFEST_NONCLAIM_INVALID", f"manifest {key} differs")
              ''',
              "type-strict manifest nonclaims",
          )
          verifier = replace_once(
              verifier,
              '''    authenticated = (
                      os.environ.get("AXM_HEAD_JOIN_V2_BOOTSTRAP_AUTHENTICATED") == "1"
                      and os.environ.get("AXM_HEAD_JOIN_V2_VERIFIER_SHA256") == verifier_digest
                  )
                  return {
              ''',
              '''    return {
              ''',
              "remove caller authentication channel",
          )
          verifier = replace_once(
              verifier,
              '        "bootstrapAuthenticated": authenticated,\n',
              '        "bootstrapAuthenticated": False,\n',
              "direct verifier remains unauthenticated",
          )
          VERIFIER.write_text(verifier, encoding="utf-8", newline="\n")
          new_digest = hashlib.sha256(VERIFIER.read_bytes()).hexdigest()
          if new_digest == OLD_DIGEST:
              raise SystemExit("verifier digest did not change")

          bootstrap_template = '''from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any

          EXPECTED_VERIFIER_SHA256 = "__VERIFIER_DIGEST__"
          VERDICT_SCHEMA = "axm-head/physical-long-haul-001-join-verdict@2"
          DIRECT_VERDICT_KEYS = {
              "schema",
              "status",
              "carrierId",
              "joinContractId",
              "stateId",
              "decisionId",
              "terminal",
              "fileCount",
              "profileCanonicalSha256",
              "standaloneVerifierSha256",
              "bootstrapAuthenticated",
              "physicalAuthorizationProduced",
              "physicalExecutionStarted",
              "missionVolumeMaterialized",
              "workersLaunched",
              "listenersCreated",
              "authority",
          }


          class BootstrapError(RuntimeError):
              def __init__(self, code: str, message: str):
                  super().__init__(message)
                  self.code = code


          def fail(code: str, message: str) -> None:
              raise BootstrapError(code, message)


          def canonical_json_bytes(value: Any) -> bytes:
              return (json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False) + "\\n").encode("utf-8")


          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def type_strict_equal(actual: Any, expected: Any) -> bool:
              return canonical_json_bytes(actual) == canonical_json_bytes(expected)


          def ensure_output_safe(carrier: Path, out: Path | None) -> None:
              if out is None:
                  return
              carrier_resolved = carrier.resolve()
              out_resolved = out.resolve(strict=False)
              if out_resolved == carrier_resolved or carrier_resolved in out_resolved.parents:
                  fail("OUTPUT_OVERLAPS_CARRIER", "verdict output may not be inside the measured carrier")
              if out.exists():
                  out_stat = out.stat()
                  for member in carrier.rglob("*"):
                      if member.is_file():
                          stat = member.stat()
                          if stat.st_dev == out_stat.st_dev and stat.st_ino == out_stat.st_ino:
                              fail("OUTPUT_ALIASES_CARRIER", "verdict output aliases a measured carrier file")


          def validate_direct_verdict(value: Any, verifier_digest: str) -> dict[str, Any]:
              if not isinstance(value, dict):
                  fail("DIRECT_VERDICT_INVALID", "direct verifier must emit one JSON object")
              if set(value) != DIRECT_VERDICT_KEYS:
                  fail("DIRECT_VERDICT_KEYS_INVALID", "direct verifier verdict denominator differs")
              for key, expected in (
                  ("schema", VERDICT_SCHEMA),
                  ("status", "PASS"),
                  ("terminal", "PREPARED_NOT_ARMED"),
                  ("standaloneVerifierSha256", verifier_digest),
                  ("bootstrapAuthenticated", False),
                  ("physicalAuthorizationProduced", False),
                  ("physicalExecutionStarted", False),
                  ("missionVolumeMaterialized", False),
                  ("workersLaunched", 0),
                  ("listenersCreated", 0),
                  ("authority", "none"),
              ):
                  if not type_strict_equal(value[key], expected):
                      fail("DIRECT_VERDICT_SEMANTICS_INVALID", f"direct verifier {key} differs")
              if type(value["fileCount"]) is not int or value["fileCount"] != 5:
                  fail("DIRECT_VERDICT_FILE_COUNT_INVALID", "direct verifier fileCount differs")
              for key in ("carrierId", "joinContractId", "stateId", "decisionId", "profileCanonicalSha256"):
                  if not isinstance(value[key], str) or not value[key]:
                      fail("DIRECT_VERDICT_IDENTITY_INVALID", f"direct verifier {key} is invalid")
              authenticated = dict(value)
              authenticated["bootstrapAuthenticated"] = True
              return authenticated


          def emit_refusal(code: str, message: str) -> int:
              value = {
                  "schema": VERDICT_SCHEMA,
                  "status": "REFUSED",
                  "code": code,
                  "message": message,
                  "bootstrapAuthenticated": False,
                  "physicalAuthorizationProduced": False,
                  "physicalExecutionStarted": False,
                  "workersLaunched": 0,
                  "listenersCreated": 0,
                  "authority": "none",
              }
              sys.stdout.buffer.write(canonical_json_bytes(value))
              return 2


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description="Authenticate and invoke the JOIN-v2 standalone verifier")
              parser.add_argument("carrier", type=Path)
              parser.add_argument("--out", type=Path)
              args = parser.parse_args(argv)
              try:
                  carrier = args.carrier
                  if not carrier.is_dir() or carrier.is_symlink():
                      fail("CARRIER_DIRECTORY_INVALID", "carrier must be a non-symlink directory")
                  verifier = carrier / "RECOVERY" / "verify_join.py"
                  if not verifier.is_file() or verifier.is_symlink():
                      fail("VERIFIER_MEMBER_INVALID", "embedded verifier is missing or symlinked")
                  digest = sha256_bytes(verifier.read_bytes())
                  if digest != EXPECTED_VERIFIER_SHA256:
                      fail("VERIFIER_SUBSTITUTION_REFUSED", "embedded verifier digest differs; untrusted bytes were not executed")
                  ensure_output_safe(carrier, args.out)
                  env = os.environ.copy()
                  env.pop("AXM_HEAD_JOIN_V2_BOOTSTRAP_AUTHENTICATED", None)
                  env.pop("AXM_HEAD_JOIN_V2_VERIFIER_SHA256", None)
                  result = subprocess.run(
                      [sys.executable, str(verifier), str(carrier)],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      env=env,
                      check=False,
                  )
                  if result.stderr:
                      sys.stderr.buffer.write(result.stderr)
                  if result.returncode != 0:
                      sys.stdout.buffer.write(result.stdout)
                      return result.returncode
                  try:
                      direct = json.loads(result.stdout.decode("utf-8"))
                  except (UnicodeError, json.JSONDecodeError) as exc:
                      fail("DIRECT_VERDICT_PARSE_FAILED", str(exc))
                  if result.stdout != canonical_json_bytes(direct):
                      fail("DIRECT_VERDICT_NONCANONICAL", "direct verifier verdict bytes are not canonical")
                  authenticated = validate_direct_verdict(direct, digest)
                  data = canonical_json_bytes(authenticated)
                  if args.out is not None:
                      args.out.parent.mkdir(parents=True, exist_ok=True)
                      args.out.write_bytes(data)
                  sys.stdout.buffer.write(data)
                  return 0
              except (BootstrapError, OSError, TypeError, ValueError) as exc:
                  code = exc.code if isinstance(exc, BootstrapError) else "BOOTSTRAP_IO_FAILED"
                  return emit_refusal(code, str(exc))


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          bootstrap = "\n".join(line[10:] if line.startswith("          ") else line for line in bootstrap_template.splitlines()) + "\n"
          bootstrap = bootstrap.replace("__VERIFIER_DIGEST__", new_digest)
          BOOTSTRAP.write_text(bootstrap, encoding="utf-8", newline="\n")

          tool = TOOL.read_text(encoding="utf-8")
          tool = replace_once(tool, OLD_DIGEST, new_digest, "update tool verifier digest")
          TOOL.write_text(tool, encoding="utf-8", newline="\n")

          tests = TESTS.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''    def mutate_json_and_resign(self, carrier: Path, relative: str, mutate) -> None:
                  path = carrier / Path(*relative.split("/"))
                  value = json.loads(path.read_text(encoding="utf-8"))
                  mutate(value)
                  path.write_bytes(TOOL.pretty_json_bytes(value))
                  self.resign_manifest_member(carrier, relative)

                  def test_01_profile_exact_coordinate_validates(self):
              ''',
              '''    def mutate_json_and_resign(self, carrier: Path, relative: str, mutate) -> None:
                  path = carrier / Path(*relative.split("/"))
                  value = json.loads(path.read_text(encoding="utf-8"))
                  mutate(value)
                  path.write_bytes(TOOL.pretty_json_bytes(value))
                  self.resign_manifest_member(carrier, relative)

                  def mutate_manifest_and_resign(self, carrier: Path, mutate) -> None:
                      manifest_path = carrier / "MANIFEST.json"
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                      mutate(manifest)
                      body = dict(manifest)
                      body.pop("carrierId")
                      manifest["carrierId"] = TOOL.content_id("axmheadjoincarrier2", body)
                      manifest_path.write_bytes(TOOL.pretty_json_bytes(manifest))

                  def test_01_profile_exact_coordinate_validates(self):
              ''',
              "add manifest resign helper",
          )
          tests = replace_once(
              tests,
              '''    def test_31_direct_verifier_passes_without_self_authentication(self):
                  carrier = self.build()
                  completed = subprocess.run([sys.executable, str(carrier / "RECOVERY/verify_join.py"), str(carrier)], stdout=subprocess.PIPE, check=False)
                  self.assertEqual(completed.returncode, 0)
                  verdict = json.loads(completed.stdout)
                  self.assertEqual(verdict["status"], "PASS")
                  self.assertFalse(verdict["bootstrapAuthenticated"])
              ''',
              '''    def test_31_direct_verifier_passes_without_self_authentication(self):
                  carrier = self.build()
                  env = os.environ.copy()
                  env["AXM_HEAD_JOIN_V2_BOOTSTRAP_AUTHENTICATED"] = "1"
                  env["AXM_HEAD_JOIN_V2_VERIFIER_SHA256"] = TOOL.STANDALONE_VERIFIER_SHA256
                  completed = subprocess.run(
                      [sys.executable, str(carrier / "RECOVERY/verify_join.py"), str(carrier)],
                      stdout=subprocess.PIPE,
                      env=env,
                      check=False,
                  )
                  self.assertEqual(completed.returncode, 0)
                  verdict = json.loads(completed.stdout)
                  self.assertEqual(verdict["status"], "PASS")
                  self.assertFalse(verdict["bootstrapAuthenticated"])
              ''',
              "hostile direct authentication witness",
          )
          tests = replace_once(
              tests,
              '''    def test_32_bootstrap_authenticates_exact_verifier(self):
                  carrier = self.build()
                  completed = subprocess.run([sys.executable, str(BOOTSTRAP_PATH), str(carrier)], stdout=subprocess.PIPE, check=False)
                  self.assertEqual(completed.returncode, 0)
                  verdict = json.loads(completed.stdout)
                  self.assertTrue(verdict["bootstrapAuthenticated"])
                  self.assertEqual(verdict["standaloneVerifierSha256"], BOOTSTRAP.EXPECTED_VERIFIER_SHA256)
              ''',
              '''    def test_32_bootstrap_authenticates_exact_verifier(self):
                  carrier = self.build()
                  out = self.root / "authenticated-verdict.json"
                  completed = subprocess.run(
                      [sys.executable, str(BOOTSTRAP_PATH), str(carrier), "--out", str(out)],
                      stdout=subprocess.PIPE,
                      check=False,
                  )
                  self.assertEqual(completed.returncode, 0)
                  self.assertEqual(completed.stdout, out.read_bytes())
                  verdict = json.loads(completed.stdout)
                  self.assertTrue(verdict["bootstrapAuthenticated"])
                  self.assertEqual(verdict["standaloneVerifierSha256"], BOOTSTRAP.EXPECTED_VERIFIER_SHA256)
              ''',
              "bootstrap constructs authenticated receipt",
          )
          tests = replace_once(
              tests,
              '''    def test_35_resigned_public_claim_promotion_refuses(self):
                  carrier = self.build()
                  self.mutate_json_and_resign(carrier, "PUBLIC/status.json", lambda value: value.__setitem__("physicalExecutionStarted", True))
                  with self.assertRaisesRegex(VERIFIER.VerificationError, "public status is not reconstructed"):
                      VERIFIER.verify(carrier)
              ''',
              '''    def test_35_resigned_public_claim_promotion_refuses(self):
                  cases = (
                      ("PUBLIC/status.json", "physicalExecutionStarted", 0, "public status is not reconstructed"),
                      ("JOIN/decision.json", "physicalAuthorizationProduced", 0, "decision is not reconstructed"),
                  )
                  for index, (relative, key, replacement, message) in enumerate(cases):
                      with self.subTest(relative=relative, key=key, replacement=replacement):
                          carrier = self.build(f"type-confusion-public-{index}")
                          self.mutate_json_and_resign(carrier, relative, lambda value, k=key, r=replacement: value.__setitem__(k, r))
                          with self.assertRaisesRegex(VERIFIER.VerificationError, message):
                              VERIFIER.verify(carrier)
              ''',
              "type confusion in public and decision",
          )
          tests = replace_once(
              tests,
              '''    def test_36_resigned_preparation_activity_refuses(self):
                  carrier = self.build()
                  self.mutate_json_and_resign(carrier, "JOIN/preparation-state.json", lambda value: value.__setitem__("workersLaunched", 1))
                  with self.assertRaisesRegex(VERIFIER.VerificationError, "prepared state is not reconstructed"):
                      VERIFIER.verify(carrier)
              ''',
              '''    def test_36_resigned_preparation_activity_refuses(self):
                  carrier = self.build("type-confusion-state")
                  self.mutate_json_and_resign(
                      carrier,
                      "JOIN/preparation-state.json",
                      lambda value: value.__setitem__("workersLaunched", False),
                  )
                  with self.assertRaisesRegex(VERIFIER.VerificationError, "prepared state is not reconstructed"):
                      VERIFIER.verify(carrier)

                  manifest_cases = (
                      ("physicalExecutionStarted", 0, "manifest physicalExecutionStarted differs"),
                      ("bootstrapRequired", 1, "bootstrapRequired must remain true"),
                  )
                  for index, (key, replacement, message) in enumerate(manifest_cases):
                      with self.subTest(key=key, replacement=replacement):
                          carrier = self.build(f"type-confusion-manifest-{index}")
                          self.mutate_manifest_and_resign(
                              carrier,
                              lambda value, k=key, r=replacement: value.__setitem__(k, r),
                          )
                          with self.assertRaisesRegex(VERIFIER.VerificationError, message):
                              VERIFIER.verify(carrier)
              ''',
              "type confusion in state and manifest",
          )
          TESTS.write_text(tests, encoding="utf-8", newline="\n")

          contract = CONTRACT.read_text(encoding="utf-8")
          contract = replace_once(contract, OLD_DIGEST, new_digest, "update contract verifier digest")
          contract = replace_once(
              contract,
              '''The external bootstrap hashes the embedded verifier before execution. The admitted verifier digest is:
              ''',
              '''The external bootstrap hashes the embedded verifier before execution, invokes it without an authentication channel or output path, requires one canonical direct `PASS` receipt with `bootstrapAuthenticated: false`, validates every physical and authority non-claim, and then constructs the authenticated receipt itself. The admitted verifier digest is:
              ''',
              "document bootstrap custody",
          )
          contract = replace_once(
              contract,
              '''Hostile witnesses refuse source drift, dirty or moving checkouts, missing headers, symlink roots, duplicate labels, invalid content references, physical execution, worker or listener activity, authority promotion, forged cards, unmanifested files, missing files, re-signed public claim promotion, re-signed preparation activity, rewritten profile provenance, malicious verifier substitution, verdict output overlap, hard-link aliasing, and symlink members.
              ''',
              '''Hostile witnesses refuse source drift, dirty or moving checkouts, missing headers, symlink roots, duplicate labels, invalid content references, physical execution, worker or listener activity, authority promotion, forged cards, unmanifested files, missing files, re-signed public claim promotion, re-signed preparation activity, Boolean/integer JSON type confusion after complete re-signing, forged bootstrap environment variables, rewritten profile provenance, malicious verifier substitution, verdict output overlap, hard-link aliasing, and symlink members.
              ''',
              "document hostile witnesses",
          )
          CONTRACT.write_text(contract, encoding="utf-8", newline="\n")

          print(new_digest)
          PY

          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_001_join_v2.py' \
            -v 2>&1 | tee /tmp/join-v2-repair-tests.txt
          grep -F "Ran 42 tests" /tmp/join-v2-repair-tests.txt
          grep -Fx "OK" /tmp/join-v2-repair-tests.txt
          git diff --check

      - name: Commit repaired product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add \
            mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-001-JOIN-v2.md \
            mating_surface/anchor_node/axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_001_join_v2_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_001_join_v2.py
          git commit -m "Close JOIN v2 verifier custody findings"
          git push origin HEAD:review/axm-head-physical-long-haul-001-join-v2
