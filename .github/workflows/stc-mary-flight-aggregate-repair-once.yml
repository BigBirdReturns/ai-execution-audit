name: One-use STC MARY aggregate flight repair

on:
  push:
    branches:
      - fix/stc-mary-flight-aggregate-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stc-mary-flight-aggregate-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/stc-mary-flight-aggregate-01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Repair only the observed aggregate boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mating_surface/anchor_node/stc_mary_physical_flight.mjs')
          text = path.read_text(encoding='utf-8')

          declaration = 'function validateObservation(stage, observation) {'
          replacement = 'export function validatePhysicalFlightObservation(stage, observation) {'
          if text.count(declaration) != 1:
              raise SystemExit(f'observation-validator declaration count differs: {text.count(declaration)}')
          text = text.replace(declaration, replacement, 1)

          remaining = text.count('validateObservation(')
          if remaining < 2:
              raise SystemExit(f'observation-validator call count too small: {remaining}')
          text = text.replace('validateObservation(', 'validatePhysicalFlightObservation(')
          if 'validateObservation(' in text:
              raise SystemExit('old observation-validator name remains')

          recursive_line = '  validatePublicPhysicalFlightDisposition(disposition, run);\n'
          if text.count(recursive_line) != 1:
              raise SystemExit(f'recursive builder-validation call count differs: {text.count(recursive_line)}')
          text = text.replace(recursive_line, '', 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run exact focused qualification
        run: |
          node --check mating_surface/anchor_node/stc_mary_physical_flight.mjs
          node --check mating_surface/anchor_node/stc_mary_private_flight_packet.mjs
          node --test \
            mating_surface/anchor_node/conformance/stc_mary_physical_flight.test.mjs \
            mating_surface/anchor_node/conformance/stc_mary_private_flight_packet.test.mjs \
            mating_surface/anchor_node/conformance/stc_mary_private_material_regression.test.mjs \
            mating_surface/anchor_node/conformance/stc_mary_physical_flight_aggregate_regression.test.mjs

      - name: Remove the one-use carrier and publish only the repair
        run: |
          rm .github/workflows/stc-mary-flight-aggregate-repair-once.yml
          git diff --check
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add \
            mating_surface/anchor_node/stc_mary_physical_flight.mjs \
            mating_surface/anchor_node/conformance/stc_mary_physical_flight_aggregate_regression.test.mjs \
            .github/workflows/stc-mary-flight-aggregate-repair-once.yml
          git commit -m "Repair STC MARY aggregate flight replay"
          git push origin HEAD:fix/stc-mary-flight-aggregate-01
