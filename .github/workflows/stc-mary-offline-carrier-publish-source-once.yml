name: One-use STC MARY offline carrier non-workflow source publication

on:
  push:
    branches:
      - feature/stc-mary-offline-carrier-01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stc-mary-offline-carrier-non-workflow-source-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: feature/stc-mary-offline-carrier-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recover five intact non-workflow members and bind a closed reconstruction seam
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import json
          import struct
          import zlib

          payload_root = Path('.offline-carrier-payload')
          part_paths = [payload_root / f'part{index:02d}.b64' for index in range(1, 8)]
          if not all(path.is_file() for path in part_paths):
              raise SystemExit('payload denominator differs')
          bodies = [base64.b64decode(path.read_text(encoding='utf-8').strip(), validate=True) for path in part_paths]
          data = b''.join(bodies[:5]) + bodies[6]

          names = [
              '.github/workflows/stc-mary-offline-carrier-01.yml',
              'mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py',
              'mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json',
              'mating_surface/anchor_node/stc-mary-offline-carrier.ps1',
              'mating_surface/anchor_node/stc_mary_local/cli.py',
              'mating_surface/anchor_node/stc_mary_local/plan.py',
              'mating_surface/anchor_node/stc_mary_offline_carrier.py',
          ]
          positions = []
          cursor = 0
          while True:
              at = data.find(b'PK\x03\x04', cursor)
              if at < 0:
                  break
              positions.append(at)
              cursor = at + 4
          if positions != [0, 2446, 5112, 9310, 10006, 10990, 12258, 16594]:
              raise SystemExit(f'local-record coordinates differ: {positions}')

          recover_indexes = {1, 3, 4, 5, 6}
          recovered = []
          for index in sorted(recover_indexes):
              at = positions[index]
              values = struct.unpack_from('<IHHHHHIIIHH', data, at)
              (_, needed, flags, method, mtime, mdate, crc, compressed_size,
               uncompressed_size, name_length, extra_length) = values
              name_start = at + 30
              name = data[name_start:name_start + name_length].decode('utf-8')
              if name != names[index] or flags != 0 or method != 8 or extra_length != 0:
                  raise SystemExit(f'member contract differs: {name}')
              payload_start = name_start + name_length
              source = zlib.decompress(data[payload_start:payload_start + compressed_size], -15)
              if len(source) != uncompressed_size or (binascii.crc32(source) & 0xffffffff) != crc:
                  raise SystemExit(f'member verification failed: {name}')
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source)
              recovered.append(name)

          module = '''from __future__ import annotations

import argparse
import json
from typing import Any, Sequence

RECOVERY_REQUIRED = True
ATTESTATION_MODES = {"synthetic_simulation", "private_local_attested"}


class OfflineCarrierRecoveryHold(RuntimeError):
    pass


def validate_two_cell_verification(value: Any) -> Any:
    raise OfflineCarrierRecoveryHold("offline carrier implementation remains reconstruction-required")


def validate_successor_verification(value: Any) -> Any:
    raise OfflineCarrierRecoveryHold("offline carrier implementation remains reconstruction-required")


def build_parser() -> argparse.ArgumentParser:
    parser = argparse.ArgumentParser(description="STC MARY offline carrier reconstruction coordinate")
    parser.add_argument("command", nargs="?", default="status")
    return parser


def main(argv: Sequence[str] | None = None) -> int:
    args = build_parser().parse_args(argv)
    print(json.dumps({"status": "HOLD", "command": args.command, "recoveryRequired": True, "authority": "none"}, indent=2))
    return 2


if __name__ == "__main__":
    raise SystemExit(main())
'''
          module_path = Path(names[7])
          module_path.write_text(module, encoding='utf-8', newline='\n')

          witness = '''from __future__ import annotations

import sys
import unittest
from pathlib import Path

ANCHOR = Path(__file__).resolve().parent.parent
if str(ANCHOR) not in sys.path:
    sys.path.insert(0, str(ANCHOR))

import stc_mary_offline_carrier as carrier


class RecoveryHoldWitness(unittest.TestCase):
    def test_reconstruction_is_explicit_and_non_authoritative(self):
        self.assertTrue(carrier.RECOVERY_REQUIRED)
        self.assertEqual(carrier.ATTESTATION_MODES, {"synthetic_simulation", "private_local_attested"})
        with self.assertRaises(carrier.OfflineCarrierRecoveryHold):
            carrier.validate_two_cell_verification({})
        with self.assertRaises(carrier.OfflineCarrierRecoveryHold):
            carrier.validate_successor_verification({})


if __name__ == "__main__":
    unittest.main()
'''
          witness_path = Path(names[2])
          witness_path.parent.mkdir(parents=True, exist_ok=True)
          witness_path.write_text(witness, encoding='utf-8', newline='\n')

          print(json.dumps({
              'status': 'SOURCE_RECOVERED_FOR_RECONSTRUCTION',
              'recovered': recovered,
              'reconstructionRequired': [names[2], names[7]],
              'authority': 'none',
          }, indent=2))
          PY

      - name: Validate syntax and the closed recovery witness
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py
          python -m json.tool mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json > /dev/null
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_offline_carrier.py' \
            -v

      - name: Publish non-workflow source only
        run: |
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add \
            mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json \
            mating_surface/anchor_node/stc-mary-offline-carrier.ps1 \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_offline_carrier.py
          if git diff --cached --quiet; then
            echo 'Non-workflow source already published.'
            exit 0
          fi
          git diff --cached --check
          git commit -m "Recover the STC MARY offline carrier source boundary"
          git push origin HEAD:feature/stc-mary-offline-carrier-01
