name: TEMP PR109 Console Successor Finalizer 02

on:
  push:
    branches:
      - ops/pr109-console-successor-finalizer-01
    paths:
      - ".github/workflows/temp-pr109-console-successor-finalizer-02.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temp-pr109-console-successor-finalizer-02
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_CARRIER_BYTES: "34129"
  EXPECTED_CARRIER_SHA256: d745848b817cc69f9c46b89812bdeb572a464401c044568f56769d020456955b

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/pr109-console-successor-finalizer-01
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconstruct and verify the exact carrier
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-00'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-01'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-02a'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-02b'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-03'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04a'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b0'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b1'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b2'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-04b3'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a0'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a1'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a2'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a3'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a4'
            '.agent-carriers/AXM-PR109-Console-Successor-Finalizer-01.zip.b64.part-05a5'
          )
          blobs=(
            e05bd48efc78a57d68111c460639910b8ad3b3c9
            1317d4e308d414438a43d0a537735e802ae91700
            3d9fd85d4b788b85df1c9e01c854788917864668
            6c3374b369a17b13a2737d184d76314ccbbae45c
            af6c74fee3ebe522f00a3962d83e82a63187b40f
            42fe13f58384f691225a6b4092750936b6e2f6d0
            bcadc650b67c12bb9454eae0a90a6239e13e4b8b
            edbdb3f33409b550cbfa4bb1c0d40a1d822056f5
            727f3882a826cf4f80be21c9cef2637dd086c7a1
            ff54bf845d62e2c04a46686fc505865bb7be12f1
            126ffd9bb848ea27b810f8eaa654440f93b76a79
            1030e67eaf15100b14b2b426db86910421b7a556
            23c05a6bf65331ac3d1480904fe354f159388549
            4899980fba007c35f4ccd4b2cc056189dfb071b6
            f3f759a125ba94d8a44949b7d25ff37a469b9833
            23345834801bfdd37563eb9950b302f21a5cc59e
          )
          sizes=(8000 8000 4000 4000 8000 4000 1000 1000 1000 1000 1000 1000 1000 1000 1000 508)
          for index in "${!parts[@]}"; do
            part="${parts[$index]}"
            [[ -f "$part" ]]
            [[ "$(wc -c < "$part")" -eq "${sizes[$index]}" ]]
            [[ "$(git hash-object "$part")" == "${blobs[$index]}" ]]
          done
          cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/finalizer.zip"
          [[ "$(wc -c < "$RUNNER_TEMP/finalizer.zip")" -eq "$EXPECTED_CARRIER_BYTES" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/finalizer.zip" | awk '{print $1}')" == "$EXPECTED_CARRIER_SHA256" ]]
          mkdir -p "$RUNNER_TEMP/finalizer"
          unzip -q "$RUNNER_TEMP/finalizer.zip" -d "$RUNNER_TEMP/finalizer"
          ROOT="$RUNNER_TEMP/finalizer/AXM-PR109-Console-Successor-Finalizer-01"
          python "$ROOT/verify_carrier.py" "$ROOT"

      - name: Repair the complete workflow replacement denominator
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/finalizer/AXM-PR109-Console-Successor-Finalizer-01"
          python - "$ROOT/finalize_pr109_console_successor.py" "$RUNNER_TEMP/recipe-repair.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          receipt = pathlib.Path(sys.argv[2])
          data = path.read_text(encoding="utf-8")
          old = "replace_exact(workflow_path, 'WITNESS_DENOMINATOR: \"81\"', 'WITNESS_DENOMINATOR: \"83\"')"
          new = "replace_exact(workflow_path, 'WITNESS_DENOMINATOR: \"81\"', 'WITNESS_DENOMINATOR: \"83\"', count=2)"
          if data.count(old) != 1 or data.count(new) != 0:
              raise SystemExit("successor recipe repair denominator differs")
          before = hashlib.sha256(data.encode("utf-8")).hexdigest()
          data = data.replace(old, new, 1)
          path.write_text(data, encoding="utf-8", newline="\n")
          after = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt.write_text(json.dumps({
              "schema": "axm-private/pr109-console-successor-recipe-repair@1",
              "status": "PASS",
              "reason": "the admitted console workflow contains two exact witness-denominator bindings",
              "oldReplacementCount": 1,
              "requiredWorkflowOccurrenceCount": 2,
              "beforeSha256": "sha256:" + before,
              "afterSha256": "sha256:" + after,
              "physicalExecutionObserved": False,
              "browserLaunched": False,
              "supplierEndpointContacted": False,
              "modelDownloaded": False,
              "peerConnectionFormed": False,
              "inferenceExecuted": False,
              "routeTerminalProduced": False,
              "actualSupplierQualified": False,
              "physicalEstateQualified": False,
              "missionAuthority": "none",
              "commandAuthority": "none",
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          python -m py_compile "$ROOT/finalize_pr109_console_successor.py"

      - name: Execute through the console pull-request boundary
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          ROOT="$RUNNER_TEMP/finalizer/AXM-PR109-Console-Successor-Finalizer-01"
          python "$ROOT/finalize_pr109_console_successor.py" \
            --work-root "$RUNNER_TEMP/finalizer-work" \
            --receipt-root "$RUNNER_TEMP/finalizer-receipts" \
            --stop-after-console-pr \
            | tee "$RUNNER_TEMP/finalizer-terminal.json"

      - name: Upload body-free finalizer receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr109-console-successor-finalizer-02-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recipe-repair.json
            ${{ runner.temp }}/finalizer-receipts
            ${{ runner.temp }}/finalizer-terminal.json
          if-no-files-found: warn
          retention-days: 14
