name: TEMP Finalize Browser Audition Operation Plan 01

on:
  push:
    branches:
      - work/axm-head-browser-audition-operation-plan-01
    paths:
      - ".github/workflows/temp-finalize-axm-browser-audition-operation-plan-01.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: temp-finalize-browser-audition-operation-plan-01
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  BASE_COMMIT: ce93cf8856b7fcc9b172b9251b9665df50fdeda4
  BASE_TREE: 664784d10309665eb3b993ce8f6df4eb5b10baf7
  OLD_PRODUCT_HEAD: 878bab5c81de51dcdb55b6da7578be21d21c533c
  PRODUCT_BRANCH: work/axm-head-browser-audition-operation-plan-product-01
  PR_NUMBER: "107"
  ISSUE_NUMBER: "105"
  REFRESH_SHA256: 9b762c9b8ea5e500089b6872804b7ed01e6514b73c7c14ad60d5c3a0ec8c9ff6
  SOURCE_BINDING: axmoperationplansource_d281a42ef1f3ba0b620e0421c18966b9c06b167f3450d973e1fd33273b05b107
  EXTENSION_ID: axmoperationplanextension_e36fe4a52fee3096311dd3f985cb6b0badc25062c9a8b460bf610d82e3c39b8d

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/axm-head-browser-audition-operation-plan-01
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Reconstruct exact refresh and orient product branch
        id: orient
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_COMMIT" ]] || { echo "main moved" >&2; exit 2; }
          [[ "$(git rev-parse 'origin/main^{tree}')" == "$BASE_TREE" ]] || { echo "main tree differs" >&2; exit 2; }

          pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)"
          if [[ "$pr_merged" == "true" ]]; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$pr_state" == "open" ]] || { echo "PR is neither open nor merged" >&2; exit 2; }

          product_head="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          echo "predecessor=$product_head" >> "$GITHUB_OUTPUT"

          parts=(
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-00'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-01'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-02'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-03'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-04'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a0'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a1'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a2'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a30'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a31'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a32'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05a33'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-05b'
            '.agent-carriers/axm-head-browser-audition-operation-plan-68-refresh.zip.b64.part-06'
          )
          sizes=(8000 8000 8000 8000 8000 1000 1000 1000 250 250 250 250 4000 7940)
          blobs=(
            256e2d739edf0eb1ab2971dfd305f33dc5f3990f
            e2ff71c2ae2a5c2ced0b0aa82d3eea76857277e8
            ffa2913202faba194b2476064148b03bd4799d4f
            86dcf37956724869efe81079d4e4c7340af32561
            4f2e8ef9d373543fcb6cf3a5075ec7f7ed862b42
            40fc12bb3d1ed117f116aac79a2ced240eed0028
            72da4d03dfe98487860a72ad44202526a7928a4e
            3b39cd6da09356d8874041a342b9d2203f24c1ae
            9237578148744d13876adebb21eff3d469927df8
            4a18cc8bb7a65aa8dd8d73feef62d5790711ab98
            dde25ca390444009549042953020110f806e606a
            d333827b921bf3df904ec2fca99738778f1e9695
            7066ed840c6dce22be44da165d9800f98059f994
            b491e3644fee338bf16c016deb6f521d3567789d
          )
          for index in "${!parts[@]}"; do
            part="${parts[$index]}"
            [[ -f "$part" ]] || { echo "carrier segment missing: $part" >&2; exit 2; }
            [[ "$(wc -c < "$part")" -eq "${sizes[$index]}" ]] || { echo "carrier segment size differs: $part" >&2; exit 2; }
            [[ "$(git hash-object "$part")" == "${blobs[$index]}" ]] || { echo "carrier segment blob differs: $part" >&2; exit 2; }
          done
          cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/refresh.zip"
          [[ "$(sha256sum "$RUNNER_TEMP/refresh.zip" | awk '{print $1}')" == "$REFRESH_SHA256" ]] || { echo "refresh digest differs" >&2; exit 2; }

          python - "$RUNNER_TEMP/refresh.zip" <<'PY'
          import stat, sys, zipfile
          from pathlib import PurePosixPath
          expected = {
              "mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md",
              "mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py",
              "mating_surface/anchor_node/browser_audition_operation_plan_contract.js",
              "mating_surface/anchor_node/browser_audition_operation_plan_panel.js",
              "mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py",
              "mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json",
              "mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              rows = archive.infolist(); names = [row.filename for row in rows]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f"refresh denominator differs: missing={sorted(expected-set(names))} extra={sorted(set(names)-expected)}")
              for row in rows:
                  path = PurePosixPath(row.filename)
                  if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
                      raise SystemExit(f"unsafe refresh member: {row.filename}")
                  if row.is_dir() or stat.S_ISLNK(row.external_attr >> 16):
                      raise SystemExit(f"non-regular refresh member: {row.filename}")
                  data = archive.read(row)
                  if not data or b"\r" in data or any(value < 32 and value not in (9, 10) for value in data):
                      raise SystemExit(f"refresh hygiene failure: {row.filename}")
                  data.decode("utf-8")
          PY

          git checkout --detach "$product_head"
          declare -A strengthened=(
            ['mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md']='1cdd2111241f9b6081c5d6bcce9d6988332a01e1'
            ['mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py']='82b8f56834fc51c67b2d5ba1580802ce15ae8411'
            ['mating_surface/anchor_node/browser_audition_operation_plan_contract.js']='f8e707b96fccca0684753e7cd295c069d44c1de5'
            ['mating_surface/anchor_node/browser_audition_operation_plan_panel.js']='24e94dd9a3da9208209f88efc9d9768ffe68adc9'
            ['mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py']='41baf610a37da0cfd6b781c5a5bd73f290c70e30'
            ['mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json']='f5e03c485b20941e6fed23207736fc0415aba54f'
            ['mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py']='de684b129521268696337508b48adf4280de8bf6'
          )
          exact=true
          for path in "${!strengthened[@]}"; do
            observed="$(git rev-parse "$product_head:$path")"
            [[ "$observed" == "${strengthened[$path]}" ]] || exact=false
          done
          if [[ "$exact" == "false" ]]; then
            [[ "$product_head" == "$OLD_PRODUCT_HEAD" ]] || { echo "unknown product predecessor" >&2; exit 2; }
            python - "$RUNNER_TEMP/refresh.zip" <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for row in archive.infolist():
                  target = Path(*PurePosixPath(row.filename).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(row))
          PY
            echo "refresh_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh_required=false" >> "$GITHUB_OUTPUT"
          fi
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

      - name: Qualify strengthened source and publish if required
        if: steps.orient.outputs.already_merged == 'false'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          ROOT=mating_surface/anchor_node
          PROFILE="$ROOT/axm-head-browser-audition-operation-plan-profile-01.json"
          FIXTURES="$ROOT/fixtures/axm-head-browser-audition-operation-plan-cases-01.json"
          TOOL="$ROOT/axm_head_browser_audition_operation_plan_01.py"
          VERIFY="$ROOT/verify_axm_head_browser_audition_operation_plan_01.py"
          BOOT="$ROOT/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py"
          TESTS="$ROOT/conformance/test_axm_head_browser_audition_operation_plan_01.py"
          RECEIPTS="$RUNNER_TEMP/receipts"
          OUTPUT="$RUNNER_TEMP/extension"
          mkdir -p "$RECEIPTS"
          python -m py_compile "$TOOL" "$VERIFY" "$BOOT" "$TESTS"
          node --check "$ROOT/browser_audition_operation_plan_contract.js"
          node --check "$ROOT/browser_audition_operation_plan_panel.js"
          python "$TOOL" validate-profile "$PROFILE" > "$RECEIPTS/profile.json"
          python "$TOOL" validate-fixtures "$PROFILE" "$FIXTURES" > "$RECEIPTS/fixtures.json"
          python "$TOOL" campaign "$PROFILE" "$GITHUB_WORKSPACE" "$FIXTURES" > "$RECEIPTS/campaign.json"
          python "$TOOL" source-set "$PROFILE" "$GITHUB_WORKSPACE" > "$RECEIPTS/source-set.json"
          python -m unittest discover -s "$ROOT/conformance" -p 'test_axm_head_browser_audition_operation_plan_01.py' -v 2>&1 | tee "$RECEIPTS/tests.txt"
          grep -F 'Ran 68 tests' "$RECEIPTS/tests.txt"
          grep -Fx 'OK' "$RECEIPTS/tests.txt"
          python "$TOOL" build-extension "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RECEIPTS/build.json"
          cmp "$RECEIPTS/build.json" "$OUTPUT/build-manifest.json"
          python "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RECEIPTS/direct.json"
          python "$BOOT" "$VERIFY" "$PROFILE" "$GITHUB_WORKSPACE" "$OUTPUT" > "$RECEIPTS/bootstrap.json"
          python - "$RECEIPTS" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          campaign = json.loads((root / "campaign.json").read_text())
          source = json.loads((root / "source-set.json").read_text())
          build = json.loads((root / "build.json").read_text())
          direct = json.loads((root / "direct.json").read_text())
          bootstrap = json.loads((root / "bootstrap.json").read_text())
          if campaign.get("status") != "PASS" or campaign.get("caseCount") != 24 or campaign.get("outcomeCounts") != {"PASS": 3, "REFUSED": 21}: raise SystemExit(campaign)
          if source.get("sourceMemberCount") != 13 or source.get("sourceBindingId") != os.environ["SOURCE_BINDING"]: raise SystemExit(source)
          if build.get("extensionId") != os.environ["EXTENSION_ID"]: raise SystemExit(build)
          if direct.get("status") != "PASS" or direct.get("operationPlanExecuted") is not False or direct.get("actualSupplierQualified") is not False or direct.get("physicalEstateQualified") is not False: raise SystemExit(direct)
          if bootstrap.get("status") != "PASS" or bootstrap.get("bootstrapAuthenticated") is not True or bootstrap.get("operationPlanExecuted") is not False: raise SystemExit(bootstrap)
          PY
          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          if [[ "${{ steps.orient.outputs.refresh_required }}" == "true" ]]; then
            expected=(
              'mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md'
              'mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py'
              'mating_surface/anchor_node/browser_audition_operation_plan_contract.js'
              'mating_surface/anchor_node/browser_audition_operation_plan_panel.js'
              'mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py'
              'mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json'
              'mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py'
            )
            mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
            mapfile -t observed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//' | LC_ALL=C sort)
            [[ "${observed[*]}" == "${wanted[*]}" ]] || { echo "refresh denominator differs" >&2; exit 2; }
            git add -- "${expected[@]}"
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Strengthen the browser audition operation plan'
            predecessor="${{ steps.orient.outputs.predecessor }}"
            git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$predecessor" origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          fi
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Verify exact PR denominator and update body
        if: steps.orient.outputs.already_merged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="${{ steps.publish.outputs.head }}"
          tree="${{ steps.publish.outputs.tree }}"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          [[ "$(git rev-parse "origin/$PRODUCT_BRANCH")" == "$head" ]] || { echo "product branch differs" >&2; exit 2; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" == "$head" ]] || { echo "PR head differs" >&2; exit 2; }
          expected=(
            '.github/workflows/axm-head-browser-audition-operation-plan-01.yml'
            'mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md'
            'mating_surface/anchor_node/axm-head-browser-audition-operation-plan-profile-01.json'
            'mating_surface/anchor_node/axm-head-browser-audition-operation-plan-01.ps1'
            'mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py'
            'mating_surface/anchor_node/browser_audition_operation_plan_contract.js'
            'mating_surface/anchor_node/browser_audition_operation_plan_panel.html'
            'mating_surface/anchor_node/browser_audition_operation_plan_panel.js'
            'mating_surface/anchor_node/browser_audition_operation_plan_panel.css'
            'mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py'
            'mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01_bootstrap.py'
            'mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py'
            'mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t observed < <(git diff --name-only "$BASE_COMMIT" "$head" | LC_ALL=C sort)
          [[ "${observed[*]}" == "${wanted[*]}" ]] || { echo "PR denominator differs" >&2; exit 2; }
          additions="$(git diff --numstat "$BASE_COMMIT" "$head" | awk '{a+=$1; d+=$2} END {print a+0}')"
          deletions="$(git diff --numstat "$BASE_COMMIT" "$head" | awk '{a+=$1; d+=$2} END {print d+0}')"
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Advances #105

          This pull request adds the supplier-neutral browser-audition operation-plan compiler and local human-gated panel above the admitted operator console. It converts one validated private denominator into the exact 28-step console sequence while preserving the packet, named-human, public-projection, supplier-neutrality, and no-authority boundaries.

          \`\`\`text
          base commit: $BASE_COMMIT
          base tree: $BASE_TREE
          candidate head: $head
          candidate tree: $tree
          changed paths: 13
          additions: $additions
          deletions: $deletions

          hostile witnesses: 68 / 68 PASS
          binding cases: 24 / 24 PASS
          binding outcomes: 3 PASS, 21 REFUSED
          source binding: $SOURCE_BINDING
          extension identity: $EXTENSION_ID
          \`\`\`

          The exact candidate remains purely additive and contains no carrier, temporary workflow, private bindings body, raw capture, endpoint identity, host identity, prompt, completion, token text, model body, confirmation body, physical receipt, or supplier-specific adapter. Continuous integration launches no browser, contacts no endpoint, downloads no model, forms no peer connection, performs no inference, produces no route terminal, qualifies no supplier or physical Estate, and grants no authority.

          The admission control question is whether one validated private denominator can drive the exact admitted console sequence on each physical seat while leaving the compiler, local panel, supplier identity, operator declarations, and generated plan incapable of proving physical uniqueness, producing a route terminal, admitting a supplier, or widening authority.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/pr-body.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Wait for permanent gates on the exact head
        if: steps.orient.outputs.already_merged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="${{ steps.publish.outputs.head }}"
          for attempt in $(seq 1 150); do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$PRODUCT_BRANCH" -f event='pull_request' -F per_page=100 > "$RUNNER_TEMP/runs.json"
            python - "$RUNNER_TEMP/runs.json" "$head" > "$RUNNER_TEMP/gate.json" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          head = sys.argv[2]
          required = {"AXM HEAD Browser Audition Operation Plan 01", "Standards-first mating surface qualification", "Spectra Anchor Node Mission Profile 01"}
          latest = {}
          for row in payload.get("workflow_runs", []):
              if row.get("head_sha") != head or row.get("name") not in required: continue
              if row["name"] not in latest or row.get("created_at", "") > latest[row["name"]].get("created_at", ""): latest[row["name"]] = row
          missing = sorted(required - set(latest))
          pending = sorted(name for name, row in latest.items() if row.get("status") != "completed")
          failed = sorted(name for name, row in latest.items() if row.get("status") == "completed" and row.get("conclusion") != "success")
          print(json.dumps({"head":head,"observed":{name:{"id":row.get("id"),"status":row.get("status"),"conclusion":row.get("conclusion")} for name,row in latest.items()},"missing":missing,"pending":pending,"failed":failed,"ready":not missing and not pending and not failed}, sort_keys=True, indent=2))
          PY
            cat "$RUNNER_TEMP/gate.json"
            state="$(python - "$RUNNER_TEMP/gate.json" <<'PY'
          import json, pathlib, sys
          body=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("FAILED" if body.get("failed") else "READY" if body.get("ready") else "WAIT")
          PY
          )"
            [[ "$state" == "FAILED" ]] && exit 2
            [[ "$state" == "READY" ]] && exit 0
            sleep 10
          done
          echo "permanent gates did not become ready" >&2
          exit 2

      - name: Recheck, squash-admit, and checkpoint Issue 105
        if: steps.orient.outputs.already_merged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="${{ steps.publish.outputs.head }}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          [[ "$(git rev-parse origin/main)" == "$BASE_COMMIT" ]] || { echo "main moved before merge" >&2; exit 2; }
          [[ "$(git rev-parse 'origin/main^{tree}')" == "$BASE_TREE" ]] || { echo "main tree differs before merge" >&2; exit 2; }
          [[ "$(git rev-parse "origin/$PRODUCT_BRANCH")" == "$head" ]] || { echo "product branch moved before merge" >&2; exit 2; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" == "$head" ]] || { echo "PR head moved before merge" >&2; exit 2; }
          response="$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$head" -f merge_method='squash' -f commit_title='Add the supplier-neutral browser audition operation plan (#107)' -f commit_message='Admit the deterministic 28-step operation-plan compiler, local human-gated panel, 68 hostile witnesses, 24 binding cases, exact console dependency custody, and source-neutral no-authority boundary. No physical execution or supplier qualification occurred.')"
          [[ "$(python -c 'import json,sys; print(str(json.load(sys.stdin).get("merged",False)).lower())' <<< "$response")" == "true" ]] || { echo "$response" >&2; exit 2; }
          merge_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<< "$response")"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          [[ "$(git rev-parse origin/main)" == "$merge_sha" ]] || { echo "main does not equal merge SHA" >&2; exit 2; }
          merge_tree="$(git rev-parse 'origin/main^{tree}')"
          marker='AXM_OPERATION_PLAN_ADMISSION_CHECKPOINT_V1'
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [[ -z "$existing" ]]; then
            cat > "$RUNNER_TEMP/issue-comment.md" <<EOF
          $marker

          PR #107 admitted the supplier-neutral browser audition operation plan after the strengthened candidate passed all permanent gates on the exact head.

          \`\`\`text
          source candidate: $head
          admission commit: $merge_sha
          admission tree: $merge_tree
          source binding: $SOURCE_BINDING
          extension identity: $EXTENSION_ID
          hostile witnesses: 68 / 68 PASS
          binding cases: 24 / 24 PASS

          operation plan physically executed: false
          browser launched: false
          supplier endpoint contacted: false
          model downloaded: false
          peer connection formed: false
          inference executed: false
          route terminal produced: false
          actual supplier qualified: false
          physical Estate qualified: false
          mission authority: none
          command authority: none
          \`\`\`

          Issue #105 remains open for the private two-seat physical audition.
          EOF
            sed -i 's/^          //' "$RUNNER_TEMP/issue-comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md"
          fi

      - name: Verify any already-admitted state
        if: steps.orient.outputs.already_merged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merge_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merge_commit_sha)"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          [[ "$(git rev-parse origin/main)" == "$merge_sha" ]] || { echo "merged PR is not current main" >&2; exit 2; }
          for spec in \
            'mating_surface/anchor_node/AXM-HEAD-BROWSER-AUDITION-OPERATION-PLAN-01.md:1cdd2111241f9b6081c5d6bcce9d6988332a01e1' \
            'mating_surface/anchor_node/axm_head_browser_audition_operation_plan_01.py:82b8f56834fc51c67b2d5ba1580802ce15ae8411' \
            'mating_surface/anchor_node/browser_audition_operation_plan_contract.js:f8e707b96fccca0684753e7cd295c069d44c1de5' \
            'mating_surface/anchor_node/browser_audition_operation_plan_panel.js:24e94dd9a3da9208209f88efc9d9768ffe68adc9' \
            'mating_surface/anchor_node/conformance/test_axm_head_browser_audition_operation_plan_01.py:41baf610a37da0cfd6b781c5a5bd73f290c70e30' \
            'mating_surface/anchor_node/fixtures/axm-head-browser-audition-operation-plan-cases-01.json:f5e03c485b20941e6fed23207736fc0415aba54f' \
            'mating_surface/anchor_node/verify_axm_head_browser_audition_operation_plan_01.py:de684b129521268696337508b48adf4280de8bf6'
          do
            path="${spec%%:*}"; wanted="${spec##*:}"
            [[ "$(git rev-parse "origin/main:$path")" == "$wanted" ]] || { echo "admitted strengthened source differs: $path" >&2; exit 2; }
