name: Polybolos Command Intelligence qualification

on:
  pull_request:
    paths:
      - "adapters/polybolos_ci/**"
      - ".github/workflows/polybolos-command-intelligence.yml"
  push:
    branches:
      - main
    paths:
      - "adapters/polybolos_ci/**"
      - ".github/workflows/polybolos-command-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polybolos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-public-source-and-cabinet:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out audit harness
        uses: actions/checkout@v4

      - name: Check out the pinned Command Intelligence source
        uses: actions/checkout@v4
        with:
          repository: simplifaisoul/osiris
          ref: b9c0289c945b1908fe90f435c7e31bbc32c460f1
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Materialize the read-only cabinet bridge
        run: python adapters/polybolos_ci/materialize_cabinet.py

      - name: Run cabinet bridge refusal and custody tests
        run: python -m unittest discover -s adapters/polybolos_ci/cabinet -p 'test_*.py' -v

      - name: Install Lua 5.4 and JSON support
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-dkjson

      - name: Parse the MAME plugin and offline harness with Lua 5.4
        run: |
          luac5.4 -p adapters/polybolos_ci/cabinet/mame/polybolosci/init.lua
          luac5.4 -p adapters/polybolos_ci/cabinet/mame/test_harness.lua

      - name: Verify the target and apply the retained integration
        run: |
          python adapters/polybolos_ci/apply_overlay.py target
          python adapters/polybolos_ci/apply_post_patches.py target
          python adapters/polybolos_ci/normalize_receipt.py target

      - name: Run native tests, Command Intelligence lint, and production build
        run: python adapters/polybolos_ci/run_source_qualification.py target qualification

      - name: Run live WAL replay, provider-removal, and offline MAME transaction
        run: python adapters/polybolos_ci/run_live_e2e.py target qualification/e2e

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polybolos-command-intelligence-qualification
          path: |
            qualification
            adapters/polybolos_ci/cabinet/MATERIALIZATION_RECEIPT.json
          if-no-files-found: warn
