name: TEMP Issue 105 W01 Range Custody 03

on:
  push:
    branches:
      - ops/issue105-range-custody-03
    paths:
      - ".github/scripts/issue105-w01-range-custody-03.ps1"
      - ".github/workflows/temp-issue105-w01-range-custody-03.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-issue105-w01-range-custody-03
  cancel-in-progress: true

env:
  EXPECTED_ARCHIVE_NAME: AXM-Issue-105-Range-Custody-Transaction-03.zip
  EXPECTED_ARCHIVE_BYTES: "10673635"
  EXPECTED_ARCHIVE_SHA256: 3d098e96f68b7a080faca888d5c5d11d755bfe5024239fb9faa3381cbc3dbfa4
  EXPECTED_TRANSACTION_ID: axmissue105rangecustodytransaction_d04361beed3870611380cfb9a8141e82077c1f95d759a89cadf3ea2aef5877d9
  EXPECTED_PACKAGE_ID: axmissue105onerunnertwohostpackage_0f05332460544ddfc40499aa83825da0a5235621d9227a259abb543e992e0101
  EXPECTED_RANGE_SOURCE_SHA256: a1c4ed9316811275ebf09f9766cd9ab86bb63fa0a2b5b367edb6c7ec388bd0dc
  EXPECTED_HOSTED_RUN: "33688952874"

jobs:
  qualify-hosted:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/issue105-range-custody-03
          fetch-depth: 1
          persist-credentials: false

      - name: Parse and bind the W01 execution boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-w01-range-custody-03.ps1'
          $Tokens = $null
          $Errors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile($Script, [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count -ne 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            throw 'POWERSHELL_PARSE_FAILED'
          }
          $Source = Get-Content -LiteralPath $Script -Raw
          foreach ($Required in @(
            $env:EXPECTED_ARCHIVE_NAME,
            $env:EXPECTED_ARCHIVE_BYTES,
            $env:EXPECTED_ARCHIVE_SHA256,
            $env:EXPECTED_TRANSACTION_ID,
            $env:EXPECTED_PACKAGE_ID,
            $env:EXPECTED_RANGE_SOURCE_SHA256,
            $env:EXPECTED_HOSTED_RUN,
            'READY_FOR_PHYSICAL_SEAT_OPERATION',
            'PRIVATE_TRANSACTION_NOT_SYNCED',
            'PRIVATE_TRANSACTION_IDENTITY_MISMATCH',
            'NO_PERSISTENT_VOLUME_WITH_30GIB_FREE',
            'OPERATION_PASS_TERMINAL_INVALID'
          )) {
            if (-not $Source.Contains($Required)) {
              throw "REQUIRED_BINDING_MISSING:$Required"
            }
          }
          foreach ($Forbidden in @(
            'Invoke-WebRequest',
            'Invoke-RestMethod',
            'Start-BitsTransfer',
            'System.Net.Http',
            'WebClient',
            'New-Service',
            'Set-Service',
            'routeTerminalProduced = $true',
            'actualSupplierQualified = $true',
            'physicalEstateQualified = $true'
          )) {
            if ($Source.Contains($Forbidden)) {
              throw "FORBIDDEN_SURFACE_PRESENT:$Forbidden"
            }
          }

      - name: Exercise the no-transfer HOLD terminal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Value in @($env:COMPUTERNAME, $env:RUNNER_NAME, $env:USERPROFILE, $env:RUNNER_WORKSPACE, $env:RUNNER_TEMP)) {
            if (-not [string]::IsNullOrWhiteSpace($Value)) {
              Write-Output "::add-mask::$Value"
            }
          }
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-w01-range-custody-03.ps1'
          $ReceiptRoot = Join-Path $env:RUNNER_TEMP 'issue105-w01-range-custody-03'
          $Process = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', $Script, '-ReceiptRoot', $ReceiptRoot
          ) -Wait -PassThru -WindowStyle Hidden
          if ($Process.ExitCode -ne 0) {
            throw "HOSTED_HOLD_EXIT_INVALID:$($Process.ExitCode)"
          }
          $SummaryPath = Join-Path $ReceiptRoot 'PUBLIC-SUMMARY.json'
          if (-not (Test-Path -LiteralPath $SummaryPath -PathType Leaf)) {
            throw 'HOSTED_SUMMARY_MISSING'
          }
          $Summary = Get-Content -LiteralPath $SummaryPath -Raw | ConvertFrom-Json
          if ($Summary.status -ne 'HOLD' -or
              $Summary.terminal -ne 'HOLD' -or
              $Summary.reasonCode -ne 'PRIVATE_TRANSACTION_NOT_SYNCED' -or
              $Summary.expectedArchiveName -ne $env:EXPECTED_ARCHIVE_NAME -or
              [int64]$Summary.expectedArchiveBytes -ne [int64]$env:EXPECTED_ARCHIVE_BYTES -or
              $Summary.expectedArchiveSha256 -ne ('sha256:' + $env:EXPECTED_ARCHIVE_SHA256) -or
              $Summary.transactionId -ne $env:EXPECTED_TRANSACTION_ID -or
              $Summary.packageId -ne $env:EXPECTED_PACKAGE_ID -or
              $Summary.rangeSourceSha256 -ne ('sha256:' + $env:EXPECTED_RANGE_SOURCE_SHA256) -or
              [int64]$Summary.hostedQualificationRun -ne [int64]$env:EXPECTED_HOSTED_RUN -or
              [int]$Summary.exactCandidateCount -ne 0 -or
              $Summary.transactionVerified -ne $false -or
              $Summary.hostPreparationAttempted -ne $false -or
              $Summary.modelArtifactEndpointContactConfirmed -ne $false -or
              $Summary.modelDownloaded -ne $false -or
              [int]$Summary.rangeShardsDownloaded -ne 0 -or
              [int64]$Summary.rangePayloadBytes -ne 0 -or
              $Summary.physicalExecutionObserved -ne $false -or
              $Summary.browserLaunched -ne $false -or
              $Summary.supplierEndpointContacted -ne $false -or
              $Summary.peerConnectionFormed -ne $false -or
              $Summary.inferenceExecuted -ne $false -or
              $Summary.routeTerminalProduced -ne $false -or
              $Summary.actualSupplierQualified -ne $false -or
              $Summary.physicalEstateQualified -ne $false -or
              $Summary.missionAuthority -ne 'none' -or
              $Summary.commandAuthority -ne 'none') {
            throw 'HOSTED_HOLD_SUMMARY_INVALID'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: issue105-w01-range-custody-03-hosted-${{ github.run_id }}
          path: ${{ runner.temp }}/issue105-w01-range-custody-03/PUBLIC-SUMMARY.json
          if-no-files-found: error
          retention-days: 14

  execute-w01:
    needs: qualify-hosted
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/issue105-range-custody-03
          fetch-depth: 1
          persist-credentials: false

      - name: Execute the exact private range-custody transaction if present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Value in @($env:COMPUTERNAME, $env:RUNNER_NAME, $env:USERPROFILE, $env:RUNNER_WORKSPACE, $env:RUNNER_TEMP, $env:OneDrive, $env:GoogleDrive, $env:GDRIVE)) {
            if (-not [string]::IsNullOrWhiteSpace($Value)) {
              Write-Output "::add-mask::$Value"
            }
          }
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-w01-range-custody-03.ps1'
          $ReceiptRoot = Join-Path $env:RUNNER_TEMP 'issue105-w01-range-custody-03'
          $Process = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', $Script, '-ReceiptRoot', $ReceiptRoot
          ) -Wait -PassThru -WindowStyle Hidden
          "AXM_RANGE_CUSTODY_EXIT=$($Process.ExitCode)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Validate the body-free execution summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $SummaryPath = Join-Path $env:RUNNER_TEMP 'issue105-w01-range-custody-03\PUBLIC-SUMMARY.json'
          if (-not (Test-Path -LiteralPath $SummaryPath -PathType Leaf)) {
            throw 'SELF_HOSTED_SUMMARY_MISSING'
          }
          $Summary = Get-Content -LiteralPath $SummaryPath -Raw | ConvertFrom-Json
          if ($Summary.expectedArchiveName -ne $env:EXPECTED_ARCHIVE_NAME -or
              [int64]$Summary.expectedArchiveBytes -ne [int64]$env:EXPECTED_ARCHIVE_BYTES -or
              $Summary.expectedArchiveSha256 -ne ('sha256:' + $env:EXPECTED_ARCHIVE_SHA256) -or
              $Summary.transactionId -ne $env:EXPECTED_TRANSACTION_ID -or
              $Summary.packageId -ne $env:EXPECTED_PACKAGE_ID -or
              $Summary.rangeSourceSha256 -ne ('sha256:' + $env:EXPECTED_RANGE_SOURCE_SHA256) -or
              [int64]$Summary.hostedQualificationRun -ne [int64]$env:EXPECTED_HOSTED_RUN -or
              $Summary.physicalExecutionObserved -ne $false -or
              $Summary.browserLaunched -ne $false -or
              $Summary.supplierEndpointContacted -ne $false -or
              $Summary.peerConnectionFormed -ne $false -or
              $Summary.inferenceExecuted -ne $false -or
              $Summary.routeTerminalProduced -ne $false -or
              $Summary.actualSupplierQualified -ne $false -or
              $Summary.physicalEstateQualified -ne $false -or
              $Summary.missionAuthority -ne 'none' -or
              $Summary.commandAuthority -ne 'none') {
            throw 'SELF_HOSTED_SUMMARY_BOUNDARY_INVALID'
          }
          if ($Summary.status -eq 'PASS') {
            if ($Summary.terminal -ne 'READY_FOR_PHYSICAL_SEAT_OPERATION' -or
                $Summary.transactionVerified -ne $true -or
                $Summary.modelArtifactEndpointContactConfirmed -ne $true -or
                $Summary.modelDownloaded -ne $true -or
                [int]$Summary.rangeShardsDownloaded -ne 2 -or
                [int64]$Summary.rangePayloadBytes -ne 15780284416L -or
                [int]$env:AXM_RANGE_CUSTODY_EXIT -ne 0) {
              throw 'SELF_HOSTED_PASS_SUMMARY_INVALID'
            }
          }
          elseif ($Summary.status -eq 'HOLD') {
            if ($Summary.terminal -ne 'HOLD' -or [int]$env:AXM_RANGE_CUSTODY_EXIT -ne 0) {
              throw 'SELF_HOSTED_HOLD_SUMMARY_INVALID'
            }
          }
          elseif ($Summary.status -eq 'REFUSED') {
            throw "SELF_HOSTED_EXECUTION_REFUSED:$($Summary.reasonCode)"
          }
          else {
            throw 'SELF_HOSTED_STATUS_INVALID'
          }

      - name: Upload the body-free execution summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue105-w01-range-custody-03-${{ github.run_id }}
          path: ${{ runner.temp }}/issue105-w01-range-custody-03/PUBLIC-SUMMARY.json
          if-no-files-found: error
          retention-days: 14
