name: STC MARY Offline Cell and Successor Carrier 01

on:
  pull_request:
    paths:
      - "mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json"
      - "mating_surface/anchor_node/stc_mary_offline_carrier.py"
      - "mating_surface/anchor_node/stc-mary-offline-carrier.ps1"
      - "mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md"
      - "mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py"
      - "mating_surface/anchor_node/stc_mary_local/plan.py"
      - "mating_surface/anchor_node/stc_mary_local/cli.py"
      - ".github/workflows/stc-mary-offline-carrier-01.yml"
  push:
    branches:
      - main
    paths:
      - "mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json"
      - "mating_surface/anchor_node/stc_mary_offline_carrier.py"
      - "mating_surface/anchor_node/stc-mary-offline-carrier.ps1"
      - "mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md"
      - "mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py"
      - "mating_surface/anchor_node/stc_mary_local/plan.py"
      - "mating_surface/anchor_node/stc_mary_local/cli.py"
      - ".github/workflows/stc-mary-offline-carrier-01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-mary-offline-carrier-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-offline-carrier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse network, credential, and private-host surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json'),
              Path('mating_surface/anchor_node/stc_mary_offline_carrier.py'),
              Path('mating_surface/anchor_node/stc-mary-offline-carrier.ps1'),
              Path('mating_surface/anchor_node/STC-MARY-OFFLINE-CARRIER-RUNBOOK.md'),
              Path('mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py'),
              Path('mating_surface/anchor_node/stc_mary_local/plan.py'),
              Path('mating_surface/anchor_node/stc_mary_local/cli.py'),
          ]
          joined = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = {
              'network client': r'\b(?:requests|urllib3|aiohttp|httpx)\b|socket\.(?:connect|create_connection)',
              'credential material': r'AKIA[0-9A-Z]{16}|BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:\s*Bearer',
              'private host': r'OCTO-(?:W|L)[0-9]+',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, joined, re.I):
                  raise SystemExit(f'{label} detected in the public carrier surface')
          PY

      - name: Check exact syntax and frozen profile
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_offline_carrier.py \
            mating_surface/anchor_node/stc_mary_local/plan.py \
            mating_surface/anchor_node/stc_mary_local/cli.py \
            mating_surface/anchor_node/conformance/test_stc_mary_offline_carrier.py
          python mating_surface/anchor_node/stc_mary_offline_carrier.py validate-profile \
            mating_surface/anchor_node/stc-mary-offline-carrier-profile-01.json
          git diff --check

      - name: Run the closed carrier and plan-integration suite
        shell: bash
        run: |
          mkdir -p qualification/stc-mary-offline-carrier-01
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_offline_carrier.py' \
            -v 2>&1 | tee qualification/stc-mary-offline-carrier-01/carrier-tests-${{ matrix.os }}.txt
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_local_toolchain.py' \
            -v 2>&1 | tee qualification/stc-mary-offline-carrier-01/inherited-toolchain-tests-${{ matrix.os }}.txt

      - name: Preserve body-free qualification receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path('qualification/stc-mary-offline-carrier-01')
          files = []
          for path in sorted(root.glob('*.txt')):
              data = path.read_bytes()
              files.append({
                  'name': path.name,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              })
          receipt = {
              'schema': 'stc-mary-offline-carrier-qualification/1',
              'runnerClass': '${{ matrix.os }}',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'tests': files,
              'privateEvidenceBodies': 0,
              'externalServiceCalls': 0,
              'operationalCredentials': 0,
              'physicalPartitionExecuted': False,
              'physicalReunionExecuted': False,
              'successorRecovered': False,
              'physicalEstateQualified': False,
              'representativeOperatorQualified': False,
              'fieldNetworkQualified': False,
              'operationalC2Qualified': False,
              'productionLatticeQualified': False,
              'authority': 'none',
          }
          (root / 'qualification-receipt-${{ matrix.os }}.json').write_text(
              json.dumps(receipt, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload qualification receipts
        uses: actions/upload-artifact@v4
        with:
          name: stc-mary-offline-carrier-01-${{ matrix.os }}-${{ github.sha }}
          path: qualification/stc-mary-offline-carrier-01/
          if-no-files-found: error
          retention-days: 14

  qualify-powershell-entrypoint:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the PowerShell wrapper and private-root template transaction
        shell: pwsh
        run: |
          $Carrier = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-offline-carrier.ps1'
          $Profile = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node\stc-mary-offline-carrier-profile-01.json'
          & $Carrier validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Inputs = Join-Path $env:RUNNER_TEMP 'stc-mary-offline-inputs-wrapper'
          & $Carrier template-inputs --out $Inputs --repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($required in @(
            'common-state.json',
            'left-delta.json',
            'right-delta.json',
            'authority.json',
            'obligations.json',
            'evidence-envelope.json',
            'next-safe-action.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $Inputs $required) -PathType Leaf)) {
              throw "Template transaction omitted $required"
            }
          }
