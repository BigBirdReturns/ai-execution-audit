name: AXM HEAD Browser Distributed-Inference Audition 01

on:
  pull_request:
    paths:
      - ".github/workflows/axm-head-browser-distributed-inference-audition-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-BROWSER-DISTRIBUTED-INFERENCE-AUDITION-01.md"
      - "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
      - "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition.ps1"
      - "mating_surface/anchor_node/axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/browser_distributed_inference_probe.js"
      - "mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/fixtures/axm-head-browser-distributed-inference-audition-cases-01.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/axm-head-browser-distributed-inference-audition-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-BROWSER-DISTRIBUTED-INFERENCE-AUDITION-01.md"
      - "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
      - "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition.ps1"
      - "mating_surface/anchor_node/axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/browser_distributed_inference_probe.js"
      - "mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition_bootstrap.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_browser_distributed_inference_audition.py"
      - "mating_surface/anchor_node/fixtures/axm-head-browser-distributed-inference-audition-cases-01.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-head-browser-distributed-inference-audition-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        coordinate: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDWRITEBYTECODE: "1"

    steps:
      - name: Resolve exact Git coordinate
        id: coordinate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ matrix.coordinate }}" == "head" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact coordinate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.coordinate.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Materialize authoritative source from exact Git blobs
        shell: bash
        env:
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          ref = os.environ["SOURCE_REF"]
          profile_path = "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
          profile_bytes = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{profile_path}"])
          profile = json.loads(profile_bytes)
          for relative in profile["sourceMembers"]:
              data = subprocess.check_output(["git", "cat-file", "blob", f"{ref}:{relative}"])
              if b"\r" in data:
                  raise SystemExit(f"authoritative source contains CR bytes: {relative}")
              path = pathlib.Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY

      - name: Verify the admitted commodity predecessor
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          profile_path = pathlib.Path("mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          binding = profile["commodityBinding"]
          commit = binding["admissionCommit"]
          tree = subprocess.check_output(["git", "rev-parse", f"{commit}^{{tree}}"], text=True).strip()
          if tree != binding["admissionTree"]:
              raise SystemExit(f"commodity tree differs: expected={binding['admissionTree']} observed={tree}")
          for member in binding["productMembers"]:
              observed = subprocess.check_output(
                  ["git", "rev-parse", f"{commit}:{member['path']}"], text=True
              ).strip()
              if observed != member["sha"]:
                  raise SystemExit(
                      f"commodity member differs: {member['path']} expected={member['sha']} observed={observed}"
                  )
          print("seven-member commodity predecessor is exact")
          PY

      - name: Require the exact additive product denominator
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_REF: ${{ steps.coordinate.outputs.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          profile = json.loads(
              pathlib.Path(
                  "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
              ).read_text(encoding="utf-8")
          )
          expected = set(profile["sourceMembers"])
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["SOURCE_REF"]],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"product denominator differs: missing={sorted(expected - changed)} extra={sorted(changed - expected)}"
              )
          for relative in expected:
              status = subprocess.check_output(
                  ["git", "diff", "--diff-filter=ACDMRTUXB", "--name-status", os.environ["BASE_SHA"], os.environ["SOURCE_REF"], "--", relative],
                  text=True,
              ).strip()
              if not status.startswith("A\t"):
                  raise SystemExit(f"product path is not purely additive: {relative}: {status}")
          PY

      - name: Compile and inspect the source surface
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/axm_head_browser_distributed_inference_audition.py \
            mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition.py \
            mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition_bootstrap.py \
            mating_surface/anchor_node/conformance/test_axm_head_browser_distributed_inference_audition.py
          node --check mating_surface/anchor_node/browser_distributed_inference_probe.js
          python - <<'PY'
          from pathlib import Path

          core = Path("mating_surface/anchor_node/axm_head_browser_distributed_inference_audition.py").read_text(encoding="utf-8").lower()
          probe = Path("mating_surface/anchor_node/browser_distributed_inference_probe.js").read_text(encoding="utf-8")
          profile = Path("mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json").read_text(encoding="utf-8").lower()
          for label, text in (("core", core), ("probe", probe.lower()), ("profile", profile)):
              if "swarmllm" in text:
                  raise SystemExit(f"supplier identity escaped fixture boundary: {label}")
          forbidden_probe = (
              "response.text(",
              "candidate.address",
              "localdescription.sdp",
              "remotedescription.sdp",
              "prompttext",
              "completiontext",
          )
          lowered = probe.lower()
          for token in forbidden_probe:
              if token in lowered:
                  raise SystemExit(f"probe retains forbidden body or network identity: {token}")
          PY

      - name: Qualify the closed synthetic denominator
        shell: bash
        env:
          COORDINATE: ${{ matrix.coordinate }}
          PLATFORM: ${{ matrix.os }}
          RECEIPT_ROOT: ${{ runner.temp }}/axm-browser-audition
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_ROOT"
          PROFILE="mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
          FIXTURES="mating_surface/anchor_node/fixtures/axm-head-browser-distributed-inference-audition-cases-01.json"
          TOOL="mating_surface/anchor_node/axm_head_browser_distributed_inference_audition.py"
          PROBE="mating_surface/anchor_node/browser_distributed_inference_probe.js"
          TESTS="mating_surface/anchor_node/conformance/test_axm_head_browser_distributed_inference_audition.py"

          python "$TOOL" validate-profile "$PROFILE" > "$RECEIPT_ROOT/profile-validation.json"
          python "$TOOL" validate-fixtures "$PROFILE" "$FIXTURES" > "$RECEIPT_ROOT/fixture-validation.json"
          python "$TOOL" campaign "$PROFILE" "$FIXTURES" > "$RECEIPT_ROOT/campaign.json"
          python "$TOOL" probe-digest "$PROBE" > "$RECEIPT_ROOT/probe-digest.json"
          python "$TOOL" source-set "$PROFILE" "$GITHUB_WORKSPACE" > "$RECEIPT_ROOT/source-set.json"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_browser_distributed_inference_audition.py' \
            -v 2>&1 | tee "$RECEIPT_ROOT/tests.txt"
          grep -F "Ran 54 tests" "$RECEIPT_ROOT/tests.txt"
          grep -Fx "OK" "$RECEIPT_ROOT/tests.txt"

          python - "$RECEIPT_ROOT/campaign.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          campaign = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "PREPARED_FOR_PHYSICAL_AUDITION": 1,
              "OBSERVED_ROUTE_CANDIDATE": 1,
              "HOLD": 13,
          }
          if campaign.get("status") != "PASS" or campaign.get("terminalCounts") != expected:
              raise SystemExit(f"campaign denominator refused: {campaign}")
          if campaign.get("actualSupplierQualified") is not False:
              raise SystemExit("campaign promoted actual supplier")
          if campaign.get("executionOccurred") is not False:
              raise SystemExit("campaign promoted execution")
          PY

          python - "$PROFILE" "$FIXTURES" "$RECEIPT_ROOT" <<'PY'
          import pathlib
          import sys

          profile_path, fixtures_path, out_root = map(pathlib.Path, sys.argv[1:])
          sys.path.insert(0, str(profile_path.parent))
          import axm_head_browser_distributed_inference_audition as mod

          profile = mod.validate_profile(profile_path)
          fixtures = mod.validate_fixture_catalog(fixtures_path, profile)
          materialization = fixtures["materializationFixture"]
          (out_root / "complete-raw.json").write_bytes(mod.pretty_bytes(materialization["raw"]))
          (out_root / "complete-control.json").write_bytes(mod.pretty_bytes(materialization["control"]))
          (out_root / "complete-expected-capture.json").write_bytes(mod.pretty_bytes(fixtures["cases"][0]["capture"]))

          prepared = fixtures["cases"][1]
          (out_root / "prepared-capture.json").write_bytes(mod.pretty_bytes(prepared["capture"]))
          (out_root / "prepared-decision.json").write_bytes(
              mod.pretty_bytes(mod.assess_capture(prepared["capture"], profile, case_id=prepared["caseId"]))
          )
          PY

          python "$TOOL" materialize "$PROFILE" \
            "$RECEIPT_ROOT/complete-raw.json" "$RECEIPT_ROOT/complete-control.json" \
            --out "$RECEIPT_ROOT/complete-capture.json" \
            --receipt-out "$RECEIPT_ROOT/materialization-receipt.json" \
            > "$RECEIPT_ROOT/complete-capture-stdout.json"
          cmp "$RECEIPT_ROOT/complete-capture.json" "$RECEIPT_ROOT/complete-capture-stdout.json"
          cmp "$RECEIPT_ROOT/complete-capture.json" "$RECEIPT_ROOT/complete-expected-capture.json"
          python "$TOOL" assess "$PROFILE" "$RECEIPT_ROOT/complete-capture.json" \
            --case-id observed-complete-synthetic-route \
            > "$RECEIPT_ROOT/complete-decision.json"

          python mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition.py \
            "$PROFILE" "$RECEIPT_ROOT/complete-capture.json" "$RECEIPT_ROOT/complete-decision.json" \
            --raw "$RECEIPT_ROOT/complete-raw.json" --control "$RECEIPT_ROOT/complete-control.json" \
            > "$RECEIPT_ROOT/complete-direct-verdict.json"
          python mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_browser_distributed_inference_audition.py \
            "$PROFILE" "$RECEIPT_ROOT/complete-capture.json" "$RECEIPT_ROOT/complete-decision.json" \
            --raw "$RECEIPT_ROOT/complete-raw.json" --control "$RECEIPT_ROOT/complete-control.json" \
            > "$RECEIPT_ROOT/complete-bootstrap-verdict.json"

          python - "$RECEIPT_ROOT/complete-direct-verdict.json" "$RECEIPT_ROOT/complete-bootstrap-verdict.json" <<'PY'
          import json
          import pathlib
          import sys
          for value in map(pathlib.Path, sys.argv[1:]):
              receipt = json.loads(value.read_text(encoding="utf-8"))
              if receipt.get("status") != "PASS" or receipt.get("rawEvidenceReconstructed") is not True:
                  raise SystemExit(f"raw evidence was not independently reconstructed: {value}: {receipt}")
          PY

          python - "$RECEIPT_ROOT" "$COORDINATE" "$PLATFORM" "${{ steps.coordinate.outputs.ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root, coordinate, platform, expected_sha = sys.argv[1:]
          observed_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          profile_relative = "mating_surface/anchor_node/axm-head-browser-distributed-inference-audition-profile-01.json"
          profile = json.loads(
              subprocess.check_output(["git", "cat-file", "blob", f"{expected_sha}:{profile_relative}"])
          )
          source_members = tuple(profile["sourceMembers"])
          source_member_differences = []
          for relative in source_members:
              expected_bytes = subprocess.check_output(
                  ["git", "cat-file", "blob", f"{expected_sha}:{relative}"]
              )
              path = pathlib.Path(relative)
              if not path.is_file() or path.read_bytes() != expected_bytes:
                  source_member_differences.append(relative)
          outside_status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
                  "--",
                  ".",
                  *[f":(exclude){relative}" for relative in source_members],
              ],
              text=True,
          )
          coordinate_exact = observed_sha == expected_sha
          source_members_exact = not source_member_differences
          outside_source_members_clean = outside_status == ""
          body = {
              "schema": "axm-head/browser-audition-source-coordinate@1",
              "status": "PASS"
              if coordinate_exact and source_members_exact and outside_source_members_clean
              else "REFUSED",
              "coordinate": coordinate,
              "platform": platform,
              "expectedSha": expected_sha,
              "observedSha": observed_sha,
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "sourceMemberCount": len(source_members),
              "sourceMembersExact": source_members_exact,
              "sourceMemberDifferences": source_member_differences,
              "outsideSourceMembersClean": outside_source_members_clean,
          }
          pathlib.Path(root, "source-coordinate.json").write_text(
              json.dumps(body, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          if body["status"] != "PASS":
              raise SystemExit(body)
          PY

      - name: Exercise the PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Root = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node'
          $Tool = Join-Path $Root 'axm-head-browser-distributed-inference-audition.ps1'
          $Profile = Join-Path $Root 'axm-head-browser-distributed-inference-audition-profile-01.json'
          $Fixtures = Join-Path $Root 'fixtures\axm-head-browser-distributed-inference-audition-cases-01.json'
          $Probe = Join-Path $Root 'browser_distributed_inference_probe.js'
          & $Tool validate-profile $Profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool validate-fixtures $Profile $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool campaign $Profile $Fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool probe-digest $Probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ReceiptRoot = Join-Path $env:RUNNER_TEMP 'axm-browser-audition-powershell'
          New-Item -ItemType Directory -Path $ReceiptRoot -Force | Out-Null
          $Raw = Join-Path $ReceiptRoot 'raw.json'
          $Control = Join-Path $ReceiptRoot 'control.json'
          $Capture = Join-Path $ReceiptRoot 'capture.json'
          $Receipt = Join-Path $ReceiptRoot 'materialization.json'
          $MaterializerSource = @'
          import pathlib
          import sys
          sys.path.insert(0, str(pathlib.Path(sys.argv[1]).parent))
          import axm_head_browser_distributed_inference_audition as mod
          profile = mod.validate_profile(sys.argv[1])
          fixtures = mod.validate_fixture_catalog(sys.argv[2], profile)
          fixture = fixtures["materializationFixture"]
          pathlib.Path(sys.argv[3]).write_bytes(mod.pretty_bytes(fixture["raw"]))
          pathlib.Path(sys.argv[4]).write_bytes(mod.pretty_bytes(fixture["control"]))
          '@
          $MaterializerSource | python - $Profile $Fixtures $Raw $Control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Tool materialize $Profile $Raw $Control --out $Capture --receipt-out $Receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Materialization = Get-Content -LiteralPath $Receipt -Raw | ConvertFrom-Json
          if ($Materialization.status -ne 'PASS' -or $Materialization.rawEventsReconstructed -ne $true) {
            throw 'PowerShell materialization did not reconstruct raw events'
          }

      - name: Preserve qualification receipts
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-browser-audition-${{ matrix.os }}-${{ matrix.coordinate }}-${{ github.sha }}
          path: ${{ runner.temp }}/axm-browser-audition/
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download qualification receipts
        uses: actions/download-artifact@v4
        with:
          pattern: axm-head-browser-audition-*-${{ github.sha }}
          path: qualification-download

      - name: Require platform and coordinate byte identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("qualification-download")
          event_name = os.environ["EVENT_NAME"]
          is_pull_request = event_name == "pull_request"
          expected_sets = 4 if is_pull_request else 2
          directories = sorted(path for path in root.iterdir() if path.is_dir())
          if len(directories) != expected_sets:
              raise SystemExit(f"expected {expected_sets} receipt sets, found {len(directories)}")
          names = (
              "profile-validation.json",
              "fixture-validation.json",
              "campaign.json",
              "probe-digest.json",
              "source-set.json",
              "complete-raw.json",
              "complete-control.json",
              "materialization-receipt.json",
              "complete-capture.json",
              "complete-decision.json",
              "prepared-capture.json",
              "prepared-decision.json",
              "complete-direct-verdict.json",
              "complete-bootstrap-verdict.json",
          )
          for name in names:
              rows = [(directory / name).read_bytes() for directory in directories]
              if any(row != rows[0] for row in rows[1:]):
                  raise SystemExit(f"platform or coordinate bytes differ: {name}")
          body = {
              "schema": "axm-head/browser-audition-cross-coordinate@1",
              "status": "PASS",
              "receiptSets": len(directories),
              "comparedObjects": len(names),
              "platformByteIdentity": True,
              "coordinateByteIdentity": True,
              "headMergeByteIdentity": True if is_pull_request else None,
          }
          Path("cross-coordinate.json").write_text(
              json.dumps(body, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Preserve comparison receipt
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-browser-audition-cross-coordinate-${{ github.sha }}
          path: cross-coordinate.json
          if-no-files-found: error
          retention-days: 14
