name: AXM HEAD Physical Long-Haul Join 01

on:
  pull_request:
    paths:
      - ".github/workflows/axm-head-physical-long-haul-join-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md"
      - "mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json"
      - "mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1"
      - "mating_surface/anchor_node/axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/axm-head-physical-long-haul-join-01.yml"
      - "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md"
      - "mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json"
      - "mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1"
      - "mating_surface/anchor_node/axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py"
      - "mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axm-head-physical-long-haul-join-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Check out complete event history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Qualify exact source bytes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ matrix.os }}
        run: |
          set -euo pipefail
          workspace="$(pwd)"
          temp_root="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          receipts="$temp_root/join-v2-receipts-$PLATFORM"
          coordinates="$temp_root/join-v2-coordinates-$PLATFORM.tsv"
          rm -rf "$receipts"
          mkdir -p "$receipts"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf 'head\t%s\nmerge\t%s\n' "$PR_HEAD_SHA" "$EVENT_SHA" > "$coordinates"
          else
            printf 'source\t%s\n' "$EVENT_SHA" > "$coordinates"
          fi

          while IFS=$'\t' read -r name sha
          do
            [ -n "$name" ] || continue
            observed="$(git rev-parse "$sha^{commit}")"
            [ "$observed" = "$sha" ]
            root="$temp_root/join-$PLATFORM-$name"
            rm -rf "$root"
            mkdir -p "$root"

            python - "$sha" "$root" <<'PY'
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          commit = sys.argv[1]
          root = Path(sys.argv[2])
          listing = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", "--full-tree", commit]
          )
          entries = []
          for record in listing.split(b"\0"):
              if not record:
                  continue
              metadata, path_bytes = record.split(b"\t", 1)
              mode, object_type, object_id = metadata.decode("ascii").split()
              if object_type != "blob":
                  continue
              relative = path_bytes.decode("utf-8", "surrogateescape")
              parts = PurePosixPath(relative).parts
              if not parts or PurePosixPath(relative).is_absolute() or ".." in parts:
                  raise SystemExit(f"unsafe tree path: {relative!r}")
              entries.append((mode, object_id, parts))

          process = subprocess.Popen(
              ["git", "cat-file", "--batch"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
          )
          assert process.stdin is not None
          assert process.stdout is not None
          try:
              for mode, object_id, parts in entries:
                  process.stdin.write((object_id + "\n").encode("ascii"))
                  process.stdin.flush()
                  header = process.stdout.readline().decode("ascii").strip().split()
                  if len(header) != 3 or header[1] != "blob":
                      raise SystemExit(f"unexpected cat-file header: {header!r}")
                  size = int(header[2])
                  data = process.stdout.read(size)
                  separator = process.stdout.read(1)
                  if len(data) != size or separator != b"\n":
                      raise SystemExit(f"truncated blob: {object_id}")
                  target = root.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if mode == "120000" and os.name != "nt":
                      os.symlink(data.decode("utf-8", "surrogateescape"), target)
                  else:
                      target.write_bytes(data)
                      if mode == "100755":
                          target.chmod(target.stat().st_mode | stat.S_IXUSR)
          finally:
              process.stdin.close()
              return_code = process.wait()
          if return_code != 0:
              raise SystemExit(return_code)
          PY

            cd "$root"

            python -m py_compile \
              mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
              mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
              mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py

            python mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
              validate-profile \
              mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
              > "$receipts/$name-profile.json"

            python mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
              validate-fixtures \
              mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
              mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
              > "$receipts/$name-fixtures.json"

            focused_stdout="$temp_root/tests-$PLATFORM-$name.stdout"
            focused_stderr="$temp_root/tests-$PLATFORM-$name.txt"
            python -m unittest discover \
              -s mating_surface/anchor_node/conformance \
              -p 'test_axm_head_physical_long_haul_join.py' \
              -v > "$focused_stdout" 2> "$focused_stderr"
            test ! -s "$focused_stdout"
            cat "$focused_stderr"
            grep -F "Ran 52 tests" "$focused_stderr"
            if [ "$PLATFORM" = "windows-latest" ]; then
              grep -Fx "OK (skipped=2)" "$temp_root/tests-$PLATFORM-$name.txt"
            else
              grep -Fx "OK" "$temp_root/tests-$PLATFORM-$name.txt"
            fi

            python -m unittest discover \
              -s mating_surface/anchor_node/conformance \
              -p 'test_axm_head_edge_demo.py' \
              -v 2>&1 | tee "$temp_root/axm-$PLATFORM-$name.txt"
            grep -F "Ran 38 tests" "$temp_root/axm-$PLATFORM-$name.txt"
            grep -Fx "OK" "$temp_root/axm-$PLATFORM-$name.txt"

            python -m unittest discover \
              -s mating_surface/anchor_node/conformance \
              -p 'test_stc_mary_flight_conductor.py' \
              -v 2>&1 | tee "$temp_root/conductor-$PLATFORM-$name.txt"
            grep -F "Ran 25 tests" "$temp_root/conductor-$PLATFORM-$name.txt"
            grep -Fx "OK" "$temp_root/conductor-$PLATFORM-$name.txt"

            carrier="$temp_root/carrier-$PLATFORM-$name"
            python mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
              build-fixture \
              mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json \
              mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json \
              prepared-not-armed \
              --out "$carrier" \
              > "$receipts/$name-build.json"

            verdict="$receipts/$name-verdict.json"
            python mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
              verify-join "$carrier" --out "$verdict" \
              > "$receipts/$name-verdict-stdout.json"
            cmp "$verdict" "$receipts/$name-verdict-stdout.json"

            cp "$carrier/MANIFEST.json" "$receipts/$name-MANIFEST.json"
            cp "$carrier/JOIN/join.json" "$receipts/$name-join.json"
            cp "$carrier/PUBLIC/status.json" "$receipts/$name-public-status.json"

            python - "$verdict" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["status"] == "PASS"
          assert value["terminal"] == "PREPARED_NOT_ARMED"
          assert value["bootstrapAuthenticated"] is True
          assert value["privatePhysicalFlightCompleted"] is False
          assert value["physicalExecutionStartedByJoin"] is False
          assert value["workersLaunched"] == 0
          assert value["listenersCreated"] == 0
          assert value["authority"] == "none"
          PY

            cd "$workspace"
          done < "$coordinates"

      - name: Qualify PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1 `
            validate-profile `
            ./mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload authoritative receipts
        uses: actions/upload-artifact@v4
        with:
          name: join-v2-${{ matrix.os }}
          path: ${{ runner.temp }}/join-v2-receipts-${{ matrix.os }}
          if-no-files-found: error

  compare:
    if: github.event_name == 'pull_request'
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Ubuntu receipts
        uses: actions/download-artifact@v4
        with:
          name: join-v2-ubuntu-latest
          path: receipts/ubuntu

      - name: Download Windows receipts
        uses: actions/download-artifact@v4
        with:
          name: join-v2-windows-latest
          path: receipts/windows

      - name: Require platform and head-to-merge byte identity
        shell: bash
        run: |
          set -euo pipefail
          authoritative=(
            profile.json
            fixtures.json
            build.json
            verdict.json
            verdict-stdout.json
            MANIFEST.json
            join.json
            public-status.json
          )
          for suffix in "${authoritative[@]}"
          do
            cmp "receipts/ubuntu/head-$suffix" "receipts/windows/head-$suffix"
            cmp "receipts/ubuntu/merge-$suffix" "receipts/windows/merge-$suffix"
            cmp "receipts/ubuntu/head-$suffix" "receipts/ubuntu/merge-$suffix"
            cmp "receipts/windows/head-$suffix" "receipts/windows/merge-$suffix"
          done
          echo "platformByteIdentity=true"
          echo "headToMergeByteIdentity=true"
          echo "privateSelfAttestedFixtures=0"
          echo "physicalExecutionStartedByJoin=false"
          echo "workersLaunched=0"
          echo "listenersCreated=0"
          echo "authority=none"
