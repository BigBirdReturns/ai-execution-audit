name: TEMP Issue 105 Final Host Preparation 01

on:
  push:
    branches:
      - ops/issue105-l01-private-transfer-prepare-01
    paths:
      - ".github/scripts/issue105-final-host-preparation-01.ps1"
      - ".github/workflows/temp-issue105-final-host-preparation-01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-issue105-final-host-preparation-01
  cancel-in-progress: true

env:
  EXPECTED_ARCHIVE_NAME: AXM-Issue-105-Physical-Flight-Bootstrap-03.zip
  EXPECTED_ARCHIVE_BYTES: "33026569"
  EXPECTED_ARCHIVE_SHA256: 435a44defad35aa3abd7b67c281f543aae7225efc0351bae05f5d7ae378b98c0
  EXPECTED_BOOTSTRAP_ID: axmswarmllmflightbootstrap_ed0110be1bac6030490751a098b37e83ce2edf7b460c9efb77eb83c194d6ca7b
  EXPECTED_RELEASE_ID: axmswarmllmexactcustodyrelease_6948e34bcdd927819b21b5ffaed97c4c287dff23d30dc5a10b12162d9e4e6f7b
  EXPECTED_WORKSPACE_ID: axmswarmllmvenueobserverworkspace_ed63f5fe5425e19f3f83287da7df60444d76f1089b4d2b8cf42aa24cda277994
  EXPECTED_CUSTODY_PLAN_ID: axmswarmllmcustodyplan_17c7d340d72ed5d8b707aca3ba6efe91a89564938f310bf76c7ba2f77610c162
  EXPECTED_TRANSACTION_ID: axmbrowserphysicalrun_39c742fdf6f8108d750adc3d4e0629b53acb9749e27f7d217679c0fa84553474

jobs:
  qualify-windows-boundary:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/issue105-l01-private-transfer-prepare-01
          fetch-depth: 1
          persist-credentials: false

      - name: Parse the final-host PowerShell entrypoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-final-host-preparation-01.ps1'
          $Tokens = $null
          $Errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($Script, [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count -ne 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            throw 'POWERSHELL_PARSE_FAILED'
          }

      - name: Bind the exact immutable identities and closed execution surface
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-final-host-preparation-01.ps1'
          $Source = Get-Content -LiteralPath $Script -Raw
          foreach ($Required in @(
            $env:EXPECTED_ARCHIVE_NAME,
            $env:EXPECTED_ARCHIVE_BYTES,
            $env:EXPECTED_ARCHIVE_SHA256,
            $env:EXPECTED_BOOTSTRAP_ID,
            $env:EXPECTED_RELEASE_ID,
            $env:EXPECTED_WORKSPACE_ID,
            $env:EXPECTED_CUSTODY_PLAN_ID,
            $env:EXPECTED_TRANSACTION_ID,
            "[ValidateSet('W01', 'L01')]",
            "@('controller', 'seat-02')",
            "@('seat-01')",
            "PREPARED_FOR_EXACT_RANGE_CUSTODY",
            "W01_CONTROLLER_AND_SEAT02_PREPARED",
            "L01_SEAT01_PREPARED"
          )) {
            if (-not $Source.Contains($Required)) { throw "REQUIRED_BINDING_MISSING:$Required" }
          }
          foreach ($Forbidden in @(
            'Invoke-WebRequest',
            'Invoke-RestMethod',
            'Start-BitsTransfer',
            'System.Net.Http',
            'WebClient',
            'ssh ',
            'scp ',
            'curl ',
            'wget ',
            'Start-Process -FilePath $Browser',
            'routeTerminalProduced = $true',
            'actualSupplierQualified = $true',
            'physicalEstateQualified = $true'
          )) {
            if ($Source.Contains($Forbidden)) { throw "FORBIDDEN_SURFACE_PRESENT:$Forbidden" }
          }

      - name: Exercise both missing-archive HOLD terminals
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-final-host-preparation-01.ps1'
          foreach ($Role in @('W01', 'L01')) {
            $Root = Join-Path $env:RUNNER_TEMP "issue105-final-host-$Role"
            New-Item -ItemType Directory -Path $Root -Force | Out-Null
            $Missing = Join-Path $Root $env:EXPECTED_ARCHIVE_NAME
            $ReceiptPath = Join-Path $Root 'HOST-PREPARATION-RECEIPT.json'
            $Process = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
              '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $Script,
              '-HostRole', $Role,
              '-BootstrapArchive', $Missing,
              '-ReceiptPath', $ReceiptPath
            ) -Wait -PassThru -WindowStyle Hidden
            if ($Process.ExitCode -ne 2) { throw "MISSING_ARCHIVE_EXIT_INVALID:$Role:$($Process.ExitCode)" }
            if (-not (Test-Path -LiteralPath $ReceiptPath -PathType Leaf)) { throw "MISSING_RECEIPT:$Role" }
            $Receipt = Get-Content -LiteralPath $ReceiptPath -Raw | ConvertFrom-Json
            if ($Receipt.status -ne 'HOLD' -or
                $Receipt.terminal -ne 'HOLD' -or
                $Receipt.reasonCode -ne 'BOOTSTRAP_ARCHIVE_MISSING' -or
                $Receipt.requestedHostRole -ne $Role -or
                $Receipt.bootstrapId -ne $env:EXPECTED_BOOTSTRAP_ID -or
                $Receipt.releaseId -ne $env:EXPECTED_RELEASE_ID -or
                $Receipt.workspaceId -ne $env:EXPECTED_WORKSPACE_ID -or
                $Receipt.custodyPlanId -ne $env:EXPECTED_CUSTODY_PLAN_ID -or
                $Receipt.transactionId -ne $env:EXPECTED_TRANSACTION_ID -or
                [int64]$Receipt.archiveBytes -ne [int64]$env:EXPECTED_ARCHIVE_BYTES -or
                $Receipt.archiveSha256 -ne ('sha256:' + $env:EXPECTED_ARCHIVE_SHA256) -or
                $Receipt.preparedRoles.Count -ne 0 -or
                $Receipt.physicalExecutionObserved -ne $false -or
                $Receipt.browserLaunched -ne $false -or
                $Receipt.supplierEndpointContacted -ne $false -or
                $Receipt.modelDownloaded -ne $false -or
                [int]$Receipt.rangeShardsDownloaded -ne 0 -or
                $Receipt.peerConnectionFormed -ne $false -or
                $Receipt.inferenceExecuted -ne $false -or
                [int]$Receipt.physicalMemberEvidenceAccepted -ne 0 -or
                [int]$Receipt.rawCapturesAccepted -ne 0 -or
                $Receipt.namedHumanConfirmationSupplied -ne $false -or
                $Receipt.routeTerminalProduced -ne $false -or
                $Receipt.actualSupplierQualified -ne $false -or
                $Receipt.physicalEstateQualified -ne $false -or
                $Receipt.missionAuthority -ne 'none' -or
                $Receipt.commandAuthority -ne 'none') {
              throw "MISSING_ARCHIVE_RECEIPT_INVALID:$Role"
            }
          }

      - name: Exercise wrong-denominator and wrong-digest refusal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-final-host-preparation-01.ps1'
          $Root = Join-Path $env:RUNNER_TEMP 'issue105-final-host-negative'
          New-Item -ItemType Directory -Path $Root -Force | Out-Null
          $Archive = Join-Path $Root $env:EXPECTED_ARCHIVE_NAME
          [IO.File]::WriteAllBytes($Archive, [byte[]](1..32))
          $ReceiptPath = Join-Path $Root 'HOST-PREPARATION-RECEIPT.json'
          $Process = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
            '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $Script,
            '-HostRole', 'L01',
            '-BootstrapArchive', $Archive,
            '-ReceiptPath', $ReceiptPath
          ) -Wait -PassThru -WindowStyle Hidden
          if ($Process.ExitCode -ne 2) { throw "WRONG_DENOMINATOR_EXIT_INVALID:$($Process.ExitCode)" }
          $Receipt = Get-Content -LiteralPath $ReceiptPath -Raw | ConvertFrom-Json
          if ($Receipt.reasonCode -ne 'BOOTSTRAP_ARCHIVE_DENOMINATOR_INVALID' -or
              $Receipt.preparedRoles.Count -ne 0 -or
              $Receipt.physicalExecutionObserved -ne $false -or
              $Receipt.browserLaunched -ne $false -or
              $Receipt.modelDownloaded -ne $false -or
              $Receipt.inferenceExecuted -ne $false -or
              $Receipt.routeTerminalProduced -ne $false -or
              $Receipt.actualSupplierQualified -ne $false -or
              $Receipt.physicalEstateQualified -ne $false) {
            throw 'WRONG_DENOMINATOR_RECEIPT_INVALID'
          }

      - name: Emit body-free hosted qualification receipt
        shell: powershell
        run: |
          [ordered]@{
            schema = 'axm-private/issue105-final-host-preparation-hosted-qualification@1'
            status = 'PASS'
            sourceRef = 'sha256:' + (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\issue105-final-host-preparation-01.ps1') -Algorithm SHA256).Hash.ToLowerInvariant()
            powershellParsed = $true
            hostRolesExercised = @('W01', 'L01')
            missingArchiveHolds = 2
            wrongDenominatorHolds = 1
            physicalExecutionObserved = $false
            browserLaunched = $false
            supplierEndpointContacted = $false
            modelDownloaded = $false
            rangeShardsDownloaded = 0
            peerConnectionFormed = $false
            inferenceExecuted = $false
            routeTerminalProduced = $false
            actualSupplierQualified = $false
            physicalEstateQualified = $false
            missionAuthority = 'none'
            commandAuthority = 'none'
          } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'issue105-final-host-preparation-hosted-qualification.json') -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: issue105-final-host-preparation-hosted-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/issue105-final-host-preparation-hosted-qualification.json
          if-no-files-found: error
          retention-days: 14
