name: JOIN-v2 Canonical Base64url Repair Carrier

on:
  push:
    branches:
      - work/axm-head-physical-long-haul-join-v2-postflight-final
    paths:
      - ".github/workflows/join-v2-canonical-base64-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build intermediate and final repair bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import textwrap

          root = Path("mating_surface/anchor_node")
          verifier_path = root / "verify_axm_head_physical_long_haul_join.py"
          bootstrap_path = root / "axm_head_physical_long_haul_join.py"
          test_path = root / "conformance" / "test_axm_head_physical_long_haul_join.py"
          staging = Path(".join-v2-canonical-repair")
          staging.mkdir(exist_ok=False)

          verifier_original = verifier_path.read_text(encoding="utf-8")
          bootstrap_original = bootstrap_path.read_text(encoding="utf-8")
          test_original = test_path.read_text(encoding="utf-8")

          if verifier_original.count("import base64\n") != 1:
              raise SystemExit("base64 import denominator differs")
          verifier_with_import = verifier_original.replace(
              "import base64\n",
              "import base64\nimport binascii\n",
              1,
          )

          old_decode = '''def base64url_decode(value: str, label: str) -> bytes:
              require_string(value, label, BASE64URL, maximum=8192)
              padding = "=" * ((4 - len(value) % 4) % 4)
              try:
                  return base64.urlsafe_b64decode((value + padding).encode("ascii"))
              except (ValueError, UnicodeError) as exc:
                  fail("PROVENANCE_SIGNATURE_ENCODING_INVALID", f"{label}: {exc}")
          '''
          final_decode = '''def base64url_decode(value: str, label: str) -> bytes:
              require_string(value, label, BASE64URL, maximum=8192)
              padding = "=" * ((4 - len(value) % 4) % 4)
              try:
                  decoded = base64.urlsafe_b64decode((value + padding).encode("ascii"))
              except (binascii.Error, ValueError, UnicodeError) as exc:
                  fail("PROVENANCE_SIGNATURE_ENCODING_INVALID", f"{label}: {exc}")
              if base64url_encode(decoded) != value:
                  fail("PROVENANCE_SIGNATURE_ENCODING_INVALID", f"{label}: noncanonical base64url encoding")
              return decoded
          '''
          if verifier_with_import.count(old_decode) != 1:
              raise SystemExit("base64url decoder anchor differs")
          verifier_final = verifier_with_import.replace(old_decode, final_decode, 1)
          intermediate_decode = final_decode.replace(
              "    if base64url_encode(decoded) != value:\n",
              "    # Temporary repair-carrier marker; absent from the final tree.\n    if base64url_encode(decoded) != value:\n",
              1,
          )
          if intermediate_decode == final_decode:
              raise SystemExit("intermediate verifier marker was not inserted")
          verifier_intermediate = verifier_with_import.replace(old_decode, intermediate_decode, 1)
          if verifier_intermediate == verifier_final:
              raise SystemExit("intermediate and final verifier bytes collapsed")

          test_anchor = "        bad_key_value = {\n"
          test_block = '''noncanonical = copy.deepcopy(value)
          noncanonical_provenance = noncanonical["privateEvidenceProvenance"]
          canonical_signature = noncanonical_provenance["signatureBase64Url"]
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
          canonical_index = alphabet.index(canonical_signature[-1])
          self.assertEqual(canonical_index & 0x0F, 0)
          alias_signature = canonical_signature[:-1] + alphabet[canonical_index | 1]
          padding = "=" * ((4 - len(canonical_signature) % 4) % 4)
          self.assertEqual(
              mod.base64.urlsafe_b64decode((canonical_signature + padding).encode("ascii")),
              mod.base64.urlsafe_b64decode((alias_signature + padding).encode("ascii")),
          )
          noncanonical_provenance["signatureBase64Url"] = alias_signature
          noncanonical_provenance["provenanceId"] = mod.content_id(
              "axmheadprivateevidenceprovenance2",
              mod.body_without(noncanonical_provenance, "provenanceId"),
          )
          with self.assertRaises(mod.JoinError) as context:
              mod.validate_input_value(noncanonical)
          self.assertEqual(context.exception.code, "PROVENANCE_SIGNATURE_ENCODING_INVALID")
          '''
          if test_original.count(test_anchor) != 1:
              raise SystemExit("canonical-signature witness anchor differs")
          test_insertion = textwrap.indent(test_block, "        ") + "\n        bad_key_value = {\n"
          test_final = test_original.replace(test_anchor, test_insertion, 1)

          def verifier_sha(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          digest_pattern = re.compile(r'STANDALONE_VERIFIER_SHA256 = "[0-9a-f]{64}"')

          def bind_bootstrap(text: str, verifier_text: str) -> str:
              replacement = f'STANDALONE_VERIFIER_SHA256 = "{verifier_sha(verifier_text)}"'
              updated, count = digest_pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("bootstrap verifier-digest binding denominator differs")
              return updated

          bootstrap_intermediate = bind_bootstrap(bootstrap_original, verifier_intermediate)
          bootstrap_final = bind_bootstrap(bootstrap_original, verifier_final)

          verifier_path.write_text(verifier_intermediate, encoding="utf-8", newline="\n")
          bootstrap_path.write_text(bootstrap_intermediate, encoding="utf-8", newline="\n")
          test_path.write_text(test_final, encoding="utf-8", newline="\n")

          (staging / "final-verifier.py").write_text(verifier_final, encoding="utf-8", newline="\n")
          (staging / "final-bootstrap.py").write_text(bootstrap_final, encoding="utf-8", newline="\n")
          manifest = {
              "schema": "axm-head/join-v2-canonical-base64-repair-carrier@1",
              "parent": "4aa27860d5197a67e89a63bc4944efb3f709d07d",
              "finalVerifierSha256": verifier_sha(verifier_final),
              "intermediateVerifierSha256": verifier_sha(verifier_intermediate),
              "focusedMethodDenominator": 76,
              "physicalExecutionOccurred": False,
              "workersLaunched": 0,
              "listenersCreated": 0,
              "authority": "none",
          }
          if manifest["finalVerifierSha256"] == manifest["intermediateVerifierSha256"]:
              raise SystemExit("staged and final verifier digests must differ")
          (staging / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY

      - name: Qualify the intermediate carrier bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee /tmp/join-v2-repair-tests.txt
          grep -F "Ran 76 tests" /tmp/join-v2-repair-tests.txt
          grep -Fx "OK" /tmp/join-v2-repair-tests.txt

      - name: Commit and push the repair carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py \
            .join-v2-canonical-repair
          git diff --cached --check
          git commit -m "Stage canonical JOIN-v2 provenance encoding repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
