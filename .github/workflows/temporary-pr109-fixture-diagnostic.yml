name: TEMP PR109 fixture diagnostic

on:
  push:
    branches:
      - work/axm-head-browser-physical-audition-kit-layout-01
    paths:
      - .github/workflows/temporary-pr109-fixture-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/axm-head-browser-physical-audition-kit-layout-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expose the first fixture refusal after wrapper rebinding
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path

          root = Path("mating_surface/anchor_node")
          wrapper_path = root / "axm-head-browser-physical-audition-packet-01.ps1"
          profile_path = root / "axm-head-browser-physical-audition-packet-profile-01.json"
          source_path = root / "axm_head_browser_physical_audition_packet_01.py"

          original = wrapper_path.read_text(encoding="utf-8")
          old = "$Tool = Join-Path $ScriptRoot 'axm_head_browser_physical_audition_packet_01.py'\nif (-not (Test-Path -LiteralPath $Tool -PathType Leaf)) {\n    Write-Error \"Packet compiler unavailable: $Tool\"\n    exit 2\n}\n"
          new = "$ToolCandidates = @(\n    (Join-Path $ScriptRoot 'axm_head_browser_physical_audition_packet_01.py'),\n    (Join-Path (Join-Path $ScriptRoot 'source') 'axm_head_browser_physical_audition_packet_01.py')\n)\n$Tool = $null\nforeach ($CandidateTool in $ToolCandidates) {\n    if (Test-Path -LiteralPath $CandidateTool -PathType Leaf) {\n        $Tool = $CandidateTool\n        break\n    }\n}\nif ($null -eq $Tool) {\n    Write-Error \"Packet compiler unavailable at repository or generated-kit coordinate: $($ToolCandidates -join ', ')\"\n    exit 2\n}\n"
          if original.count(old) != 1:
              raise SystemExit(f"wrapper anchor count={original.count(old)}")
          wrapper = original.replace(old, new, 1)
          wrapper_path.write_text(wrapper, encoding="utf-8", newline="\n")

          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          rows = [row for row in profile["packetSourceBindings"] if row["path"] == wrapper_path.name]
          if len(rows) != 1:
              raise SystemExit(f"wrapper binding denominator={len(rows)}")
          data = wrapper_path.read_bytes()
          rows[0]["bytes"] = len(data)
          rows[0]["sha256"] = "sha256:" + hashlib.sha256(data).hexdigest()
          profile_path.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")

          source = source_path.read_text(encoding="utf-8")
          old_handler = '        except PacketError as exc:\n            terminal = "REFUSED"\n            reasons = [exc.code]\n'
          new_handler = '        except PacketError as exc:\n            print(f"FIXTURE_DIAGNOSTIC case={row[\\"caseId\\"]} code={exc.code} message={exc.message}", file=sys.stderr)\n            terminal = "REFUSED"\n            reasons = [exc.code]\n'
          if source.count(old_handler) != 1:
              raise SystemExit(f"fixture handler count={source.count(old_handler)}")
          source_path.write_text(source.replace(old_handler, new_handler, 1), encoding="utf-8", newline="\n")
          '@ | python -

          $Root = Join-Path $env:GITHUB_WORKSPACE 'mating_surface\anchor_node'
          $Wrapper = Join-Path $Root 'axm-head-browser-physical-audition-packet-01.ps1'
          $Profile = Join-Path $Root 'axm-head-browser-physical-audition-packet-profile-01.json'
          $Fixtures = Join-Path $Root 'fixtures\axm-head-browser-physical-audition-packet-cases-01.json'
          & $Wrapper 'campaign' $Profile $Fixtures
          exit 0
