name: TEMP cleanup STC MARY cartridge post-merge

on:
  push:
    branches:
      - fix/stc-mary-cartridge-post-merge-cleanup-01
    paths:
      - ".github/workflows/temp-cleanup-stc-mary-cartridge-post-merge-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-cleanup-stc-mary-cartridge-post-merge-01
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact cleanup branch
        uses: actions/checkout@v6
        with:
          ref: fix/stc-mary-cartridge-post-merge-cleanup-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Repair the Windows junction witness and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_helper = '["cmd.exe", "/d", "/c", f\'mklink /J "{link}" "{target}"\'],'
          new_helper = '["cmd.exe", "/d", "/c", "mklink", "/J", str(link), str(target)],'
          if test_text.count(old_helper) != 1:
              raise SystemExit(f'junction helper anchor differs: {test_text.count(old_helper)}')
          test_path.write_text(test_text.replace(old_helper, new_helper, 1), encoding='utf-8', newline='\n')

          doc_path = Path('mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md')
          doc_text = doc_path.read_text(encoding='utf-8')
          old_doc = (
              'The verifier walks the cartridge tree without following links. A symlink or junction at the root, '
              'in any expected directory, or at any member path is refused before classification or reading, and '
              'traversal never descends through the linked entry. Every authoritative member, including '
              '`MANIFEST.json`, is limited to 1 MiB and read through a bounded `maximum + 1` operation after a '
              'size precondition. The embedded verifier retains its stricter exact-size, exact-digest, measured-byte, '
              'and stored-member binding.'
          )
          new_doc = (
              'The verifier walks the cartridge tree without following links. A symlink or junction at the root, '
              'in any expected directory, or at any member path is refused before classification or reading, and '
              'traversal never descends through the linked entry. The Windows hostile witnesses construct actual '
              'directory junctions through native `mklink /J`, then exercise cartridge roots, linked ancestors, linked '
              'internal members, build destinations, verdict outputs, and projection outputs against those junctions. '
              'Every authoritative member, including `MANIFEST.json`, is limited to 1 MiB and read through a bounded '
              '`maximum + 1` operation after a size precondition. The embedded verifier retains its stricter exact-size, '
              'exact-digest, measured-byte, and stored-member binding.'
          )
          if doc_text.count(old_doc) != 1:
              raise SystemExit(f'documentation anchor differs: {doc_text.count(old_doc)}')
          doc_path.write_text(doc_text.replace(old_doc, new_doc, 1), encoding='utf-8', newline='\n')
          PY

      - name: Qualify the repaired source locally
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge.py \
            mating_surface/anchor_node/verify_stc_mary_flight_01_cartridge_bootstrap.py \
            mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_01_cartridge.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'Ran 25 tests' "$RUNNER_TEMP/cartridge-tests.txt"
          grep -F 'OK' "$RUNNER_TEMP/cartridge-tests.txt"
          git diff --check

      - name: Commit the bounded cleanup product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm .github/workflows/temp-cleanup-stc-mary-cartridge-post-merge-01.yml
          rm .github/workflows/temp-fix-pr73-windows-junction-witness.yml

          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/temp-fix-pr73-windows-junction-witness.yml',
              'mating_surface/anchor_node/STC-MARY-FLIGHT-01-CARTRIDGE-01.md',
              'mating_surface/anchor_node/conformance/test_stc_mary_flight_01_cartridge.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', '8b72a20fdab38c1a5dbc0c9e2d28adbd66076b40'],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'cleanup path denominator differs: expected={sorted(expected)} observed={sorted(actual)}'
              )
          PY

          git commit -m 'Remove post-merge carrier and repair Windows junction witness'
          git push origin HEAD:refs/heads/fix/stc-mary-cartridge-post-merge-cleanup-01
