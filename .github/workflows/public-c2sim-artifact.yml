name: Public C2SIM reference artifact qualification

on:
  pull_request:
    paths:
      - "mating_surface/artifacts/**"
      - "mating_surface/core/artifacts.mjs"
      - "mating_surface/tools/xml_wellformedness.mjs"
      - "mating_surface/tools/xsd11_catalog.py"
      - "mating_surface/tools/requirements-xsd11.txt"
      - "mating_surface/conformance/artifacts.test.mjs"
      - "mating_surface/conformance/test_xsd11_catalog.py"
      - "mating_surface/test_hosts/**"
      - "mating_surface/semantic/**"
      - ".github/workflows/public-c2sim-artifact.yml"
  push:
    branches:
      - main
    paths:
      - "mating_surface/artifacts/**"
      - "mating_surface/core/artifacts.mjs"
      - "mating_surface/tools/xml_wellformedness.mjs"
      - "mating_surface/tools/xsd11_catalog.py"
      - "mating_surface/tools/requirements-xsd11.txt"
      - "mating_surface/conformance/artifacts.test.mjs"
      - "mating_surface/conformance/test_xsd11_catalog.py"
      - "mating_surface/test_hosts/**"
      - "mating_surface/semantic/**"
      - ".github/workflows/public-c2sim-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-c2sim-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-public-reference-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out the mating-surface estate
        uses: actions/checkout@v6

      - name: Check out only the pinned OpenC2SIM reference artifact
        uses: actions/checkout@v6
        with:
          repository: OpenC2SIM/OpenC2SIM.github.io
          ref: ca1efa3cb23d35eef80f31d87ca189de44eb99fd
          path: upstream-c2sim
          persist-credentials: false
          filter: blob:none
          sparse-checkout: C2SIM_SMX_LOX_V1.0.1.xsd
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mating_surface/tools/requirements-xsd11.txt

      - name: Install the bounded XML and XSD 1.1 validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          python -m pip install --require-hashes --only-binary=:all: \
            -r mating_surface/tools/requirements-xsd11.txt

      - name: Run artifact custody and use-boundary tests
        run: node --test mating_surface/conformance/artifacts.test.mjs

      - name: Run deterministic XSD 1.1 catalog tests
        run: python -m unittest mating_surface.conformance.test_xsd11_catalog -v

      - name: Run standards-port fault-machine and verifier tests
        run: node --test mating_surface/test_hosts/conformance/*.test.mjs

      - name: Run C2SIM semantic compiler tests
        run: python -m unittest mating_surface.semantic.conformance.test_c2sim_semantic -v

      - name: Run semantic authority-sidecar tests
        run: node --test mating_surface/semantic/conformance/*.test.mjs

      - name: Refuse an unexpected upstream commit or Git blob
        run: |
          test "$(git -C upstream-c2sim rev-parse HEAD)" = "ca1efa3cb23d35eef80f31d87ca189de44eb99fd"
          test "$(git -C upstream-c2sim hash-object C2SIM_SMX_LOX_V1.0.1.xsd)" = "3d82674d83fd679be0c9e4c05a09d49d16b6fbb9"

      - name: Produce a network-disabled XML well-formedness receipt
        run: |
          mkdir -p qualification/c2sim-public-reference
          node mating_surface/tools/xml_wellformedness.mjs \
            upstream-c2sim/C2SIM_SMX_LOX_V1.0.1.xsd \
            qualification/c2sim-public-reference/xml-wellformedness.json

      - name: Admit the exact artifact for rehearsal only
        run: |
          node mating_surface/core/artifacts.mjs \
            mating_surface/standards/registry.json \
            mating_surface/venues/joint-edge-command-authority.json \
            mating_surface/artifacts/public-reference/c2sim-v1.0.1.json \
            upstream-c2sim/C2SIM_SMX_LOX_V1.0.1.xsd \
            qualification/c2sim-public-reference/xml-wellformedness.json \
            mating_surface/artifacts/public-reference/c2sim-rehearsal-use.json \
            qualification/c2sim-public-reference/artifact-transaction.json

      - name: Compile the exact admitted XSD with XMLSchema11
        run: |
          python mating_surface/tools/xsd11_catalog.py \
            upstream-c2sim/C2SIM_SMX_LOX_V1.0.1.xsd \
            qualification/c2sim-public-reference/artifact-transaction.json \
            qualification/c2sim-public-reference/xsd11-catalog.json

      - name: Exercise the admitted artifact through the payload-opaque fault machine
        run: |
          node mating_surface/test_hosts/run_fault_machine_e2e.mjs \
            qualification/c2sim-public-reference/artifact-transaction.json \
            qualification/c2sim-public-reference/xsd11-catalog.json \
            qualification/c2sim-public-reference/standard-port-fault-machine

      - name: Reverify the retained transport run through the detached CLI
        run: |
          node mating_surface/test_hosts/core/fault_verifier.mjs \
            qualification/c2sim-public-reference/standard-port-fault-machine/fault-run.json \
            qualification/c2sim-public-reference/standard-port-fault-machine/test-frame.json \
            qualification/c2sim-public-reference/standard-port-fault-machine/verification-cli.json
          cmp \
            qualification/c2sim-public-reference/standard-port-fault-machine/verification.json \
            qualification/c2sim-public-reference/standard-port-fault-machine/verification-cli.json

      - name: Compile and validate the standards-native C2SIM conversation
        run: |
          python mating_surface/semantic/c2sim_semantic.py \
            upstream-c2sim/C2SIM_SMX_LOX_V1.0.1.xsd \
            qualification/c2sim-public-reference/artifact-transaction.json \
            qualification/c2sim-public-reference/xsd11-catalog.json \
            qualification/c2sim-public-reference/semantic-conversation

      - name: Run partition, replay, and reconciliation over the semantic conversation
        run: |
          node mating_surface/semantic/run_semantic_rehearsal.mjs \
            qualification/c2sim-public-reference/semantic-conversation \
            qualification/c2sim-public-reference/artifact-transaction.json \
            qualification/c2sim-public-reference/xsd11-catalog.json \
            qualification/c2sim-public-reference/semantic-rehearsal

      - name: Reverify the complete semantic rehearsal detached
        run: |
          node mating_surface/semantic/verify_semantic_rehearsal.mjs \
            qualification/c2sim-public-reference/semantic-conversation \
            qualification/c2sim-public-reference/semantic-rehearsal \
            qualification/c2sim-public-reference/semantic-rehearsal-verification.json

      - name: Prove altered XML and host state are refused
        run: |
          cp -R \
            qualification/c2sim-public-reference/semantic-conversation \
            qualification/c2sim-public-reference/semantic-conversation-tampered
          printf ' ' >> \
            qualification/c2sim-public-reference/semantic-conversation-tampered/messages/03-order.xml
          if node mating_surface/semantic/verify_semantic_rehearsal.mjs \
            qualification/c2sim-public-reference/semantic-conversation-tampered \
            qualification/c2sim-public-reference/semantic-rehearsal \
            qualification/c2sim-public-reference/tampered-xml-verification.json; then
            echo "tampered XML was incorrectly accepted" >&2
            exit 1
          fi
          grep -q '"status": "refuse"' \
            qualification/c2sim-public-reference/tampered-xml-verification.json

          cp -R \
            qualification/c2sim-public-reference/semantic-rehearsal \
            qualification/c2sim-public-reference/semantic-rehearsal-tampered
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('qualification/c2sim-public-reference/semantic-rehearsal-tampered/semantic-host-frame.json')
          value = json.loads(path.read_text())
          value['messages']['receiverAccepted'] = 99
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
          if node mating_surface/semantic/verify_semantic_rehearsal.mjs \
            qualification/c2sim-public-reference/semantic-conversation \
            qualification/c2sim-public-reference/semantic-rehearsal-tampered \
            qualification/c2sim-public-reference/tampered-host-verification.json; then
            echo "tampered host frame was incorrectly accepted" >&2
            exit 1
          fi
          grep -q '"status": "refuse"' \
            qualification/c2sim-public-reference/tampered-host-verification.json

      - name: Retain artifact, schema, transport, and semantic rehearsal evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-c2sim-reference-artifact-qualification
          path: qualification/c2sim-public-reference
          if-no-files-found: error
