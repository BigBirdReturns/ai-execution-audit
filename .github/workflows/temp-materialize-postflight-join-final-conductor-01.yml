name: TEMP materialize postflight JOIN final conductor

on:
  push:
    branches:
      - work/axm-head-postflight-join-final-conductor-01
    paths:
      - ".github/workflows/temp-materialize-postflight-join-final-conductor-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-materialize-postflight-join-final-conductor-01
  cancel-in-progress: false

env:
  SOURCE_COMMIT: a892adeea478afcae3b9fa86bd86d6afb5a228e1
  BASE_COMMIT: dd486472a8c610a20ee062dd6746c86fe8ede4b4

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-postflight-join-final-conductor-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Materialize prior qualified JOIN source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          paths=(
            '.github/workflows/axm-head-physical-long-haul-join-01.yml'
            'mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md'
            'mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json'
            'mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1'
            'mating_surface/anchor_node/axm_head_physical_long_haul_join.py'
            'mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py'
            'mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py'
            'mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json'
          )
          for relative in "${paths[@]}"; do
            mkdir -p "$(dirname "$relative")"
            git cat-file blob "$SOURCE_COMMIT:$relative" > "$relative"
          done

      - name: Rebind exact active conductor and predecessor lineage
        shell: bash
        run: |
          python -m py_compile .join-repair/repair.py
          python .join-repair/repair.py | tee "$RUNNER_TEMP/repair.json"

      - name: Qualify repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mating_surface/anchor_node/axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py \
            mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py
          python mating_surface/anchor_node/axm_head_physical_long_haul_join.py validate-profile \
            mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/join-tests.txt"
          grep -F 'Ran 81 tests' "$RUNNER_TEMP/join-tests.txt"
          grep -F 'OK' "$RUNNER_TEMP/join-tests.txt"
          git diff --check

      - name: Commit only the permanent eight-path JOIN product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf \
            .join-repair \
            .github/workflows/temp-materialize-postflight-join-final-conductor-01.yml
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/axm-head-physical-long-haul-join-01.yml',
              'mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md',
              'mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json',
              'mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1',
              'mating_surface/anchor_node/axm_head_physical_long_haul_join.py',
              'mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py',
              'mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py',
              'mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'dd486472a8c610a20ee062dd6746c86fe8ede4b4'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'final path denominator differs: expected={sorted(expected)} observed={sorted(actual)}')
          PY
          git commit -m 'Rebind postflight JOIN to bounded conductor lineage'
          git push origin HEAD:refs/heads/work/axm-head-postflight-join-final-conductor-01
