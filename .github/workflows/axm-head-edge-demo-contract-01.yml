name: Close AXM HEAD cartridge and verdict custody

on:
  push:
    branches:
      - work/axm-head-edge-demo-contract-01
    paths:
      - ".github/workflows/axm-head-edge-demo-contract-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-axm-head-final-custody
  cancel-in-progress: false

jobs:
  repair-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-edge-demo-contract-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bind cartridge law and protect verdict output custody
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('mating_surface/anchor_node')
          builder_path = root / 'axm_head_edge_demo.py'
          verifier_path = root / 'verify_axm_head_volume.py'
          bootstrap_path = root / 'verify_axm_head_bootstrap.py'
          tests_path = root / 'conformance' / 'test_axm_head_edge_demo.py'
          fixtures_path = root / 'fixtures' / 'axm-head-edge-demo-cases-01.json'
          contract_path = root / 'AXM-HEAD-EDGE-DEMO-CONTRACT-01.md'
          review_path = root / 'AXM-HEAD-EDGE-DEMO-SEMANTIC-CLOSURE-REVIEW.md'

          expected_source_sha256 = {
              builder_path: 'adbe5f465621013d4d0a7eb2c46f78a96b1bc0c108098097341cf064c21afe0a',
              verifier_path: 'ef68da907bd5c196a3a10c2874dae20c42cdb547ba14030a968e99d866ee3542',
              bootstrap_path: '15be7b7e2c0885bc9efe515ef6c6152e38d22688144f1a62a73c63b7cd994165',
              tests_path: '88033019fdffeb7fcd22f88dc46409be49b427f5790b5c05c7d26fe966ced45d',
              fixtures_path: 'a212676c2d54e62d32472de6b26a337d7ba584320eca8bdafa79914608148ace',
              contract_path: '6701402fc69bed3f00ced1c2104964d55f54e6f7365662161c2324b84e84008d',
          }
          for path, expected in expected_source_sha256.items():
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f'predecessor source identity differs: {path} expected={expected} observed={observed}')

          def canonical_json_bytes(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False) + '\n').encode('utf-8')

          def pretty_json_bytes(value):
              return (json.dumps(value, sort_keys=True, indent=2, ensure_ascii=False, allow_nan=False) + '\n').encode('utf-8')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          helper_anchor = '''def content_id(prefix: str, body: dict[str, Any]) -> str:
              return f"{prefix}_{sha256_bytes(canonical_json_bytes(body))}"


          def read_json'''.replace('          ', '')
          helper_block = '''def content_id(prefix: str, body: dict[str, Any]) -> str:
              return f"{prefix}_{sha256_bytes(canonical_json_bytes(body))}"


          def cartridge_law_body(mission: dict[str, Any]) -> dict[str, Any]:
              return {
                  "schema": CARTRIDGE_SCHEMA,
                  "profileId": PROFILE_ID,
                  "missionId": mission["missionId"],
                  "cartridgeId": mission["cartridgeId"],
                  "invariantRefs": mission["invariantRefs"],
                  "humanAuthority": mission["humanAuthority"],
                  "systemAuthority": "none",
                  "claimBoundary": CARTRIDGE_CLAIM_BOUNDARY,
              }


          def cartridge_law_sha256(mission: dict[str, Any]) -> str:
              return sha256_bytes(canonical_json_bytes(cartridge_law_body(mission)))


          def read_json'''.replace('          ', '')
          replace_once(builder_path, helper_anchor, helper_block)
          replace_once(verifier_path, helper_anchor, helper_block)

          builder_mission_tail = '''    require_string(authority["actionClass"], f"{label}.humanAuthority.actionClass", pattern=ID_RE)
              return value
          '''.replace('          ', '')
          builder_mission_repair = '''    require_string(authority["actionClass"], f"{label}.humanAuthority.actionClass", pattern=ID_RE)
              expected_cartridge_sha256 = cartridge_law_sha256(value)
              if value["cartridgeSha256"] != expected_cartridge_sha256:
                  fail("CARTRIDGE_LAW_DIGEST_INVALID", f"{label}.cartridgeSha256 does not bind the canonical cartridge law")
              return value
          '''.replace('          ', '')
          replace_once(builder_path, builder_mission_tail, builder_mission_repair)

          verifier_mission_tail = '''    string(authority["actionClass"], f"{label}.humanAuthority.actionClass", ID_RE)
              return value


          def validate_task'''.replace('          ', '')
          verifier_mission_repair = '''    string(authority["actionClass"], f"{label}.humanAuthority.actionClass", ID_RE)
              expected_cartridge_sha256 = cartridge_law_sha256(value)
              if value["cartridgeSha256"] != expected_cartridge_sha256:
                  fail("CARTRIDGE_LAW_DIGEST_INVALID", f"{label}.cartridgeSha256 does not bind the canonical cartridge law")
              return value


          def validate_cartridge(value: Any, label: str) -> dict[str, Any]:
              if not isinstance(value, dict):
                  fail("CARTRIDGE_INVALID", f"{label} must be an object")
              exact(
                  value,
                  {
                      "schema",
                      "profileId",
                      "missionId",
                      "cartridgeId",
                      "cartridgeSha256",
                      "invariantRefs",
                      "humanAuthority",
                      "systemAuthority",
                      "claimBoundary",
                  },
                  label,
              )
              if value["schema"] != CARTRIDGE_SCHEMA or value["profileId"] != PROFILE_ID:
                  fail("CARTRIDGE_IDENTITY_INVALID", f"{label} schema or profileId differs")
              string(value["missionId"], f"{label}.missionId", ID_RE)
              string(value["cartridgeId"], f"{label}.cartridgeId", ID_RE)
              string(value["cartridgeSha256"], f"{label}.cartridgeSha256", HEX64)
              string_list(value["invariantRefs"], f"{label}.invariantRefs", True)
              authority = value["humanAuthority"]
              if not isinstance(authority, dict):
                  fail("HUMAN_AUTHORITY_INVALID", f"{label}.humanAuthority must be an object")
              exact(authority, {"actorId", "required", "actionClass"}, f"{label}.humanAuthority")
              string(authority["actorId"], f"{label}.humanAuthority.actorId", ID_RE)
              boolean(authority["required"], f"{label}.humanAuthority.required")
              string(authority["actionClass"], f"{label}.humanAuthority.actionClass", ID_RE)
              if value["systemAuthority"] != "none":
                  fail("CARTRIDGE_AUTHORITY_INVALID", f"{label} may not claim system authority")
              if value["claimBoundary"] != CARTRIDGE_CLAIM_BOUNDARY:
                  fail("CARTRIDGE_CLAIM_BOUNDARY_INVALID", f"{label} claim boundary differs")
              if value["cartridgeSha256"] != cartridge_law_sha256(value):
                  fail("CARTRIDGE_LAW_DIGEST_INVALID", f"{label}.cartridgeSha256 does not bind the canonical cartridge law")
              return value


          def validate_task'''.replace('          ', '')
          replace_once(verifier_path, verifier_mission_tail, verifier_mission_repair)

          old_builder_cartridge = '''    cartridge = {
                  "schema": CARTRIDGE_SCHEMA,
                  "profileId": profile["profileId"],
                  "missionId": mission["missionId"],
                  "cartridgeId": mission["cartridgeId"],
                  "cartridgeSha256": mission["cartridgeSha256"],
                  "invariantRefs": mission["invariantRefs"],
                  "humanAuthority": mission["humanAuthority"],
                  "systemAuthority": "none",
                  "claimBoundary": CARTRIDGE_CLAIM_BOUNDARY,
              }
          '''.replace('          ', '')
          new_builder_cartridge = '''    cartridge = {
                  **cartridge_law_body(mission),
                  "cartridgeSha256": mission["cartridgeSha256"],
              }
          '''.replace('          ', '')
          replace_once(builder_path, old_builder_cartridge, new_builder_cartridge)

          old_verifier_cartridge = '''def make_cartridge(case: dict[str, Any]) -> dict[str, Any]:
              mission = case["mission"]
              return {
                  "schema": CARTRIDGE_SCHEMA,
                  "profileId": PROFILE_ID,
                  "missionId": mission["missionId"],
                  "cartridgeId": mission["cartridgeId"],
                  "cartridgeSha256": mission["cartridgeSha256"],
                  "invariantRefs": mission["invariantRefs"],
                  "humanAuthority": mission["humanAuthority"],
                  "systemAuthority": "none",
                  "claimBoundary": CARTRIDGE_CLAIM_BOUNDARY,
              }
          '''.replace('          ', '')
          new_verifier_cartridge = '''def make_cartridge(case: dict[str, Any]) -> dict[str, Any]:
              mission = case["mission"]
              return {
                  **cartridge_law_body(mission),
                  "cartridgeSha256": mission["cartridgeSha256"],
              }
          '''.replace('          ', '')
          replace_once(verifier_path, old_verifier_cartridge, new_verifier_cartridge)

          actual_cartridge_anchor = '''    actual_cartridge = read_json(root / "CARTRIDGE/mission.json")
              actual_work_unit = read_json(root / "CARTRIDGE/work-unit.json")
          '''.replace('          ', '')
          actual_cartridge_repair = '''    actual_cartridge = read_json(root / "CARTRIDGE/mission.json")
              validate_cartridge(actual_cartridge, "cartridge")
              actual_work_unit = read_json(root / "CARTRIDGE/work-unit.json")
          '''.replace('          ', '')
          replace_once(verifier_path, actual_cartridge_anchor, actual_cartridge_repair)

          output_helper_anchor = '''def validate_profile(profile: dict[str, Any]) -> None:
          '''
          output_helper_block = '''def output_path_overlaps_volume(volume: Path, out: Path) -> bool:
              root = volume.expanduser().resolve(strict=False)
              candidate = out.expanduser().resolve(strict=False)
              if candidate == root or root in candidate.parents:
                  return True
              if out.exists() and root.is_dir():
                  for member in root.rglob("*"):
                      if not member.is_file():
                          continue
                      try:
                          if out.samefile(member):
                              return True
                      except OSError:
                          continue
              return False


          def require_output_outside_volume(volume: Path, out: Path) -> None:
              if output_path_overlaps_volume(volume, out):
                  fail("OUTPUT_INSIDE_VOLUME", "verdict output must remain outside the verified volume")


          def validate_profile(profile: dict[str, Any]) -> None:
          '''.replace('          ', '')
          replace_once(verifier_path, output_helper_anchor, output_helper_block)

          old_verifier_main = '''    try:
                  verdict = verify_volume(args.volume)
                  data = pretty_json_bytes(verdict)
                  if args.out:
                      args.out.parent.mkdir(parents=True, exist_ok=True)
                      args.out.write_bytes(data)
                  sys.stdout.buffer.write(data)
                  return 0
              except VerifyError as exc:
                  verdict = {"schema": VERDICT_SCHEMA, "status": "REFUSED", "code": exc.code, "message": str(exc)}
                  data = pretty_json_bytes(verdict)
                  if args.out:
                      args.out.parent.mkdir(parents=True, exist_ok=True)
                      args.out.write_bytes(data)
                  sys.stdout.buffer.write(data)
                  return 2
          '''.replace('          ', '')
          new_verifier_main = '''    safe_out = args.out
              try:
                  if safe_out is not None:
                      require_output_outside_volume(args.volume, safe_out)
                  verdict = verify_volume(args.volume)
                  data = pretty_json_bytes(verdict)
                  if safe_out is not None:
                      safe_out.parent.mkdir(parents=True, exist_ok=True)
                      safe_out.write_bytes(data)
                  sys.stdout.buffer.write(data)
                  return 0
              except VerifyError as exc:
                  if exc.code == "OUTPUT_INSIDE_VOLUME":
                      safe_out = None
                  verdict = {"schema": VERDICT_SCHEMA, "status": "REFUSED", "code": exc.code, "message": str(exc)}
                  data = pretty_json_bytes(verdict)
                  if safe_out is not None:
                      safe_out.parent.mkdir(parents=True, exist_ok=True)
                      safe_out.write_bytes(data)
                  sys.stdout.buffer.write(data)
                  return 2
          '''.replace('          ', '')
          replace_once(verifier_path, old_verifier_main, new_verifier_main)

          bootstrap_helper_anchor = '''def emit(value: dict[str, Any], out: Path | None) -> int:
          '''
          bootstrap_helper_block = '''def output_path_overlaps_volume(volume: Path, out: Path) -> bool:
              root = volume.expanduser().resolve(strict=False)
              candidate = out.expanduser().resolve(strict=False)
              if candidate == root or root in candidate.parents:
                  return True
              if out.exists() and root.is_dir():
                  for member in root.rglob("*"):
                      if not member.is_file():
                          continue
                      try:
                          if out.samefile(member):
                              return True
                      except OSError:
                          continue
              return False


          def emit(value: dict[str, Any], out: Path | None) -> int:
          '''.replace('          ', '')
          replace_once(bootstrap_path, bootstrap_helper_anchor, bootstrap_helper_block)

          bootstrap_main_anchor = '''    args = parser.parse_args(argv)
              verifier = args.volume / "RECOVERY" / "verify_volume.py"
          '''.replace('          ', '')
          bootstrap_main_repair = '''    args = parser.parse_args(argv)
              if args.out is not None and output_path_overlaps_volume(args.volume, args.out):
                  return emit(
                      {
                          "schema": VERDICT_SCHEMA,
                          "status": "REFUSED",
                          "code": "OUTPUT_INSIDE_VOLUME",
                          "message": "verdict output must remain outside the verified volume",
                          "bootstrapAuthenticated": False,
                      },
                      None,
                  )
              verifier = args.volume / "RECOVERY" / "verify_volume.py"
          '''.replace('          ', '')
          replace_once(bootstrap_path, bootstrap_main_anchor, bootstrap_main_repair)

          catalog = json.loads(fixtures_path.read_text(encoding='utf-8'))
          for case in catalog['cases']:
              mission = case['mission']
              law = {
                  'schema': 'axm-head/cartridge@1',
                  'profileId': 'axm-head/edge-demo/0.1',
                  'missionId': mission['missionId'],
                  'cartridgeId': mission['cartridgeId'],
                  'invariantRefs': mission['invariantRefs'],
                  'humanAuthority': mission['humanAuthority'],
                  'systemAuthority': 'none',
                  'claimBoundary': 'Immutable mission law, invariants, and human-authority boundary only; no execution authority.',
              }
              mission['cartridgeSha256'] = hashlib.sha256(canonical_json_bytes(law)).hexdigest()
          fixtures_path.write_bytes(pretty_json_bytes(catalog))
          catalog_digest = hashlib.sha256(canonical_json_bytes(catalog)).hexdigest()

          for path in (builder_path, verifier_path):
              replace_once(
                  path,
                  'FIXTURE_CATALOG_CANONICAL_SHA256 = "47e34302c415511aa2f9adbf112fe189246ee262c79fccb2036ffb5b21b9612f"',
                  f'FIXTURE_CATALOG_CANONICAL_SHA256 = "{catalog_digest}"',
              )

          law_test_anchor = '''    def test_each_supplier_coordinate_mutation_is_refused_by_builder(self) -> None:
          '''
          law_tests = '''    def test_cartridge_digest_is_derived_from_canonical_mission_law(self) -> None:
                  for case in self.catalog["cases"]:
                      self.assertEqual(case["mission"]["cartridgeSha256"], mod.cartridge_law_sha256(case["mission"]))
                  attacks = (
                      ("invariant", lambda mission: mission["invariantRefs"].append("invariant:forged@1")),
                      ("actor", lambda mission: mission["humanAuthority"].update({"actorId": "autonomous-system"})),
                  )
                  for label, mutate in attacks:
                      with self.subTest(label=label):
                          case = self.case(mod.CASE_IDS[0])
                          mutate(case["mission"])
                          with self.assertRaises(mod.DemoError) as context:
                              mod.decide_case(case, self.profile)
                          self.assertEqual(context.exception.code, "CARTRIDGE_LAW_DIGEST_INVALID")

              def test_each_supplier_coordinate_mutation_is_refused_by_builder(self) -> None:
          '''.replace('              ', '    ')
          replace_once(tests_path, law_test_anchor, law_tests)

          cartridge_forgery_anchor = '''    def test_cartridge_claim_boundary_forgery_is_refused_after_resigning(self) -> None:
          '''
          cartridge_forgery_test = '''    def test_resigned_cartridge_law_forgery_is_refused(self) -> None:
                  attacks = (
                      ("invariant", lambda cartridge: cartridge["invariantRefs"].append("invariant:forged@1")),
                      ("actor", lambda cartridge: cartridge["humanAuthority"].update({"actorId": "autonomous-system"})),
                  )
                  for index, (label, mutate) in enumerate(attacks):
                      with self.subTest(label=label):
                          volume = self.build(mod.CASE_IDS[0], f"cartridge-law-{index}")
                          path = volume / "CARTRIDGE/mission.json"
                          cartridge = json.loads(path.read_text(encoding="utf-8"))
                          mutate(cartridge)
                          path.write_bytes(mod.pretty_json_bytes(cartridge))
                          self.rewrite_manifest(volume, relatives=["CARTRIDGE/mission.json"])
                          code, verdict, _, _ = self.bootstrap(volume, self.root / f"cartridge-law-foreign-{index}")
                          self.assertEqual(code, 2)
                          self.assertEqual(verdict["code"], "CARTRIDGE_LAW_DIGEST_INVALID")

              def test_cartridge_claim_boundary_forgery_is_refused_after_resigning(self) -> None:
          '''.replace('              ', '    ')
          replace_once(tests_path, cartridge_forgery_anchor, cartridge_forgery_test)

          output_test_anchor = '''    def test_bootstrap_verdict_file_is_canonical_lf_utf8(self) -> None:
          '''
          output_test = '''    def test_verdict_output_inside_volume_is_refused_without_mutation(self) -> None:
                  for index, entrypoint in enumerate(("bootstrap", "direct")):
                      with self.subTest(entrypoint=entrypoint):
                          volume = self.build(mod.CASE_IDS[0], f"output-volume-{index}")
                          before = {
                              path.relative_to(volume).as_posix(): path.read_bytes()
                              for path in volume.rglob("*")
                              if path.is_file()
                          }
                          out = volume / "PUBLIC" / f"{entrypoint}-verdict.json"
                          if entrypoint == "bootstrap":
                              code, verdict, _, stderr = self.bootstrap(
                                  volume,
                                  self.root / f"output-foreign-{index}",
                                  out,
                              )
                          else:
                              foreign = self.root / f"output-foreign-{index}"
                              foreign.mkdir()
                              result = subprocess.run(
                                  [
                                      sys.executable,
                                      str(volume / "RECOVERY" / "verify_volume.py"),
                                      str(volume),
                                      "--out",
                                      str(out),
                                  ],
                                  cwd=foreign,
                                  stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE,
                                  check=False,
                              )
                              code = result.returncode
                              verdict = json.loads(result.stdout.decode("utf-8"))
                              stderr = result.stderr
                          self.assertEqual(code, 2)
                          self.assertEqual(stderr, b"")
                          self.assertEqual(verdict["code"], "OUTPUT_INSIDE_VOLUME")
                          self.assertFalse(out.exists())
                          after = {
                              path.relative_to(volume).as_posix(): path.read_bytes()
                              for path in volume.rglob("*")
                              if path.is_file()
                          }
                          self.assertEqual(after, before)

              def test_bootstrap_verdict_file_is_canonical_lf_utf8(self) -> None:
          '''.replace('              ', '    ')
          replace_once(tests_path, output_test_anchor, output_test)

          verifier_sha256 = hashlib.sha256(verifier_path.read_bytes()).hexdigest()
          replace_once(
              builder_path,
              'STANDALONE_VERIFIER_SHA256 = "ef68da907bd5c196a3a10c2874dae20c42cdb547ba14030a968e99d866ee3542"',
              f'STANDALONE_VERIFIER_SHA256 = "{verifier_sha256}"',
          )
          replace_once(
              bootstrap_path,
              'EXPECTED_VERIFIER_SHA256 = "ef68da907bd5c196a3a10c2874dae20c42cdb547ba14030a968e99d866ee3542"',
              f'EXPECTED_VERIFIER_SHA256 = "{verifier_sha256}"',
          )
          bootstrap_sha256 = hashlib.sha256(bootstrap_path.read_bytes()).hexdigest()

          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace(
              'fixture catalog canonical SHA-256\n47e34302c415511aa2f9adbf112fe189246ee262c79fccb2036ffb5b21b9612f',
              f'fixture catalog canonical SHA-256\n{catalog_digest}',
          )
          contract = contract.replace(
              'embedded standalone verifier SHA-256\nef68da907bd5c196a3a10c2874dae20c42cdb547ba14030a968e99d866ee3542',
              f'embedded standalone verifier SHA-256\n{verifier_sha256}',
          )
          contract = contract.replace(
              'external bootstrap SHA-256\n15be7b7e2c0885bc9efe515ef6c6152e38d22688144f1a62a73c63b7cd994165',
              f'external bootstrap SHA-256\n{bootstrap_sha256}',
          )
          contract = contract.replace('The thirty-five-witness conformance suite', 'The thirty-eight-witness conformance suite')
          contract = contract.replace(
              'The exact public claim boundary and the distinct cartridge claim boundary are frozen constants.',
              'The declared `cartridgeSha256` is the SHA-256 of the canonical immutable law body: schema, profile, mission and cartridge identities, invariant references, named-human authority, system non-authority, and cartridge claim boundary. Mutable save state is excluded. The builder and detached verifier independently recompute this digest. A changed invariant or acting-human rule with a stale declared digest refuses even after the volume file rows and `volumeId` are re-signed.\n\nThe exact public claim boundary and the distinct cartridge claim boundary are frozen constants.',
          )
          contract = contract.replace(
              'A build target must not already exist. The bootstrap and embedded verifier use only standard-library Python.',
              'A build target must not already exist. Both verifier entrypoints refuse `--out` when the destination is inside the volume, resolves through a symlink into the volume, or aliases an authoritative volume file. The refusal is emitted only to stdout, so verification cannot mutate the object it just measured. The bootstrap and embedded verifier use only standard-library Python.',
          )
          contract = contract.replace(
              'cartridge claim text\nroute denominator and decision chain',
              'cartridge claim text\ncartridge invariant and named-human law\nverdict output path overlapping the measured volume\nroute denominator and decision chain',
          )
          contract_path.write_text(contract, encoding='utf-8', newline='\n')

          review = review_path.read_text(encoding='utf-8')
          addition = '''

          ## Late custody closure

          Independent admission review found two further defects after the first semantic-closure campaign. The declared cartridge digest did not derive from the immutable law it purported to name, and either verifier entrypoint could write its `--out` receipt into the volume after a passing measurement. The successor derives the digest from canonical cartridge law in both builder and detached verifier, validates the actual cartridge before reconstruction, and refuses any verdict destination that resolves into or aliases the measured volume. The thirty-eight-method denominator contains direct builder drift, fully re-signed cartridge-law forgery, bootstrapped output-overlap, and direct-verifier output-overlap witnesses. No refusal writes through the rejected path.
          '''.replace('          ', '')
          if '## Late custody closure' in review:
              raise SystemExit('late custody closure already present')
          review_path.write_text(review.rstrip() + addition + '\n', encoding='utf-8', newline='\n')

          receipt = {
              'schema': 'axm-head-final-custody-repair/1',
              'fixtureCatalogCanonicalSha256': catalog_digest,
              'standaloneVerifierSha256': verifier_sha256,
              'bootstrapSha256': bootstrap_sha256,
              'focusedTestCount': 38,
              'claimBoundary': 'synthetic_contract_only',
              'executionOccurred': False,
              'authority': 'none',
          }
          receipt_path = Path('qualification/axm-head-final-custody/repair-receipt.json')
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_bytes(pretty_json_bytes(receipt))
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Qualify repaired source and hostile witnesses
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/axm_head_edge_demo.py \
            mating_surface/anchor_node/verify_axm_head_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_volume.py \
            mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-profile \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-fixtures \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json \
            mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
