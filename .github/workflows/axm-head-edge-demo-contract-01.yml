name: Close AXM HEAD cartridge and verdict output custody

on:
  push:
    branches:
      - work/axm-head-edge-demo-contract-01
    paths:
      - ".github/workflows/axm-head-edge-demo-contract-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-axm-head-final-custody
  cancel-in-progress: false

jobs:
  repair-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-edge-demo-contract-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Execute authenticated final-custody repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess
          import textwrap

          source_commit = "ce428cd0634ff344cd2eeb4fed475850d4d3037b"
          workflow_path = ".github/workflows/axm-head-edge-demo-contract-01.yml"
          expected_blob = "9d298466084558773a7f6169a99603612e5ca141"
          observed_blob = subprocess.check_output(
              ["git", "rev-parse", f"{source_commit}:{workflow_path}"],
              text=True,
          ).strip()
          if observed_blob != expected_blob:
              raise SystemExit(
                  f"repair carrier Git object differs: expected={expected_blob} observed={observed_blob}"
              )

          raw_bytes = subprocess.check_output(
              ["git", "show", f"{source_commit}:{workflow_path}"],
          )
          expected_raw_sha256 = "32f7ea47d814b5755595142384d4a8f2915fc32b01bea3ab8db49c988ab33f6c"
          observed_raw_sha256 = hashlib.sha256(raw_bytes).hexdigest()
          if observed_raw_sha256 != expected_raw_sha256:
              raise SystemExit(
                  f"repair carrier raw digest differs: expected={expected_raw_sha256} observed={observed_raw_sha256}"
              )
          raw = raw_bytes.decode("utf-8")

          start_marker = (
              "      - name: Bind cartridge law and protect verdict output custody\n"
              "        shell: bash\n"
              "        run: |\n"
              "          python - <<'PY'\n"
          )
          end_marker = "          PY\n\n      - name: Qualify repaired source and hostile witnesses"
          if raw.count(start_marker) != 1 or raw.count(end_marker) != 1:
              raise SystemExit(
                  f"final-custody carrier markers differ: start={raw.count(start_marker)} end={raw.count(end_marker)}"
              )
          script = textwrap.dedent(raw.split(start_marker, 1)[1].split(end_marker, 1)[0])
          if script.count("import re\n") != 1:
              raise SystemExit("repair-script import anchor differs")
          generated_helper = '''import re


def normalize_generated(value: str) -> str:
    lines = value.splitlines(keepends=True)
    if not lines:
        return value
    return lines[0] + "".join(
        line[10:] if line.startswith("          ") else line
        for line in lines[1:]
    )
'''
          script = script.replace("import re\n", generated_helper, 1)

          generated = re.compile(
              r"(?P<prefix>\b\w+\s*(?:=|\+=)\s*)'''(?P<body>.*?)'''\.replace\(\"          \", \"\"\)",
              re.DOTALL,
          )
          script, transformed = generated.subn(
              lambda match: (
                  match.group("prefix")
                  + "normalize_generated('''"
                  + match.group("body")
                  + "''')"
              ),
              script,
          )
          if transformed != 9:
              raise SystemExit(f"generated-block denominator differs: {transformed}")

          repair = Path("/tmp/axm-head-final-custody-repair.py")
          repair.write_text(script, encoding="utf-8", newline="\n")
          subprocess.run(["python", "-m", "py_compile", str(repair)], check=True)
          subprocess.run(["python", str(repair)], check=True)
          PY

      - name: Qualify repaired source and hostile witnesses
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/axm_head_edge_demo.py \
            mating_surface/anchor_node/verify_axm_head_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_volume.py \
            mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-profile \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-fixtures \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json \
            mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -v 2>&1 | tee qualification/axm-head-final-custody/test-output.txt
          grep -F "Ran 38 tests" qualification/axm-head-final-custody/test-output.txt
          grep -Fx "OK" qualification/axm-head-final-custody/test-output.txt

          PROFILE="mating_surface/anchor_node/axm-head-edge-demo-profile-01.json"
          FIXTURES="mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json"
          TOOL="mating_surface/anchor_node/axm_head_edge_demo.py"
          BOOTSTRAP="mating_surface/anchor_node/verify_axm_head_bootstrap.py"
          VOLUME="$RUNNER_TEMP/axm-head-final-custody-volume"
          VERDICT="$RUNNER_TEMP/axm-head-final-custody-verdict.json"
          python "$TOOL" build-volume "$PROFILE" "$FIXTURES" \
            qualified-gpu-with-resident-fallback --out "$VOLUME"
          python "$BOOTSTRAP" "$VOLUME" --out "$VERDICT"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["RUNNER_TEMP"])
          volume = root / "axm-head-final-custody-volume"
          verdict = json.loads((root / "axm-head-final-custody-verdict.json").read_text(encoding="utf-8"))
          manifest_path = volume / "MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          public_path = volume / "PUBLIC" / "status.json"
          receipt_path = Path("qualification/axm-head-final-custody/repair-receipt.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if verdict.get("status") != "PASS" or verdict.get("bootstrapAuthenticated") is not True:
              raise SystemExit("repaired reference volume did not pass authenticated verification")
          receipt.update(
              {
                  "caseId": manifest["caseId"],
                  "terminal": manifest["terminal"],
                  "volumeId": manifest["volumeId"],
                  "decisionId": verdict["decisionId"],
                  "manifestSha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                  "publicProjectionSha256": hashlib.sha256(public_path.read_bytes()).hexdigest(),
                  "authoritativeFileCount": verdict["fileCount"],
                  "successorAnswersReconstructed": verdict["successorAnswersReconstructed"],
                  "bootstrapAuthenticated": verdict["bootstrapAuthenticated"],
              }
          )
          receipt_path.write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          contract_path = Path("mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md")
          contract = contract_path.read_text(encoding="utf-8")
          replacements = {
              "axmheadvolume1_0c1149cac06338274e608cdf39013941ec00e45c0cf25b712e2600b0b9bf555d": receipt["volumeId"],
              "2281eaca3be7108fe419b036c1063162474872efdb5992518aec55fcbe24894b": receipt["manifestSha256"],
          }
          for old, new in replacements.items():
              if contract.count(old) != 1:
                  raise SystemExit(f"contract reference identity missing: {old}")
              contract = contract.replace(old, new)
          contract_path.write_text(contract, encoding="utf-8", newline="\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
          git diff --check

      - name: Preserve bounded repair receipt
        uses: actions/upload-artifact@v4
        with:
          name: axm-head-final-custody-${{ github.sha }}
          path: qualification/axm-head-final-custody/
          if-no-files-found: error
          retention-days: 14

      - name: Commit repaired product source
        shell: bash
        run: |
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add \
            mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md \
            mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-SEMANTIC-CLOSURE-REVIEW.md \
            mating_surface/anchor_node/axm_head_edge_demo.py \
            mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py \
            mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json \
            mating_surface/anchor_node/verify_axm_head_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_volume.py
          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              "mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md",
              "mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-SEMANTIC-CLOSURE-REVIEW.md",
              "mating_surface/anchor_node/axm_head_edge_demo.py",
              "mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py",
              "mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json",
              "mating_surface/anchor_node/verify_axm_head_bootstrap.py",
              "mating_surface/anchor_node/verify_axm_head_volume.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"staged repair denominator differs: missing={sorted(expected - actual)} "
                  f"extra={sorted(actual - expected)}"
              )
          PY
          git commit -m "Bind AXM cartridge law and verdict output custody"
          git push origin HEAD:refs/heads/work/axm-head-edge-demo-contract-01
