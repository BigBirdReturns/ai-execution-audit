name: Materialize AXM HEAD semantic repair

on:
  push:
    branches:
      - work/axm-head-edge-demo-contract-01
    paths:
      - ".axm-head-repair/**"
      - ".github/workflows/axm-head-edge-demo-contract-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-axm-head-semantic-repair
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-edge-demo-contract-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authenticate and materialize the bounded source payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import json
          import tarfile

          expected_payload_sha256 = "b3d5e2039b92d36536e31721698dae738682b4aa939d5a65cfab6f1ef7a4bc69"
          expected_files = {
              "mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md": {"bytes": 12007, "sha256": "6701402fc69bed3f00ced1c2104964d55f54e6f7365662161c2324b84e84008d"},
              "mating_surface/anchor_node/axm-head-edge-demo-profile-01.json": {"bytes": 2713, "sha256": "60cdb57ac4a0dccf7fc93f277b090d2417a745346073d672229e00205dba8b60"},
              "mating_surface/anchor_node/axm-head-edge-demo.ps1": {"bytes": 551, "sha256": "fe9ed0b669e197653ada9076615ea160e4e48de63e86db339526d76dd8960089"},
              "mating_surface/anchor_node/axm_head_edge_demo.py": {"bytes": 38604, "sha256": "adbe5f465621013d4d0a7eb2c46f78a96b1bc0c108098097341cf064c21afe0a"},
              "mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py": {"bytes": 23801, "sha256": "88033019fdffeb7fcd22f88dc46409be49b427f5790b5c05c7d26fe966ced45d"},
              "mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json": {"bytes": 17324, "sha256": "a212676c2d54e62d32472de6b26a337d7ba584320eca8bdafa79914608148ace"},
              "mating_surface/anchor_node/verify_axm_head_bootstrap.py": {"bytes": 5091, "sha256": "15be7b7e2c0885bc9efe515ef6c6152e38d22688144f1a62a73c63b7cd994165"},
              "mating_surface/anchor_node/verify_axm_head_volume.py": {"bytes": 43114, "sha256": "ef68da907bd5c196a3a10c2874dae20c42cdb547ba14030a968e99d866ee3542"},
          }

          part_names = [
              "part-00", "part-01", "part-02", "part-03",
              "fix-04a", "fix-04b", "fix-04c-exact",
              "part-05", "part-06",
          ]
          part_paths = [Path(".axm-head-repair") / name for name in part_names]
          if not all(path.is_file() for path in part_paths):
              raise SystemExit("repair payload part denominator differs")
          encoded = "".join("".join(path.read_text(encoding="ascii").split()) for path in part_paths)
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != expected_payload_sha256:
              raise SystemExit("repair payload digest differs")

          expected_members = {"PAYLOAD-MANIFEST.json", *expected_files}
          with tarfile.open(fileobj=io.BytesIO(compressed), mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if set(names) != expected_members or len(names) != len(expected_members):
                  raise SystemExit("repair archive member denominator differs")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe repair archive member: {member.name}")

              manifest_handle = archive.extractfile("PAYLOAD-MANIFEST.json")
              if manifest_handle is None:
                  raise SystemExit("repair payload manifest missing")
              manifest = json.loads(manifest_handle.read().decode("utf-8"))
              if manifest != {"schema": "axm-head-repair-payload/1", "files": expected_files}:
                  raise SystemExit("repair payload manifest differs")

              for relative, row in expected_files.items():
                  handle = archive.extractfile(relative)
                  if handle is None:
                      raise SystemExit(f"repair payload member missing: {relative}")
                  data = handle.read()
                  if len(data) != row["bytes"] or hashlib.sha256(data).hexdigest() != row["sha256"]:
                      raise SystemExit(f"repair payload member identity differs: {relative}")
                  target = Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          for relative, row in expected_files.items():
              data = Path(relative).read_bytes()
              if len(data) != row["bytes"] or hashlib.sha256(data).hexdigest() != row["sha256"]:
                  raise SystemExit(f"materialized source identity differs: {relative}")
          print("AXM HEAD semantic repair payload authenticated and materialized")
          PY

      - name: Qualify the materialized trust graph
        shell: bash
        run: |
          python -m py_compile \
            mating_surface/anchor_node/axm_head_edge_demo.py \
            mating_surface/anchor_node/verify_axm_head_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_volume.py \
            mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-profile \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json
          python mating_surface/anchor_node/axm_head_edge_demo.py validate-fixtures \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json \
            mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json
          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/axm-head-semantic-repair-tests.txt"
          grep -F "Ran 35 tests" "$RUNNER_TEMP/axm-head-semantic-repair-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/axm-head-semantic-repair-tests.txt"

          PROFILE="mating_surface/anchor_node/axm-head-edge-demo-profile-01.json"
          FIXTURES="mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json"
          TOOL="mating_surface/anchor_node/axm_head_edge_demo.py"
          BOOTSTRAP="mating_surface/anchor_node/verify_axm_head_bootstrap.py"
          VOLUME="$RUNNER_TEMP/axm-head-qualified-volume"
          FOREIGN="$RUNNER_TEMP/axm-head-foreign"
          mkdir -p "$FOREIGN"
          python "$TOOL" build-volume "$PROFILE" "$FIXTURES" \
            qualified-gpu-with-resident-fallback --out "$VOLUME"
          (
            cd "$FOREIGN"
            python "$GITHUB_WORKSPACE/$BOOTSTRAP" "$VOLUME" \
              --out "$RUNNER_TEMP/axm-head-semantic-repair-verdict.json"
          )
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          verdict = json.loads((Path(os.environ["RUNNER_TEMP"]) / "axm-head-semantic-repair-verdict.json").read_text(encoding="utf-8"))
          if verdict.get("status") != "PASS":
              raise SystemExit("materialized reference volume did not pass")
          if verdict.get("bootstrapAuthenticated") is not True:
              raise SystemExit("external verifier bootstrap did not authenticate")
          if verdict.get("successorAnswersReconstructed") is not True:
              raise SystemExit("successor answers were not reconstructed")
          PY

      - name: Commit only the repaired product and remove transport
        shell: bash
        run: |
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          cp .axm-head-repair/final-workflow.yml .github/workflows/axm-head-edge-demo-contract-01.yml
          git rm -r .axm-head-repair
          git add \
            .github/workflows/axm-head-edge-demo-contract-01.yml \
            mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md \
            mating_surface/anchor_node/axm-head-edge-demo-profile-01.json \
            mating_surface/anchor_node/axm-head-edge-demo.ps1 \
            mating_surface/anchor_node/axm_head_edge_demo.py \
            mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py \
            mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json \
            mating_surface/anchor_node/verify_axm_head_bootstrap.py \
            mating_surface/anchor_node/verify_axm_head_volume.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          permitted = {
              ".github/workflows/axm-head-edge-demo-contract-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-EDGE-DEMO-CONTRACT-01.md",
              "mating_surface/anchor_node/axm-head-edge-demo-profile-01.json",
              "mating_surface/anchor_node/axm-head-edge-demo.ps1",
              "mating_surface/anchor_node/axm_head_edge_demo.py",
              "mating_surface/anchor_node/conformance/test_axm_head_edge_demo.py",
              "mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json",
              "mating_surface/anchor_node/verify_axm_head_bootstrap.py",
              "mating_surface/anchor_node/verify_axm_head_volume.py",
          }
          required_changed = permitted - {
              "mating_surface/anchor_node/fixtures/axm-head-edge-demo-cases-01.json",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          unexpected = {path for path in actual if not path.startswith(".axm-head-repair/") and path not in permitted}
          missing = required_changed - actual
          if unexpected or missing:
              raise SystemExit(f"staged path denominator differs: unexpected={sorted(unexpected)} missing={sorted(missing)}")
          PY
          git commit -m "Close AXM HEAD semantic trust graph"
          git push origin HEAD:refs/heads/work/axm-head-edge-demo-contract-01