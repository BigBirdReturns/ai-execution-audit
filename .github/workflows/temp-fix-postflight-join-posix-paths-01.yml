name: TEMP fix postflight JOIN POSIX private paths retry 2

on:
  push:
    branches:
      - work/axm-head-postflight-join-final-conductor-01
    paths:
      - ".github/workflows/temp-fix-postflight-join-posix-paths-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-fix-postflight-join-posix-paths-01
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          ref: work/axm-head-postflight-join-final-conductor-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply POSIX private-path membrane repair
        shell: bash
        run: |
          python -m py_compile .github/temp-fix-postflight-join-posix-paths-01.py
          python .github/temp-fix-postflight-join-posix-paths-01.py

      - name: Qualify repaired permanent source
        shell: bash
        run: |
          set -euo pipefail
          TOOL="mating_surface/anchor_node/axm_head_physical_long_haul_join.py"
          PROFILE="mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json"
          FIXTURES="mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json"
          VERIFIER="mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py"
          TESTS="mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py"

          python -m py_compile "$TOOL" "$VERIFIER" "$TESTS"
          python "$TOOL" validate-profile "$PROFILE"
          python "$TOOL" validate-fixtures "$PROFILE" "$FIXTURES"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_long_haul_join.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/join-tests.txt"
          grep -F "Ran 81 tests" "$RUNNER_TEMP/join-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/join-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_physical_flight_preflight_review_card_01.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/preflight-tests.txt"
          grep -F "Ran 49 tests" "$RUNNER_TEMP/preflight-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/preflight-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_axm_head_edge_demo.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/axm-tests.txt"
          grep -F "Ran 38 tests" "$RUNNER_TEMP/axm-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/axm-tests.txt"

          python -m unittest discover \
            -s mating_surface/anchor_node/conformance \
            -p 'test_stc_mary_flight_conductor.py' \
            -v 2>&1 | tee "$RUNNER_TEMP/conductor-tests.txt"
          grep -F "Ran 32 tests" "$RUNNER_TEMP/conductor-tests.txt"
          grep -Fx "OK" "$RUNNER_TEMP/conductor-tests.txt"

          git diff --check

      - name: Commit permanent repair and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/temp-fix-postflight-join-posix-paths-01.yml
          rm .github/temp-fix-postflight-join-posix-paths-01.py
          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/axm-head-physical-long-haul-join-01.yml",
              "mating_surface/anchor_node/AXM-HEAD-PHYSICAL-LONG-HAUL-JOIN-01.md",
              "mating_surface/anchor_node/axm-head-physical-long-haul-join-profile-01.json",
              "mating_surface/anchor_node/axm-head-physical-long-haul-join.ps1",
              "mating_surface/anchor_node/axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/verify_axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/conformance/test_axm_head_physical_long_haul_join.py",
              "mating_surface/anchor_node/fixtures/axm-head-physical-long-haul-join-cases-01.json",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "dd486472a8c610a20ee062dd6746c86fe8ede4b4"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"permanent product denominator differs: expected={sorted(expected)} observed={sorted(actual)}"
              )
          PY

          git commit -m "Reject POSIX private paths at the postflight membrane"
          git push origin HEAD:refs/heads/work/axm-head-postflight-join-final-conductor-01
